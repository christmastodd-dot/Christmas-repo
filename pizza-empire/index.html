<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Pizza Empire</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">

    <!-- SPLASH -->
    <div id="splash">
      <div class="splash-pizza">🍕</div>
      <h1 class="splash-title">PIZZA EMPIRE</h1>
      <p class="splash-sub">Build it. Own it. Bury the competition.</p>
      <button class="btn btn-primary btn-block" id="start-btn">NEW GAME</button>
    </div>

    <!-- GAME (hidden until started) -->
    <div id="game" style="display:none; height:100%; display:none; flex-direction:column;">

      <header id="hdr">
        <div>
          <div id="hdr-cash">$100,000</div>
          <div id="hdr-date" class="hdr-sub">Day 1 · Month 1 · Year 1</div>
        </div>
        <div id="hdr-right">
          <div id="hdr-heat" class="heat-pill">🌡 0%</div>
        </div>
      </header>

      <main id="main"></main>

      <nav id="nav">
        <button class="nav-btn active" data-screen="city">
          <span class="nav-icon">🏙️</span>
          <span class="nav-label">City</span>
        </button>
        <button class="nav-btn" data-screen="kitchen">
          <span class="nav-icon">🍳</span>
          <span class="nav-label">Kitchen</span>
          <span class="nav-dot" id="dot-kitchen" style="display:none"></span>
        </button>
        <button class="nav-btn" data-screen="lab">
          <span class="nav-icon">🍕</span>
          <span class="nav-label">Lab</span>
        </button>
        <button class="nav-btn" data-screen="crime">
          <span class="nav-icon">🔪</span>
          <span class="nav-label">Crime</span>
          <span class="nav-dot" id="dot-crime" style="display:none"></span>
        </button>
      </nav>

    </div>

    <div id="toast-area"></div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/state.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
