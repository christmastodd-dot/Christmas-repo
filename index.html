<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Feral Chicken Hunt - Hawaii</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #1a1a1a;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    user-select: none; -webkit-user-select: none; touch-action: none; }
  #wrap { position: relative; width: 100vw; height: 100vh; display: flex;
    align-items: center; justify-content: center; }
  canvas { display: block; cursor: crosshair; image-rendering: pixelated;
    background: #87ceeb; touch-action: none; }
  #hud { position: absolute; top: 0; left: 0; right: 0; padding: 10px 14px;
    display: flex; justify-content: space-between; align-items: center;
    color: #fff; font-weight: 700; font-size: 18px; pointer-events: none;
    text-shadow: 2px 2px 0 #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000; }
  #hud .pill { background: rgba(0,0,0,0.35); padding: 6px 12px; border-radius: 20px;
    backdrop-filter: blur(4px); }
  #overlay { position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; background: rgba(0,0,0,0.55);
    color: #fff; text-align: center; padding: 20px; }
  #overlay.hidden { display: none; }
  #overlay h1 { font-size: clamp(28px, 7vw, 48px); margin-bottom: 8px;
    text-shadow: 3px 3px 0 #b8860b; }
  #overlay p { font-size: clamp(14px, 3.5vw, 18px); margin: 6px 0; max-width: 480px; }
  #overlay button { margin-top: 18px; padding: 14px 32px; font-size: 20px;
    font-weight: 700; border: none; border-radius: 999px; background: #ff6b35;
    color: #fff; cursor: pointer; box-shadow: 0 4px 0 #b8451f; }
  #overlay button:active { transform: translateY(2px); box-shadow: 0 2px 0 #b8451f; }
  .stat { color: #ffd700; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game"></canvas>
  <div id="hud">
    <div class="pill">Score: <span id="score">0</span></div>
    <div class="pill">Time: <span id="time">30</span>s</div>
    <div class="pill">Ammo: <span id="ammo">6</span></div>
  </div>
  <div id="overlay">
    <h1>Feral Chicken Hunt</h1>
    <p>Da chickens stay running wild all over Hawaii. Tap to shoot 'em!</p>
    <p>You get <span class="stat">6 shots</span> per reload (auto-reloads when empty).
       Bag as many as you can in <span class="stat">30 seconds</span>.</p>
    <button id="start">Start</button>
  </div>
</div>
<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  const timeEl = document.getElementById('time');
  const ammoEl = document.getElementById('ammo');
  const overlay = document.getElementById('overlay');
  const startBtn = document.getElementById('start');

  let W = 0, H = 0, dpr = 1;
  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W * dpr;
    canvas.height = H * dpr;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener('resize', resize);
  resize();

  const state = {
    running: false,
    score: 0,
    time: 30,
    ammo: 6,
    maxAmmo: 6,
    reloading: false,
    chickens: [],
    particles: [],
    floats: [],
    shots: [],
    spawnTimer: 0,
    elapsed: 0,
    lastT: 0,
    levelIdx: 0,
    levelDur: 15,
    mode: 'menu',           // 'menu' | 'playing' | 'levelEnd' | 'gameOver'
    banner: { text: '', life: 0 },
  };

  function showBanner(text) {
    state.banner = { text, life: 2.0 };
  }

  function drawBanner(dt) {
    if (state.banner.life <= 0) return;
    state.banner.life -= dt;
    const a = Math.min(1, state.banner.life * 1.2);
    ctx.save();
    ctx.globalAlpha = a;
    ctx.font = 'bold 34px sans-serif';
    ctx.textAlign = 'center';
    ctx.lineWidth = 5;
    ctx.strokeStyle = '#000';
    ctx.fillStyle = '#fff';
    ctx.strokeText(state.banner.text, W / 2, H * 0.22);
    ctx.fillText(state.banner.text, W / 2, H * 0.22);
    ctx.restore();
  }

  // ---------- Background ----------
  const clouds = Array.from({length: 5}, () => ({
    x: Math.random() * 1000, y: 40 + Math.random() * 80,
    s: 0.6 + Math.random() * 0.8, v: 4 + Math.random() * 6
  }));

  function drawSky() {
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#87ceeb');
    g.addColorStop(0.6, '#b9e3f3');
    g.addColorStop(1, '#f5e6c8');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
  }

  function drawClouds(dt) {
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    clouds.forEach(c => {
      c.x -= c.v * dt;
      if (c.x < -120) c.x = W + 80;
      const s = c.s * 30;
      ctx.beginPath();
      ctx.arc(c.x, c.y, s, 0, Math.PI * 2);
      ctx.arc(c.x + s * 0.9, c.y + 4, s * 0.8, 0, Math.PI * 2);
      ctx.arc(c.x - s * 0.9, c.y + 4, s * 0.7, 0, Math.PI * 2);
      ctx.arc(c.x + s * 0.3, c.y - s * 0.5, s * 0.7, 0, Math.PI * 2);
      ctx.fill();
    });
  }

  function drawMountains() {
    const horizon = H * 0.55;
    ctx.fillStyle = '#3d6b4a';
    ctx.beginPath();
    ctx.moveTo(0, horizon);
    for (let i = 0; i * 110 < W + 110; i++) {
      const peakX = i * 110 + 60;
      const peakY = horizon - 60 - ((peakX * 7919) % 80);
      ctx.lineTo(peakX - 60, horizon);
      ctx.lineTo(peakX, peakY);
    }
    ctx.lineTo(W, horizon);
    ctx.closePath();
    ctx.fill();
    // misty layer
    ctx.fillStyle = 'rgba(255,255,255,0.18)';
    ctx.fillRect(0, horizon - 20, W, 30);
  }

  function drawFrond(angle, length, droop, color) {
    ctx.save();
    ctx.rotate(angle);
    // main frond shape
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.bezierCurveTo(length * 0.4, droop * 0.15, length * 0.75, droop * 0.7, length, droop);
    ctx.bezierCurveTo(length * 0.7, droop * 0.5, length * 0.4, -1, 0, -5);
    ctx.closePath();
    ctx.fill();
    // central rib
    ctx.strokeStyle = 'rgba(0,30,0,0.45)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.bezierCurveTo(length * 0.4, droop * 0.1, length * 0.75, droop * 0.5, length * 0.98, droop * 0.85);
    ctx.stroke();
    // leaflet strokes
    ctx.lineWidth = 0.7;
    for (let i = 1; i < 9; i++) {
      const t = i / 9;
      const px = length * t;
      const py = droop * t * t * 0.9;
      ctx.beginPath();
      ctx.moveTo(px, py - 1);
      ctx.lineTo(px + 4, py - 7 - t * 3);
      ctx.moveTo(px, py + 1);
      ctx.lineTo(px + 4, py + 4 + t * 2);
      ctx.stroke();
    }
    ctx.restore();
  }

  function drawPalm(x, baseY, scale) {
    ctx.save();
    ctx.translate(x, baseY);
    ctx.scale(scale, scale);
    // trunk: gentle S curve via bezier
    ctx.fillStyle = '#8a6a44';
    ctx.beginPath();
    ctx.moveTo(-8, 0);
    ctx.bezierCurveTo(-13, -55, -3, -115, -9, -170);
    ctx.lineTo(3, -170);
    ctx.bezierCurveTo(9, -115, -1, -55, 8, 0);
    ctx.closePath();
    ctx.fill();
    // trunk shading (right side darker)
    ctx.fillStyle = 'rgba(60,40,20,0.35)';
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.bezierCurveTo(2, -55, -2, -115, 1, -170);
    ctx.lineTo(3, -170);
    ctx.bezierCurveTo(9, -115, -1, -55, 8, 0);
    ctx.closePath();
    ctx.fill();
    // trunk rings — curve to follow trunk
    ctx.strokeStyle = '#5a3a20';
    ctx.lineWidth = 1.2;
    for (let i = 1; i < 9; i++) {
      const ty = -i * 19;
      const xoff = Math.sin((ty + 80) / 60) * 3;
      ctx.beginPath();
      ctx.arc(xoff, ty, 7, 0.25, Math.PI - 0.25);
      ctx.stroke();
    }
    // crown shadow at top of trunk
    ctx.fillStyle = '#3a2614';
    ctx.beginPath();
    ctx.ellipse(-6, -170, 11, 4, 0, 0, Math.PI * 2);
    ctx.fill();
    // fronds: top half only, drooping outward
    ctx.save();
    ctx.translate(-6, -170);
    // back fronds (darker, drawn first)
    drawFrond(-Math.PI * 0.65, 60, 22, '#1d6b2e');
    drawFrond(-Math.PI * 0.35, 60, 22, '#1d6b2e');
    // front fronds (brighter)
    drawFrond(-Math.PI * 0.92, 78, 38, '#2d8a3e');
    drawFrond(-Math.PI * 0.55, 80, 32, '#2d8a3e');
    drawFrond(-Math.PI * 0.18, 82, 38, '#2d8a3e');
    drawFrond(Math.PI * 0.05,  72, 45, '#358e44');
    drawFrond(-Math.PI * 1.05, 72, 45, '#358e44');
    ctx.restore();
    // coconut cluster
    const coconuts = [{x:-3,y:-162},{x:3,y:-160},{x:-1,y:-167},{x:6,y:-164},{x:-7,y:-164}];
    ctx.fillStyle = '#3a2410';
    coconuts.forEach(c => {
      ctx.beginPath();
      ctx.arc(c.x, c.y, 3.5, 0, Math.PI * 2);
      ctx.fill();
    });
    // coconut highlights
    ctx.fillStyle = '#7a5a30';
    coconuts.forEach(c => {
      ctx.beginPath();
      ctx.arc(c.x - 1, c.y - 1, 1.2, 0, Math.PI * 2);
      ctx.fill();
    });
    ctx.restore();
  }

  // ---------- Levels (backdrops) ----------
  function drawStorefront(cx, baseY) {
    ctx.save();
    ctx.translate(cx, baseY);
    const w = Math.min(W * 0.55, 360), h = 56;
    // building body
    ctx.fillStyle = '#d8b88a';
    ctx.fillRect(-w / 2, -h, w, h);
    // roof cap
    ctx.fillStyle = '#5a5a5a';
    ctx.fillRect(-w / 2 - 6, -h - 6, w + 12, 6);
    // sign band
    ctx.fillStyle = '#1f6f3a';
    ctx.fillRect(-w / 2, -h, w, 16);
    // sign text
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 13px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('FOODLAND', 0, -h + 8);
    // window/door bays
    ctx.fillStyle = '#2a3a4a';
    const bays = 5;
    const bayW = (w - 30) / bays;
    for (let i = 0; i < bays; i++) {
      ctx.fillRect(-w / 2 + 15 + i * bayW + 4, -h + 22, bayW - 8, 26);
    }
    // door highlight
    ctx.fillStyle = '#5a8aa8';
    ctx.fillRect(-8, -h + 30, 16, 18);
    ctx.textBaseline = 'alphabetic';
    ctx.restore();
  }

  function drawCar(cx, by, color) {
    ctx.save();
    ctx.translate(cx, by);
    // body
    ctx.fillStyle = color;
    ctx.fillRect(-32, -22, 64, 22);
    // cabin
    ctx.fillRect(-22, -34, 44, 13);
    // roof shine
    ctx.fillStyle = 'rgba(255,255,255,0.18)';
    ctx.fillRect(-22, -34, 44, 3);
    // windows
    ctx.fillStyle = '#7aa8d8';
    ctx.fillRect(-20, -32, 18, 10);
    ctx.fillRect(2, -32, 18, 10);
    // window divider
    ctx.fillStyle = color;
    ctx.fillRect(-2, -32, 4, 10);
    // wheels
    ctx.fillStyle = '#1a1a1a';
    ctx.beginPath();
    ctx.arc(-19, 0, 6, 0, Math.PI * 2);
    ctx.arc(19, 0, 6, 0, Math.PI * 2);
    ctx.fill();
    // hub
    ctx.fillStyle = '#7a7a7a';
    ctx.beginPath();
    ctx.arc(-19, 0, 2, 0, Math.PI * 2);
    ctx.arc(19, 0, 2, 0, Math.PI * 2);
    ctx.fill();
    // headlight
    ctx.fillStyle = '#fff5a8';
    ctx.fillRect(30, -16, 3, 4);
    // taillight
    ctx.fillStyle = '#c93838';
    ctx.fillRect(-33, -16, 3, 4);
    ctx.restore();
  }

  function drawShoppingCart(cx, by) {
    ctx.save();
    ctx.translate(cx, by);
    ctx.strokeStyle = '#aaa';
    ctx.lineWidth = 1.5;
    // basket
    ctx.beginPath();
    ctx.moveTo(-10, -10); ctx.lineTo(10, -10);
    ctx.lineTo(8, 0); ctx.lineTo(-8, 0);
    ctx.closePath();
    ctx.stroke();
    // grid
    for (let i = -7; i < 9; i += 4) {
      ctx.beginPath();
      ctx.moveTo(i, -10); ctx.lineTo(i - 1, 0);
      ctx.stroke();
    }
    ctx.beginPath();
    ctx.moveTo(-9, -5); ctx.lineTo(9, -5);
    ctx.stroke();
    // handle
    ctx.beginPath();
    ctx.moveTo(10, -10); ctx.lineTo(13, -14);
    ctx.stroke();
    // wheels
    ctx.fillStyle = '#333';
    ctx.beginPath();
    ctx.arc(-7, 3, 2, 0, Math.PI * 2);
    ctx.arc(7, 3, 2, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  function drawParkingLot() {
    drawMountains();
    const horizon = H * 0.55;
    // grass strip between mountains and asphalt
    const asphaltTop = H * 0.7;
    ctx.fillStyle = '#5fa84a';
    ctx.fillRect(0, horizon, W, asphaltTop - horizon);
    // storefront sits on the grass band, well behind the parking spaces
    drawStorefront(W * 0.5, asphaltTop - 4);
    // asphalt
    const g = ctx.createLinearGradient(0, asphaltTop, 0, H);
    g.addColorStop(0, '#4a4a4a');
    g.addColorStop(1, '#2c2c2c');
    ctx.fillStyle = g;
    ctx.fillRect(0, asphaltTop, W, H - asphaltTop);
    // concrete curb
    ctx.fillStyle = '#a8a8a8';
    ctx.fillRect(0, asphaltTop - 5, W, 5);
    ctx.fillStyle = 'rgba(0,0,0,0.25)';
    ctx.fillRect(0, asphaltTop, W, 2);
    // parking space lines (white perpendicular)
    ctx.strokeStyle = '#f0ead8';
    ctx.lineWidth = 3;
    const spaceW = 78;
    const lineTop = asphaltTop + 6;
    const lineBot = H * 0.92;
    for (let lx = (W % spaceW) / 2; lx <= W; lx += spaceW) {
      ctx.beginPath();
      ctx.moveTo(lx, lineTop);
      ctx.lineTo(lx, lineBot);
      ctx.stroke();
    }
    // drive lane (dashed yellow) closer to camera
    ctx.strokeStyle = '#f5d042';
    ctx.lineWidth = 3;
    ctx.setLineDash([18, 14]);
    ctx.beginPath();
    ctx.moveTo(0, H * 0.96);
    ctx.lineTo(W, H * 0.96);
    ctx.stroke();
    ctx.setLineDash([]);
    // grass tufts
    ctx.fillStyle = '#4a8a3a';
    for (let i = 0; i < 30; i++) {
      const gx = (i * 137) % W;
      const gy = horizon + 10 + ((i * 53) % (asphaltTop - horizon - 12));
      ctx.fillRect(gx, gy, 2, 4);
      ctx.fillRect(gx + 3, gy + 1, 2, 3);
    }
    // parked cars (in upper portion of lot — further from camera)
    const carRow = asphaltTop + 28;
    drawCar(W * 0.18, carRow, '#c93a3a');
    drawCar(W * 0.42, carRow, '#3a6bc9');
    drawCar(W * 0.82, carRow, '#e8c948');
    // a stray shopping cart
    drawShoppingCart(W * 0.62, asphaltTop + 22);
    // palms framing the scene
    drawPalm(W * 0.06, asphaltTop + 2, 0.7);
    drawPalm(W * 0.96, asphaltTop + 6, 0.8);
  }

  function drawBanyanPark() {
    const horizon = H * 0.55;
    // distant rolling hills
    ctx.fillStyle = '#4a7a4a';
    ctx.beginPath();
    ctx.moveTo(0, horizon);
    for (let i = 0; i * 90 < W + 90; i++) {
      const px = i * 90 + 30;
      const py = horizon - 22 - ((px * 7919) % 22);
      ctx.lineTo(px - 45, horizon);
      ctx.quadraticCurveTo(px, py, px + 45, horizon);
    }
    ctx.lineTo(W, horizon);
    ctx.closePath();
    ctx.fill();
    // grass field gradient
    const g = ctx.createLinearGradient(0, horizon, 0, H);
    g.addColorStop(0, '#5fa84a');
    g.addColorStop(1, '#3d7a30');
    ctx.fillStyle = g;
    ctx.fillRect(0, horizon, W, H - horizon);
    // grass tufts
    ctx.fillStyle = '#4a8a3a';
    for (let i = 0; i < 60; i++) {
      const gx = (i * 137) % W;
      const gy = horizon + 15 + ((i * 53) % (H - horizon - 25));
      ctx.fillRect(gx, gy, 2, 4);
      ctx.fillRect(gx + 3, gy + 1, 2, 3);
    }
    drawBanyan(W * 0.22, H * 0.88, 1.1);
    drawPicnicTable(W * 0.78, H * 0.84);
  }

  function drawBanyan(x, baseY, scale) {
    ctx.save();
    ctx.translate(x, baseY);
    ctx.scale(scale, scale);
    // aerial roots
    ctx.fillStyle = '#5a3a20';
    for (let i = -3; i <= 3; i++) {
      const rx = i * 14;
      const len = 100 + Math.abs(i) * 8;
      ctx.fillRect(rx - 3, -len, 6, len);
    }
    // main trunk
    ctx.fillStyle = '#6b4423';
    ctx.beginPath();
    ctx.moveTo(-32, 0);
    ctx.quadraticCurveTo(-26, -100, -22, -150);
    ctx.lineTo(22, -150);
    ctx.quadraticCurveTo(26, -100, 32, 0);
    ctx.closePath();
    ctx.fill();
    // canopy
    ctx.fillStyle = '#2d6b2e';
    const blobs = [{x:0,y:-200,r:65},{x:-55,y:-175,r:50},{x:60,y:-175,r:55},
                   {x:-30,y:-225,r:42},{x:35,y:-225,r:45}];
    blobs.forEach(b => { ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI*2); ctx.fill(); });
    ctx.fillStyle = '#3d8a3e';
    blobs.forEach(b => {
      ctx.beginPath();
      ctx.arc(b.x - b.r * 0.3, b.y - b.r * 0.3, b.r * 0.5, 0, Math.PI*2);
      ctx.fill();
    });
    ctx.restore();
  }

  function drawPicnicTable(x, y) {
    ctx.save();
    ctx.translate(x, y);
    ctx.fillStyle = '#7a5530';
    // bench legs
    ctx.fillRect(-30, 0, 4, 20);
    ctx.fillRect(26, 0, 4, 20);
    // table legs
    ctx.fillRect(-30, -28, 4, 28);
    ctx.fillRect(26, -28, 4, 28);
    // table top
    ctx.fillStyle = '#8b6739';
    ctx.fillRect(-38, -32, 76, 6);
    // bench seat
    ctx.fillRect(-38, 0, 76, 4);
    ctx.restore();
  }

  function drawBeachPark() {
    const horizon = H * 0.55;
    // distant ocean strip + island
    ctx.fillStyle = '#3a7ca5';
    ctx.fillRect(0, horizon - 12, W, 14);
    ctx.fillStyle = '#5a7a6a';
    ctx.beginPath();
    ctx.moveTo(W * 0.62, horizon - 12);
    ctx.quadraticCurveTo(W * 0.72, horizon - 38, W * 0.82, horizon - 12);
    ctx.fill();
    // wave foam
    ctx.fillStyle = '#fff';
    for (let i = 0; i < W; i += 12) {
      if (((i * 17) % 30) < 15) ctx.fillRect(i, horizon - 2, 6, 2);
    }
    // sand
    const g = ctx.createLinearGradient(0, horizon, 0, H);
    g.addColorStop(0, '#ecd9a8');
    g.addColorStop(1, '#d4b878');
    ctx.fillStyle = g;
    ctx.fillRect(0, horizon, W, H - horizon);
    // shells / specks
    ctx.fillStyle = '#a89060';
    for (let i = 0; i < 60; i++) {
      const sx = (i * 213) % W;
      const sy = horizon + 30 + ((i * 71) % (H - horizon - 35));
      ctx.fillRect(sx, sy, 2, 2);
    }
    drawBeachUmbrella(W * 0.14, H * 0.82);
    drawPalm(W * 0.88, H * 0.86, 0.9);
  }

  function drawBeachUmbrella(x, y) {
    ctx.save();
    ctx.translate(x, y);
    ctx.strokeStyle = '#5a3a1a';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(0, 0); ctx.lineTo(0, -80);
    ctx.stroke();
    const stripes = ['#e64545','#f5f1e8','#e64545','#f5f1e8','#e64545'];
    for (let i = 0; i < stripes.length; i++) {
      ctx.fillStyle = stripes[i];
      ctx.beginPath();
      const a0 = Math.PI + (i / stripes.length) * Math.PI;
      const a1 = Math.PI + ((i + 1) / stripes.length) * Math.PI;
      ctx.moveTo(0, -80);
      ctx.arc(0, -80, 42, a0, a1);
      ctx.closePath();
      ctx.fill();
    }
    // tip
    ctx.fillStyle = '#8b6739';
    ctx.fillRect(-1, -86, 2, 6);
    ctx.restore();
  }

  const LEVELS = [
    { name: 'Foodland Parking Lot', draw: drawParkingLot },
    { name: 'Banyan Park',          draw: drawBanyanPark },
    { name: 'Beach Park',           draw: drawBeachPark },
  ];

  // ---------- Chicken species ----------
  const SPECIES = {
    hen: {
      weight: 1.0, speedMult: 1.0, pointsMult: 1.0, sizeMult: 1.0,
      combScale: 1.0,
      colors: { body:'#f5f1e8', patch:'#8b5a3c', tail:'#2a2a2a',
                comb:'#d23838', beak:'#e8a83a', legs:'#e8a83a' },
      featherColors: ['#fff','#fff','#fff','#fff','#fff','#fff','#fff','#8b5a3c','#8b5a3c','#8b5a3c'],
    },
    rooster: {
      weight: 0.55, speedMult: 1.35, pointsMult: 2.0, sizeMult: 1.05,
      combScale: 1.7,
      colors: { body:'#5c3a26', patch:'#2a1810', tail:'#0a4d0a',
                comb:'#d63333', beak:'#e8a83a', legs:'#c98520' },
      featherColors: ['#5c3a26','#5c3a26','#2a1810','#0a4d0a','#0a4d0a','#d63333'],
    },
    chick: {
      weight: 0.7, speedMult: 0.65, pointsMult: 0.7, sizeMult: 0.55,
      combScale: 0,
      colors: { body:'#fff7a8', patch:'#ffe066', tail:'#ffd042',
                comb:'#ffb84d', beak:'#e8a83a', legs:'#e8a83a' },
      featherColors: ['#fff7a8','#fff7a8','#ffe066','#ffd042'],
    },
    golden: {
      weight: 0.05, speedMult: 1.7, pointsMult: 5.0, sizeMult: 1.0,
      combScale: 1.2, sparkle: true,
      colors: { body:'#ffd700', patch:'#daa520', tail:'#b8860b',
                comb:'#ff4500', beak:'#fff5b8', legs:'#fff5b8' },
      featherColors: ['#ffd700','#ffeb3b','#fff5b8','#daa520','#fff'],
    },
  };

  function pickSpecies() {
    let total = 0;
    for (const k in SPECIES) total += SPECIES[k].weight;
    let r = Math.random() * total;
    for (const k in SPECIES) {
      r -= SPECIES[k].weight;
      if (r <= 0) return k;
    }
    return 'hen';
  }

  function spawnChicken() {
    const fromLeft = Math.random() < 0.5;
    const horizon = H * 0.55;
    const groundTop = horizon + 20;
    const groundBot = H * 0.92;
    const y = groundTop + Math.random() * (groundBot - groundTop);
    // perspective: closer (lower y) = bigger
    const t = (y - groundTop) / (groundBot - groundTop);
    const baseScale = 0.5 + t * 0.9;
    const type = pickSpecies();
    const sp = SPECIES[type];
    const speed = (60 + Math.random() * 70) * (0.7 + t * 0.6) * sp.speedMult;
    state.chickens.push({
      type,
      x: fromLeft ? -40 : W + 40,
      y,
      scale: baseScale * sp.sizeMult,
      vx: fromLeft ? speed : -speed,
      bob: Math.random() * Math.PI * 2,
      legPhase: 0,
      alive: true,
      fallV: 0,
      points: Math.round((50 / baseScale) * sp.pointsMult),
    });
  }

  function drawChicken(c) {
    const sp = SPECIES[c.type];
    const cols = sp.colors;
    ctx.save();
    ctx.translate(c.x, c.y);
    const facing = c.vx < 0 ? -1 : 1;
    ctx.scale(c.scale * facing, c.scale);
    if (!c.alive) {
      ctx.rotate(0.6 * facing);
    } else {
      ctx.translate(0, Math.sin(c.bob) * 1.5);
    }
    // legs
    if (c.alive) {
      ctx.strokeStyle = cols.legs;
      ctx.lineWidth = 2;
      const lp = Math.sin(c.legPhase) * 4;
      ctx.beginPath();
      ctx.moveTo(-4, 8); ctx.lineTo(-4 + lp, 18);
      ctx.moveTo(4, 8); ctx.lineTo(4 - lp, 18);
      ctx.stroke();
    }
    // body
    ctx.fillStyle = cols.body;
    ctx.beginPath();
    ctx.ellipse(0, 0, 14, 10, 0, 0, Math.PI * 2);
    ctx.fill();
    // patch
    ctx.fillStyle = cols.patch;
    ctx.beginPath();
    ctx.ellipse(-3, -2, 7, 5, -0.3, 0, Math.PI * 2);
    ctx.fill();
    // tail feathers
    ctx.fillStyle = cols.tail;
    ctx.beginPath();
    ctx.moveTo(-12, -2);
    ctx.lineTo(-20, -8);
    ctx.lineTo(-18, 0);
    ctx.lineTo(-20, 6);
    ctx.closePath();
    ctx.fill();
    // head
    ctx.fillStyle = cols.body;
    ctx.beginPath();
    ctx.arc(11, -6, 6, 0, Math.PI * 2);
    ctx.fill();
    // comb + wattle (skipped for chicks)
    if (sp.combScale > 0) {
      const cs = sp.combScale;
      ctx.fillStyle = cols.comb;
      ctx.beginPath();
      ctx.arc(11, -11, 2 * cs, 0, Math.PI * 2);
      ctx.arc(13, -12, 2 * cs, 0, Math.PI * 2);
      ctx.arc(9, -12, 2 * cs, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.arc(13, -2, 2, 0, Math.PI * 2);
      ctx.fill();
    }
    // beak
    ctx.fillStyle = cols.beak;
    ctx.beginPath();
    ctx.moveTo(16, -6);
    ctx.lineTo(20, -5);
    ctx.lineTo(16, -4);
    ctx.closePath();
    ctx.fill();
    // eye
    ctx.fillStyle = '#000';
    ctx.beginPath();
    ctx.arc(13, -7, 1, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  // ---------- Particles & FX ----------
  function emitFeathers(x, y, n, colors) {
    for (let i = 0; i < n; i++) {
      state.particles.push({
        x, y,
        vx: (Math.random() - 0.5) * 120,
        vy: -60 - Math.random() * 80,
        life: 1.2,
        color: colors[Math.floor(Math.random() * colors.length)],
        size: 3 + Math.random() * 3,
        rot: Math.random() * Math.PI,
        vr: (Math.random() - 0.5) * 6,
      });
    }
  }

  function addFloat(x, y, text, color) {
    state.floats.push({ x, y, text, color, life: 1.0 });
  }

  function drawParticles(dt) {
    state.particles.forEach(p => {
      p.life -= dt;
      p.vy += 200 * dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.rot += p.vr * dt;
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.globalAlpha = Math.max(0, p.life);
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.6);
      ctx.restore();
    });
    state.particles = state.particles.filter(p => p.life > 0);
    ctx.globalAlpha = 1;
  }

  function drawFloats(dt) {
    ctx.font = 'bold 22px sans-serif';
    ctx.textAlign = 'center';
    state.floats.forEach(f => {
      f.life -= dt;
      f.y -= 40 * dt;
      ctx.globalAlpha = Math.max(0, f.life);
      ctx.fillStyle = f.color;
      ctx.strokeStyle = '#000';
      ctx.lineWidth = 3;
      ctx.strokeText(f.text, f.x, f.y);
      ctx.fillText(f.text, f.x, f.y);
    });
    state.floats = state.floats.filter(f => f.life > 0);
    ctx.globalAlpha = 1;
  }

  function drawShots(dt) {
    state.shots.forEach(s => {
      s.life -= dt;
      ctx.strokeStyle = `rgba(255,255,255,${Math.max(0, s.life * 2)})`;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(s.x, s.y, 18 * (1 - s.life * 2), 0, Math.PI * 2);
      ctx.stroke();
    });
    state.shots = state.shots.filter(s => s.life > 0);
  }

  // ---------- Audio (tiny WebAudio beeps) ----------
  let actx;
  function blip(freq, dur, type = 'square', vol = 0.15) {
    try {
      if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
      const o = actx.createOscillator();
      const g = actx.createGain();
      o.type = type; o.frequency.value = freq;
      g.gain.value = vol;
      g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + dur);
      o.connect(g).connect(actx.destination);
      o.start();
      o.stop(actx.currentTime + dur);
    } catch (e) {}
  }
  const sndShot = () => blip(180, 0.08, 'square', 0.18);
  const sndHit = () => { blip(720, 0.06, 'square'); setTimeout(() => blip(420, 0.1, 'triangle'), 50); };
  const sndMiss = () => blip(90, 0.1, 'sawtooth', 0.08);
  const sndReload = () => blip(300, 0.05, 'square', 0.1);

  // ---------- Input ----------
  function shoot(px, py) {
    if (!state.running) return;
    if (state.reloading) return;
    if (state.ammo <= 0) return;
    state.ammo--;
    state.shots.push({ x: px, y: py, life: 0.5 });
    sndShot();
    let hit = false;
    // hit-test newest (front-most) first
    for (let i = state.chickens.length - 1; i >= 0; i--) {
      const c = state.chickens[i];
      if (!c.alive) continue;
      const r = 18 * c.scale;
      const dx = px - c.x, dy = py - c.y;
      if (dx * dx + dy * dy < r * r) {
        c.alive = false;
        c.fallV = -120;
        state.score += c.points;
        addFloat(c.x, c.y - 20, '+' + c.points, '#ffd700');
        emitFeathers(c.x, c.y, 14, SPECIES[c.type].featherColors);
        sndHit();
        hit = true;
        break;
      }
    }
    if (!hit) sndMiss();
    updateHUD();
    if (state.ammo === 0) startReload();
  }

  function startReload() {
    state.reloading = true;
    ammoEl.textContent = '...';
    setTimeout(() => {
      state.ammo = state.maxAmmo;
      state.reloading = false;
      sndReload();
      updateHUD();
    }, 800);
  }

  canvas.addEventListener('pointerdown', e => {
    e.preventDefault();
    const rect = canvas.getBoundingClientRect();
    shoot(e.clientX - rect.left, e.clientY - rect.top);
  });

  // ---------- Game loop ----------
  function updateHUD() {
    scoreEl.textContent = state.score;
    timeEl.textContent = Math.max(0, Math.ceil(state.time));
    if (!state.reloading) ammoEl.textContent = state.ammo;
  }

  function update(dt) {
    state.spawnTimer -= dt;
    if (state.spawnTimer <= 0) {
      spawnChicken();
      state.spawnTimer = 0.5 + Math.random() * 0.9;
    }
    state.chickens.forEach(c => {
      if (c.alive) {
        c.x += c.vx * dt;
        c.bob += dt * 8;
        c.legPhase += dt * 12;
        if (SPECIES[c.type].sparkle && Math.random() < 0.5) {
          state.particles.push({
            x: c.x + (Math.random() - 0.5) * 32 * c.scale,
            y: c.y + (Math.random() - 0.5) * 22 * c.scale,
            vx: 0, vy: -10,
            life: 0.5,
            color: Math.random() < 0.5 ? '#ffd700' : '#fff5b8',
            size: 2 + Math.random() * 2,
            rot: 0, vr: 0,
          });
        }
      } else {
        c.fallV += 600 * dt;
        c.y += c.fallV * dt;
      }
    });
    state.chickens = state.chickens.filter(c => {
      if (!c.alive && c.y > H + 40) return false;
      if (c.alive && (c.x < -80 || c.x > W + 80)) return false;
      return true;
    });
    state.time -= dt;
    if (state.time <= 0) {
      if (state.levelIdx >= LEVELS.length - 1) {
        endGame();
      } else {
        showLevelEnd();
      }
    }
  }

  function render(dt) {
    drawSky();
    drawClouds(dt);
    LEVELS[state.levelIdx].draw();
    // sort chickens back-to-front (smaller scale = farther = behind)
    const sorted = [...state.chickens].sort((a, b) => a.y - b.y);
    sorted.forEach(drawChicken);
    drawParticles(dt);
    drawShots(dt);
    drawFloats(dt);
    drawBanner(dt);
  }

  function loop(t) {
    if (!state.running) return;
    const dt = Math.min(0.05, (t - state.lastT) / 1000 || 0);
    state.lastT = t;
    update(dt);
    render(dt);
    updateHUD();
    requestAnimationFrame(loop);
  }

  function startGame() {
    state.running = true;
    state.mode = 'playing';
    state.score = 0;
    state.time = state.levelDur;
    state.ammo = state.maxAmmo;
    state.reloading = false;
    state.chickens = [];
    state.particles = [];
    state.floats = [];
    state.shots = [];
    state.spawnTimer = 0;
    state.levelIdx = 0;
    state.banner = { text: '', life: 0 };
    state.lastT = performance.now();
    overlay.classList.add('hidden');
    showBanner(LEVELS[0].name);
    updateHUD();
    requestAnimationFrame(loop);
  }

  function showLevelEnd() {
    state.running = false;
    state.mode = 'levelEnd';
    const cleared = LEVELS[state.levelIdx].name;
    const next = LEVELS[state.levelIdx + 1].name;
    overlay.classList.remove('hidden');
    overlay.querySelector('h1').textContent = cleared + ' — Pau!';
    overlay.querySelector('p').innerHTML =
      `Score so far: <span class="stat">${state.score}</span>`;
    overlay.querySelectorAll('p')[1].innerHTML =
      `Next stop: <span class="stat">${next}</span>`;
    startBtn.textContent = 'Proceed';
  }

  function nextLevel() {
    state.levelIdx++;
    state.time = state.levelDur;
    state.ammo = state.maxAmmo;
    state.reloading = false;
    state.spawnTimer = 0.3;
    state.chickens = [];
    state.particles = [];
    state.shots = [];
    state.mode = 'playing';
    state.running = true;
    state.lastT = performance.now();
    overlay.classList.add('hidden');
    showBanner(LEVELS[state.levelIdx].name);
    updateHUD();
    requestAnimationFrame(loop);
  }

  function endGame() {
    state.running = false;
    state.mode = 'gameOver';
    overlay.classList.remove('hidden');
    overlay.querySelector('h1').textContent = 'Hunt Pau!';
    overlay.querySelector('p').innerHTML =
      `You bagged <span class="stat">${state.score}</span> points worth of chickens.`;
    overlay.querySelectorAll('p')[1].innerHTML =
      state.score > 1200 ? 'Da kine sharpshooter! 🎯' :
      state.score > 600  ? 'Solid hunt, bruddah.' :
      'Try again, those chickens stay sneaky.';
    startBtn.textContent = 'Play Again';
  }

  startBtn.addEventListener('click', () => {
    if (state.mode === 'levelEnd') nextLevel();
    else startGame();
  });
})();
</script>
</body>
</html>
