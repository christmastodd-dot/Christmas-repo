<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Feral Chicken Hunt - Hawaii</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #1a1a1a;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    user-select: none; -webkit-user-select: none; touch-action: none; }
  #wrap { position: relative; width: 100vw; height: 100vh; display: flex;
    align-items: center; justify-content: center; }
  canvas { display: block; cursor: crosshair; image-rendering: pixelated;
    background: #87ceeb; touch-action: none; }
  #hud { position: absolute; top: 0; left: 0; right: 0; padding: 10px 14px;
    display: flex; justify-content: space-between; align-items: center;
    color: #fff; font-weight: 700; font-size: 18px; pointer-events: none;
    text-shadow: 2px 2px 0 #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000; }
  #hud .pill { background: rgba(0,0,0,0.35); padding: 6px 12px; border-radius: 20px;
    backdrop-filter: blur(4px); }
  #targetsBar { position: absolute; bottom: 14px; left: 50%;
    transform: translateX(-50%); display: flex; gap: 7px;
    padding: 8px 16px; background: rgba(0,0,0,0.5); border-radius: 999px;
    pointer-events: none; backdrop-filter: blur(4px);
    box-shadow: 0 0 0 2px rgba(255,255,255,0.08); }
  #targetsBar.hidden { display: none; }
  .dot { width: 12px; height: 12px; border-radius: 50%;
    background: rgba(255,255,255,0.22); transition: background 0.15s; }
  .dot.hit { background: #5cc05c; box-shadow: 0 0 6px #5cc05c; }
  .dot.miss { background: #c93a3a; }
  .dot.quota { outline: 2px solid rgba(255,215,0,0.8); outline-offset: 2px; }
  #overlay { position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; background: rgba(0,0,0,0.55);
    color: #fff; text-align: center; padding: 20px; }
  #overlay.hidden { display: none; }
  #overlay h1 { font-size: clamp(28px, 7vw, 48px); margin-bottom: 8px;
    text-shadow: 3px 3px 0 #b8860b; }
  #overlay p { font-size: clamp(14px, 3.5vw, 18px); margin: 6px 0; max-width: 480px; }
  #overlay button { margin-top: 18px; padding: 14px 32px; font-size: 20px;
    font-weight: 700; border: none; border-radius: 999px; background: #ff6b35;
    color: #fff; cursor: pointer; box-shadow: 0 4px 0 #b8451f; }
  #overlay button:active { transform: translateY(2px); box-shadow: 0 2px 0 #b8451f; }
  .stat { color: #ffd700; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game"></canvas>
  <div id="hud">
    <div class="pill">Score: <span id="score">0</span></div>
    <div class="pill">Round: <span id="round">1</span>/3</div>
    <div class="pill">Time: <span id="time">0</span>s</div>
    <div class="pill">Ammo: <span id="ammo">6</span></div>
  </div>
  <div id="targetsBar" class="hidden"></div>
  <div id="overlay">
    <h1>Feral Chicken Hunt</h1>
    <p>Da chickens stay running wild all over Hawaii. Tap to shoot 'em!</p>
    <p>Each round spawns <span class="stat">10 chickens</span>. Hit at least
       <span class="stat">6</span> to advance. Three rounds to clear the hunt.</p>
    <p>Misses cost <span class="stat">−25</span> points. Finish quick for a
       <span class="stat">time bonus</span> up to <span class="stat">+500</span>.</p>
    <button id="start">Start</button>
  </div>
</div>
<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  const roundEl = document.getElementById('round');
  const timeEl = document.getElementById('time');
  const ammoEl = document.getElementById('ammo');
  const overlay = document.getElementById('overlay');
  const startBtn = document.getElementById('start');
  const targetsBar = document.getElementById('targetsBar');

  const ROUND_SIZE = 10;
  const ROUND_QUOTA = 6;
  const dotEls = [];
  for (let i = 0; i < ROUND_SIZE; i++) {
    const d = document.createElement('span');
    d.className = 'dot' + (i === ROUND_QUOTA - 1 ? ' quota' : '');
    targetsBar.appendChild(d);
    dotEls.push(d);
  }

  let W = 0, H = 0, dpr = 1;
  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W * dpr;
    canvas.height = H * dpr;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener('resize', resize);
  resize();

  const state = {
    running: false,
    score: 0,
    ammo: 6,
    maxAmmo: 6,
    reloading: false,
    chickens: [],
    particles: [],
    floats: [],
    shots: [],
    spawnTimer: 0,
    elapsed: 0,
    lastT: 0,
    levelIdx: 0,
    mode: 'menu',           // 'menu' | 'playing' | 'roundEnd' | 'levelEnd' | 'gameOver'
    spawnedCount: 0,
    roundTargets: [],       // length 10, each null | 'hit' | 'miss'
    roundStartT: 0,         // performance.now() when round began
    roundElapsed: 0,        // seconds elapsed in last round (for level-end display)
    roundBonus: 0,          // last awarded time bonus
    misses: 0,              // shots that missed in current round (for level-end display)
    dog: { active: false, t: 0, dur: 2.6, mode: 'success', hits: 0 },
    banner: { text: '', life: 0, big: false, sub: '' },
  };

  const MISS_PENALTY = 25;

  function computeTimeBonus(elapsedSec) {
    return Math.max(0, Math.min(500, Math.round(600 - 18 * elapsedSec)));
  }

  function showBanner(text, opts = {}) {
    state.banner = {
      text,
      life: opts.life || 2.0,
      big: !!opts.big,
      sub: opts.sub || '',
    };
  }

  function drawBanner(dt) {
    if (state.banner.life <= 0) return;
    state.banner.life -= dt;
    const a = Math.min(1, state.banner.life * 1.2);
    ctx.save();
    if (state.banner.big) {
      ctx.globalAlpha = a;
      ctx.font = 'bold 64px sans-serif';
      ctx.textAlign = 'center';
      ctx.lineWidth = 7;
      ctx.strokeStyle = '#000';
      ctx.fillStyle = '#ffd042';
      ctx.strokeText(state.banner.text, W / 2, H * 0.32);
      ctx.fillText(state.banner.text, W / 2, H * 0.32);
      if (state.banner.sub) {
        ctx.font = 'bold 24px sans-serif';
        ctx.fillStyle = '#fff';
        ctx.lineWidth = 4;
        ctx.strokeText(state.banner.sub, W / 2, H * 0.32 + 38);
        ctx.fillText(state.banner.sub, W / 2, H * 0.32 + 38);
      }
      ctx.restore();
      return;
    }
    ctx.globalAlpha = a;
    ctx.font = 'bold 34px sans-serif';
    ctx.textAlign = 'center';
    ctx.lineWidth = 5;
    ctx.strokeStyle = '#000';
    ctx.fillStyle = '#fff';
    ctx.strokeText(state.banner.text, W / 2, H * 0.22);
    ctx.fillText(state.banner.text, W / 2, H * 0.22);
    ctx.restore();
  }

  // ---------- Background ----------
  const clouds = Array.from({length: 5}, () => ({
    x: Math.random() * 1000, y: 40 + Math.random() * 80,
    s: 0.6 + Math.random() * 0.8, v: 4 + Math.random() * 6
  }));

  function drawSky() {
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#87ceeb');
    g.addColorStop(0.6, '#b9e3f3');
    g.addColorStop(1, '#f5e6c8');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
  }

  function drawClouds(dt) {
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    clouds.forEach(c => {
      c.x -= c.v * dt;
      if (c.x < -120) c.x = W + 80;
      const s = c.s * 30;
      ctx.beginPath();
      ctx.arc(c.x, c.y, s, 0, Math.PI * 2);
      ctx.arc(c.x + s * 0.9, c.y + 4, s * 0.8, 0, Math.PI * 2);
      ctx.arc(c.x - s * 0.9, c.y + 4, s * 0.7, 0, Math.PI * 2);
      ctx.arc(c.x + s * 0.3, c.y - s * 0.5, s * 0.7, 0, Math.PI * 2);
      ctx.fill();
    });
  }

  function drawMountains() {
    const horizon = H * 0.55;
    ctx.fillStyle = '#3d6b4a';
    ctx.beginPath();
    ctx.moveTo(0, horizon);
    for (let i = 0; i * 110 < W + 110; i++) {
      const peakX = i * 110 + 60;
      const peakY = horizon - 60 - ((peakX * 7919) % 80);
      ctx.lineTo(peakX - 60, horizon);
      ctx.lineTo(peakX, peakY);
    }
    ctx.lineTo(W, horizon);
    ctx.closePath();
    ctx.fill();
    // misty layer
    ctx.fillStyle = 'rgba(255,255,255,0.18)';
    ctx.fillRect(0, horizon - 20, W, 30);
  }

  function drawFrond(angle, length, droop, palette) {
    ctx.save();
    ctx.rotate(angle);
    const N = 22;
    // precompute rib points
    const pts = [];
    for (let i = 0; i <= N; i++) {
      const t = i / N;
      pts.push({ t, x: length * t, y: droop * t * t });
    }
    // draw leaflets along the rib (back-to-front so tip leaflets overlay base)
    for (let i = 1; i < N; i++) {
      const p = pts[i];
      const prev = pts[i - 1];
      const next = pts[i + 1];
      const tx = next.x - prev.x;
      const ty = next.y - prev.y;
      const tl = Math.hypot(tx, ty) || 1;
      const nx = -ty / tl;
      const ny = tx / tl;
      // leaflet length tapers (peak around 35% of rib)
      const peak = 0.4;
      const prox = 1 - Math.abs(p.t - peak) / Math.max(peak, 1 - peak);
      const leafLen = Math.max(2.5, prox * 18 + 4);
      const sweep = 0.28;
      const swX = (tx / tl) * leafLen * sweep;
      const swY = (ty / tl) * leafLen * sweep;
      // upper leaflet
      ctx.fillStyle = palette.upper;
      ctx.beginPath();
      ctx.moveTo(prev.x, prev.y);
      ctx.quadraticCurveTo(
        p.x + nx * leafLen * 0.45,
        p.y + ny * leafLen * 0.45,
        p.x + nx * leafLen + swX,
        p.y + ny * leafLen + swY
      );
      ctx.lineTo(p.x, p.y);
      ctx.closePath();
      ctx.fill();
      // lower leaflet (darker, drooping)
      ctx.fillStyle = palette.lower;
      ctx.beginPath();
      ctx.moveTo(prev.x, prev.y);
      ctx.quadraticCurveTo(
        p.x - nx * leafLen * 0.45,
        p.y - ny * leafLen * 0.45 + 1,
        p.x - nx * leafLen + swX,
        p.y - ny * leafLen + swY + 1
      );
      ctx.lineTo(p.x, p.y);
      ctx.closePath();
      ctx.fill();
    }
    // central rib (drawn over leaflet bases)
    ctx.strokeStyle = palette.rib;
    ctx.lineWidth = 1.6;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(0, 0);
    for (let i = 1; i <= N; i++) ctx.lineTo(pts[i].x, pts[i].y);
    ctx.stroke();
    // tip-leaflet (forms the pointed end)
    ctx.fillStyle = palette.upper;
    const tip = pts[N];
    const beforeTip = pts[N - 2];
    const tipDx = tip.x - beforeTip.x, tipDy = tip.y - beforeTip.y;
    const tdl = Math.hypot(tipDx, tipDy) || 1;
    ctx.beginPath();
    ctx.moveTo(beforeTip.x, beforeTip.y);
    ctx.lineTo(tip.x + (tipDx / tdl) * 6, tip.y + (tipDy / tdl) * 6);
    ctx.lineTo(beforeTip.x + (-tipDy / tdl) * 3, beforeTip.y + (tipDx / tdl) * 3);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  function drawPalm(x, baseY, scale, opts) {
    opts = opts || {};
    const lean = opts.lean || 0;
    const variant = opts.variant || 0;
    ctx.save();
    ctx.translate(x, baseY);
    ctx.rotate(lean);
    ctx.scale(scale, scale);

    const trunkH = 180;
    const baseW = 18;
    const topW = 9;

    // trunk silhouette (slight S, tapered)
    ctx.fillStyle = '#a8865a';
    ctx.beginPath();
    ctx.moveTo(-baseW / 2, 0);
    ctx.bezierCurveTo(-baseW / 2 - 2, -trunkH * 0.4,
                      -topW / 2 - 5,  -trunkH * 0.75,
                      -topW / 2 - 1,  -trunkH);
    ctx.lineTo(topW / 2 + 1, -trunkH);
    ctx.bezierCurveTo(topW / 2 + 6, -trunkH * 0.75,
                      baseW / 2 + 4, -trunkH * 0.4,
                      baseW / 2, 0);
    ctx.closePath();
    ctx.fill();

    // shaded right half
    const shade = ctx.createLinearGradient(-baseW / 2, 0, baseW / 2 + 4, 0);
    shade.addColorStop(0, 'rgba(255,220,170,0.18)');
    shade.addColorStop(0.4, 'rgba(0,0,0,0)');
    shade.addColorStop(1, 'rgba(50,30,12,0.55)');
    ctx.fillStyle = shade;
    ctx.beginPath();
    ctx.moveTo(-baseW / 2, 0);
    ctx.bezierCurveTo(-baseW / 2 - 2, -trunkH * 0.4,
                      -topW / 2 - 5,  -trunkH * 0.75,
                      -topW / 2 - 1,  -trunkH);
    ctx.lineTo(topW / 2 + 1, -trunkH);
    ctx.bezierCurveTo(topW / 2 + 6, -trunkH * 0.75,
                      baseW / 2 + 4, -trunkH * 0.4,
                      baseW / 2, 0);
    ctx.closePath();
    ctx.fill();

    // diamond husk pattern (chevron rows)
    ctx.strokeStyle = 'rgba(58,34,14,0.65)';
    ctx.lineWidth = 1;
    const rows = 13;
    for (let i = 0; i < rows; i++) {
      const t = i / rows;
      const y = -8 - (trunkH - 14) * t;
      const w = baseW + (topW - baseW) * t;
      const offset = (i % 2) * (w / 4);
      // 4 chevrons across width
      ctx.beginPath();
      const segs = 3;
      for (let j = 0; j <= segs; j++) {
        const cx = -w / 2 + (w / segs) * j + offset - w / 8;
        if (j === 0) ctx.moveTo(cx, y);
        else ctx.lineTo(cx, y - (j % 2 ? 4 : 0));
      }
      ctx.stroke();
      // subtle highlight on the chevrons
      ctx.strokeStyle = 'rgba(240,210,160,0.18)';
      ctx.beginPath();
      for (let j = 0; j <= segs; j++) {
        const cx = -w / 2 + (w / segs) * j + offset - w / 8;
        if (j === 0) ctx.moveTo(cx, y - 1);
        else ctx.lineTo(cx, y - 1 - (j % 2 ? 4 : 0));
      }
      ctx.stroke();
      ctx.strokeStyle = 'rgba(58,34,14,0.65)';
    }

    // crown collar (where fronds emerge)
    ctx.fillStyle = '#3a2614';
    ctx.beginPath();
    ctx.ellipse(0, -trunkH, topW / 2 + 5, 4, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#7a4f28';
    ctx.beginPath();
    ctx.ellipse(0, -trunkH - 1, topW / 2 + 4, 3, 0, 0, Math.PI * 2);
    ctx.fill();

    // coconut cluster (tucked just below the fronds)
    const coconuts = [
      { x: -6, y: -trunkH + 4, r: 4.5 },
      { x:  5, y: -trunkH + 5, r: 4.2 },
      { x:  0, y: -trunkH + 1, r: 4.5 },
      { x: -2, y: -trunkH + 7, r: 4.0 },
      { x:  8, y: -trunkH + 1, r: 3.8 },
    ];
    coconuts.forEach(c => {
      ctx.fillStyle = '#3a2410';
      ctx.beginPath();
      ctx.arc(c.x, c.y, c.r, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = 'rgba(180,130,70,0.6)';
      ctx.beginPath();
      ctx.arc(c.x - c.r * 0.35, c.y - c.r * 0.35, c.r * 0.4, 0, Math.PI * 2);
      ctx.fill();
    });
    // stem connecting cluster to crown
    ctx.strokeStyle = '#5a3a1a';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(0, -trunkH);
    ctx.lineTo(0, -trunkH + 5);
    ctx.stroke();

    // fronds — fan around the crown
    ctx.save();
    ctx.translate(0, -trunkH);
    const lightP = { upper: '#3da250', lower: '#1c6b2e', rib: '#234014' };
    const midP   = { upper: '#338a45', lower: '#155224', rib: '#1a3010' };
    const darkP  = { upper: '#2a7a3a', lower: '#0e421a', rib: '#15280c' };

    // small variant offset so multiple palms aren't identical
    const v = variant * 0.07;

    // back row (smaller, darker, drawn first)
    drawFrond(-Math.PI * 0.92 + v, 58, 18, darkP);
    drawFrond(-Math.PI * 0.55 + v, 50, 14, darkP);
    drawFrond(-Math.PI * 0.08 + v, 58, 18, darkP);

    // mid row
    drawFrond(-Math.PI * 1.02 + v, 78, 32, midP);
    drawFrond(-Math.PI * 0.72 + v, 80, 28, midP);
    drawFrond(-Math.PI * 0.28 + v, 80, 28, midP);
    drawFrond(Math.PI * 0.02 + v,  78, 32, midP);

    // front row (longest, drooping most)
    drawFrond(-Math.PI * 0.85 + v, 92, 50, lightP);
    drawFrond(-Math.PI * 0.45 + v, 95, 48, lightP);
    drawFrond(-Math.PI * 0.15 + v, 92, 50, lightP);
    drawFrond(Math.PI * 0.10 + v,  82, 60, lightP);
    drawFrond(-Math.PI * 1.10 + v, 82, 60, lightP);
    ctx.restore();

    ctx.restore();
  }

  // ---------- Levels (backdrops) ----------
  function drawStorefront(cx, baseY) {
    ctx.save();
    ctx.translate(cx, baseY);
    const w = Math.min(W * 0.55, 360), h = 56;
    // building body
    ctx.fillStyle = '#d8b88a';
    ctx.fillRect(-w / 2, -h, w, h);
    // roof cap
    ctx.fillStyle = '#5a5a5a';
    ctx.fillRect(-w / 2 - 6, -h - 6, w + 12, 6);
    // sign band
    ctx.fillStyle = '#1f6f3a';
    ctx.fillRect(-w / 2, -h, w, 16);
    // sign text
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 13px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('FOODLAND', 0, -h + 8);
    // window/door bays
    ctx.fillStyle = '#2a3a4a';
    const bays = 5;
    const bayW = (w - 30) / bays;
    for (let i = 0; i < bays; i++) {
      ctx.fillRect(-w / 2 + 15 + i * bayW + 4, -h + 22, bayW - 8, 26);
    }
    // door highlight
    ctx.fillStyle = '#5a8aa8';
    ctx.fillRect(-8, -h + 30, 16, 18);
    ctx.textBaseline = 'alphabetic';
    ctx.restore();
  }

  function drawCar(cx, by, color) {
    ctx.save();
    ctx.translate(cx, by);
    // body
    ctx.fillStyle = color;
    ctx.fillRect(-32, -22, 64, 22);
    // cabin
    ctx.fillRect(-22, -34, 44, 13);
    // roof shine
    ctx.fillStyle = 'rgba(255,255,255,0.18)';
    ctx.fillRect(-22, -34, 44, 3);
    // windows
    ctx.fillStyle = '#7aa8d8';
    ctx.fillRect(-20, -32, 18, 10);
    ctx.fillRect(2, -32, 18, 10);
    // window divider
    ctx.fillStyle = color;
    ctx.fillRect(-2, -32, 4, 10);
    // wheels
    ctx.fillStyle = '#1a1a1a';
    ctx.beginPath();
    ctx.arc(-19, 0, 6, 0, Math.PI * 2);
    ctx.arc(19, 0, 6, 0, Math.PI * 2);
    ctx.fill();
    // hub
    ctx.fillStyle = '#7a7a7a';
    ctx.beginPath();
    ctx.arc(-19, 0, 2, 0, Math.PI * 2);
    ctx.arc(19, 0, 2, 0, Math.PI * 2);
    ctx.fill();
    // headlight
    ctx.fillStyle = '#fff5a8';
    ctx.fillRect(30, -16, 3, 4);
    // taillight
    ctx.fillStyle = '#c93838';
    ctx.fillRect(-33, -16, 3, 4);
    ctx.restore();
  }

  function drawShoppingCart(cx, by) {
    ctx.save();
    ctx.translate(cx, by);
    ctx.strokeStyle = '#aaa';
    ctx.lineWidth = 1.5;
    // basket
    ctx.beginPath();
    ctx.moveTo(-10, -10); ctx.lineTo(10, -10);
    ctx.lineTo(8, 0); ctx.lineTo(-8, 0);
    ctx.closePath();
    ctx.stroke();
    // grid
    for (let i = -7; i < 9; i += 4) {
      ctx.beginPath();
      ctx.moveTo(i, -10); ctx.lineTo(i - 1, 0);
      ctx.stroke();
    }
    ctx.beginPath();
    ctx.moveTo(-9, -5); ctx.lineTo(9, -5);
    ctx.stroke();
    // handle
    ctx.beginPath();
    ctx.moveTo(10, -10); ctx.lineTo(13, -14);
    ctx.stroke();
    // wheels
    ctx.fillStyle = '#333';
    ctx.beginPath();
    ctx.arc(-7, 3, 2, 0, Math.PI * 2);
    ctx.arc(7, 3, 2, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  function drawParkingLot() {
    drawMountains();
    const horizon = H * 0.55;
    // grass strip between mountains and asphalt
    const asphaltTop = H * 0.7;
    ctx.fillStyle = '#5fa84a';
    ctx.fillRect(0, horizon, W, asphaltTop - horizon);
    // storefront sits on the grass band, well behind the parking spaces
    drawStorefront(W * 0.5, asphaltTop - 4);
    // asphalt
    const g = ctx.createLinearGradient(0, asphaltTop, 0, H);
    g.addColorStop(0, '#4a4a4a');
    g.addColorStop(1, '#2c2c2c');
    ctx.fillStyle = g;
    ctx.fillRect(0, asphaltTop, W, H - asphaltTop);
    // concrete curb
    ctx.fillStyle = '#a8a8a8';
    ctx.fillRect(0, asphaltTop - 5, W, 5);
    ctx.fillStyle = 'rgba(0,0,0,0.25)';
    ctx.fillRect(0, asphaltTop, W, 2);
    // parked cars (in upper portion of lot — further from camera)
    const carRow = asphaltTop + 28;
    // parking stalls: parallel-parking layout matching the broadside cars
    // — long horizontal aisle line below the cars, short vertical tick
    // marks between stalls
    ctx.strokeStyle = '#f0ead8';
    ctx.lineWidth = 3;
    const stallFrontY = carRow + 16;
    ctx.beginPath();
    ctx.moveTo(0, stallFrontY);
    ctx.lineTo(W, stallFrontY);
    ctx.stroke();
    const stallW = 110;

      ctx.moveTo(lx, stallFrontY);
      ctx.lineTo(lx, stallFrontY - tickH);

    // drive lane (dashed yellow) closer to camera

  function drawHotel(cx, groundY, w, h, faceColor, sign) {
    ctx.save();
    ctx.translate(cx, groundY);
    // shadow side (right third darker)
    ctx.fillStyle = faceColor;
    ctx.fillRect(-w / 2, -h, w, h);
    ctx.fillStyle = 'rgba(60,40,20,0.28)';
    ctx.fillRect(w / 6, -h, w / 3, h);
    // roof cap
    ctx.fillStyle = '#5a4030';
    ctx.fillRect(-w / 2 - 3, -h - 5, w + 6, 5);
    // sign band
    if (sign && w >= 90) {
      ctx.fillStyle = '#1f5f8a';
      ctx.fillRect(-w / 2 + 4, -h + 2, w - 8, 9);
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 8px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(sign, 0, -h + 7);
      ctx.textBaseline = 'alphabetic';
    }
    // window grid
    const startY = sign && w >= 90 ? -h + 14 : -h + 6;
    const rowH = 9;
    const rows = Math.max(2, Math.floor((h - (sign && w >= 90 ? 22 : 14)) / rowH));
    const cols = Math.max(3, Math.floor(w / 14));
    const winSp = w / cols;
    const winW = winSp * 0.55;
    ctx.fillStyle = '#3a5a8a';
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        const wx = -w / 2 + (c + 0.5) * winSp - winW / 2;
        const wy = startY + r * rowH;
        ctx.fillRect(wx, wy, winW, 4);
      }
    }
    // a few lit windows
    ctx.fillStyle = '#ffe28a';
    const lit = [[0, 1], [2, 0], [3, 2], [1, 3]];
    lit.forEach(([c, r]) => {
      if (c >= cols || r >= rows) return;
      const wx = -w / 2 + (c + 0.5) * winSp - winW / 2;
      const wy = startY + r * rowH;
      ctx.fillRect(wx, wy, winW, 4);
    });
    // ground floor entrance
    ctx.fillStyle = '#3a2614';
    const doorW = Math.min(14, w * 0.18);
    ctx.fillRect(-doorW / 2, -8, doorW, 8);
    ctx.fillStyle = '#5a8aa8';
    ctx.fillRect(-doorW / 2 + 2, -7, doorW - 4, 5);
    ctx.restore();
  }

  function drawBanyan(x, baseY, scale) {
    ctx.save();
    ctx.translate(x, baseY);
    ctx.scale(scale, scale);
    // aerial roots
    ctx.fillStyle = '#5a3a20';
    for (let i = -3; i <= 3; i++) {
      const rx = i * 14;
      const len = 100 + Math.abs(i) * 8;
      ctx.fillRect(rx - 3, -len, 6, len);
    }
    // main trunk
    ctx.fillStyle = '#6b4423';
    ctx.beginPath();
    ctx.moveTo(-32, 0);
    ctx.quadraticCurveTo(-26, -100, -22, -150);
    ctx.lineTo(22, -150);
    ctx.quadraticCurveTo(26, -100, 32, 0);
    ctx.closePath();
    ctx.fill();
    // canopy
    ctx.fillStyle = '#2d6b2e';
    const blobs = [{x:0,y:-200,r:65},{x:-55,y:-175,r:50},{x:60,y:-175,r:55},
                   {x:-30,y:-225,r:42},{x:35,y:-225,r:45}];
    blobs.forEach(b => { ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI*2); ctx.fill(); });
    ctx.fillStyle = '#3d8a3e';
    blobs.forEach(b => {
      ctx.beginPath();
      ctx.arc(b.x - b.r * 0.3, b.y - b.r * 0.3, b.r * 0.5, 0, Math.PI*2);
      ctx.fill();
    });
    ctx.restore();
  }

  function drawBeachUmbrella(x, y) {
    ctx.save();
    ctx.translate(x, y);
    const tipY = -94;       // canopy peak (and pole exit)
    const halfW = 58;       // canopy half-width
    const drop = 14;        // rim drop below the peak at the sides
    // pole
    ctx.fillStyle = '#5a3a1a';
    ctx.fillRect(-1.6, 0, 3.2, -tipY);
    ctx.fillStyle = 'rgba(255,235,200,0.18)';
    ctx.fillRect(-1.6, 0, 1, -tipY);
    // canopy panels — alternating stripes radiating from the peak,
    // with a parabolic rim so the edges droop below the peak
    const stripes = ['#e64545', '#f5f1e8', '#e64545', '#f5f1e8',
                     '#e64545', '#f5f1e8', '#e64545'];
    const N = stripes.length;
    const rimY = (px) => tipY + drop * Math.pow(px / halfW, 2);
    for (let i = 0; i < N; i++) {
      const x0 = -halfW + (2 * halfW) * (i / N);
      const x1 = -halfW + (2 * halfW) * ((i + 1) / N);
      const y0 = rimY(x0);
      const y1 = rimY(x1);
      const xm = (x0 + x1) / 2;
      const ym = rimY(xm) + 3.5;  // scallop droop between corners
      ctx.fillStyle = stripes[i];
      ctx.beginPath();
      ctx.moveTo(0, tipY);
      ctx.lineTo(x0, y0);
      ctx.quadraticCurveTo(xm, ym, x1, y1);
      ctx.closePath();
      ctx.fill();
    }
    // canopy outline (defines the dome silhouette)
    ctx.strokeStyle = 'rgba(50,20,10,0.5)';
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    for (let i = 0; i <= 40; i++) {
      const t = i / 40;
      const xt = -halfW + (2 * halfW) * t;
      // include scallops by perturbing slightly between panel boundaries
      const seg = t * N;
      const segFrac = seg - Math.floor(seg);
      const scallop = Math.sin(segFrac * Math.PI) * 1.8;
      const yt = rimY(xt) + scallop;
      if (i === 0) ctx.moveTo(xt, yt);
      else ctx.lineTo(xt, yt);
    }
    ctx.stroke();
    // panel rib seams (radial lines from peak to rim)
    ctx.strokeStyle = 'rgba(0,0,0,0.18)';
    ctx.lineWidth = 0.8;
    for (let i = 1; i < N; i++) {
      const xr = -halfW + (2 * halfW) * (i / N);
      const yr = rimY(xr);
      ctx.beginPath();
      ctx.moveTo(0, tipY);
      ctx.lineTo(xr, yr);
      ctx.stroke();
    }
    // tip ferrule sticking up from the canopy peak
    ctx.fillStyle = '#3a2410';
    ctx.fillRect(-1.5, tipY - 9, 3, 9);
    ctx.fillStyle = '#c9a066';
    ctx.beginPath();
    ctx.arc(0, tipY - 10, 1.8, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  const LEVELS = [

  function pickSpecies() {
    let total = 0;
    for (const k in SPECIES) total += SPECIES[k].weight;
    let r = Math.random() * total;
    for (const k in SPECIES) {
      r -= SPECIES[k].weight;
      if (r <= 0) return k;
    }
    return 'hen';
  }

  function spawnChicken() {
    if (state.spawnedCount >= ROUND_SIZE) return;
    const fromLeft = Math.random() < 0.5;
    // groundTop must sit below any per-level water/sky band; current
    // levels keep their playable surface at or below 60% of screen height.
    const groundTop = H * 0.60;
    const groundBot = H * 0.92;
    const y = groundTop + Math.random() * (groundBot - groundTop);
    // perspective: closer (lower y) = bigger
    const t = (y - groundTop) / (groundBot - groundTop);
    const baseScale = 0.5 + t * 0.9;
    const type = pickSpecies();
    const sp = SPECIES[type];
    const speed = (60 + Math.random() * 70) * (0.7 + t * 0.6) * sp.speedMult;
    state.chickens.push({
      type,
      slot: state.spawnedCount,
      x: fromLeft ? -40 : W + 40,
      y,
      scale: baseScale * sp.sizeMult,
      vx: fromLeft ? speed : -speed,
      bob: Math.random() * Math.PI * 2,
      legPhase: 0,
      alive: true,
      fallV: 0,
      points: Math.round((50 / baseScale) * sp.pointsMult),
    });
    state.spawnedCount++;
  }

  function drawChicken(c) {
    const sp = SPECIES[c.type];
    const cols = sp.colors;
    ctx.save();
    ctx.translate(c.x, c.y);
    const facing = c.vx < 0 ? -1 : 1;
    ctx.scale(c.scale * facing, c.scale);
    if (!c.alive) {
      ctx.rotate(0.6 * facing);
    } else {
      ctx.translate(0, Math.sin(c.bob) * 1.5);
    }
    // legs
    if (c.alive) {
      ctx.strokeStyle = cols.legs;
      ctx.lineWidth = 2;
      const lp = Math.sin(c.legPhase) * 4;
      ctx.beginPath();
      ctx.moveTo(-4, 8); ctx.lineTo(-4 + lp, 18);
      ctx.moveTo(4, 8); ctx.lineTo(4 - lp, 18);
      ctx.stroke();
    }
    // body
    ctx.fillStyle = cols.body;
    ctx.beginPath();
    ctx.ellipse(0, 0, 14, 10, 0, 0, Math.PI * 2);
    ctx.fill();
    // patch
    ctx.fillStyle = cols.patch;
    ctx.beginPath();
    ctx.ellipse(-3, -2, 7, 5, -0.3, 0, Math.PI * 2);
    ctx.fill();
    // tail feathers
    ctx.fillStyle = cols.tail;
    ctx.beginPath();
    ctx.moveTo(-12, -2);
    ctx.lineTo(-20, -8);
    ctx.lineTo(-18, 0);
    ctx.lineTo(-20, 6);
    ctx.closePath();
    ctx.fill();
    // head
    ctx.fillStyle = cols.body;
    ctx.beginPath();
    ctx.arc(11, -6, 6, 0, Math.PI * 2);
    ctx.fill();
    // comb + wattle (skipped for chicks)
    if (sp.combScale > 0) {
      const cs = sp.combScale;
      ctx.fillStyle = cols.comb;
      ctx.beginPath();
      ctx.arc(11, -11, 2 * cs, 0, Math.PI * 2);
      ctx.arc(13, -12, 2 * cs, 0, Math.PI * 2);
      ctx.arc(9, -12, 2 * cs, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.arc(13, -2, 2, 0, Math.PI * 2);
      ctx.fill();
    }
    // beak
    ctx.fillStyle = cols.beak;
    ctx.beginPath();
    ctx.moveTo(16, -6);
    ctx.lineTo(20, -5);
    ctx.lineTo(16, -4);
    ctx.closePath();
    ctx.fill();
    // eye
    ctx.fillStyle = '#000';
    ctx.beginPath();
    ctx.arc(13, -7, 1, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  // ---------- Particles & FX ----------
  function emitFeathers(x, y, n, colors) {
    for (let i = 0; i < n; i++) {
      state.particles.push({
        x, y,
        vx: (Math.random() - 0.5) * 120,
        vy: -60 - Math.random() * 80,
        life: 1.2,
        color: colors[Math.floor(Math.random() * colors.length)],
        size: 3 + Math.random() * 3,
        rot: Math.random() * Math.PI,
        vr: (Math.random() - 0.5) * 6,
      });
    }
  }

  function addFloat(x, y, text, color) {
    state.floats.push({ x, y, text, color, life: 1.0 });
  }

  function drawParticles(dt) {
    state.particles.forEach(p => {
      p.life -= dt;
      p.vy += 200 * dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.rot += p.vr * dt;
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.globalAlpha = Math.max(0, p.life);
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.6);
      ctx.restore();
    });
    state.particles = state.particles.filter(p => p.life > 0);
    ctx.globalAlpha = 1;
  }

  function drawFloats(dt) {
    ctx.font = 'bold 22px sans-serif';
    ctx.textAlign = 'center';
    state.floats.forEach(f => {
      f.life -= dt;
      f.y -= 40 * dt;
      ctx.globalAlpha = Math.max(0, f.life);
      ctx.fillStyle = f.color;
      ctx.strokeStyle = '#000';
      ctx.lineWidth = 3;
      ctx.strokeText(f.text, f.x, f.y);
      ctx.fillText(f.text, f.x, f.y);
    });
    state.floats = state.floats.filter(f => f.life > 0);
    ctx.globalAlpha = 1;
  }

  function drawShots(dt) {
    state.shots.forEach(s => {
      s.life -= dt;
      ctx.strokeStyle = `rgba(255,255,255,${Math.max(0, s.life * 2)})`;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(s.x, s.y, 18 * (1 - s.life * 2), 0, Math.PI * 2);
      ctx.stroke();
    });
    state.shots = state.shots.filter(s => s.life > 0);
  }

  // ---------- Audio (tiny WebAudio beeps) ----------
  let actx;
  function blip(freq, dur, type = 'square', vol = 0.15) {
    try {
      if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
      const o = actx.createOscillator();
      const g = actx.createGain();
      o.type = type; o.frequency.value = freq;
      g.gain.value = vol;
      g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + dur);
      o.connect(g).connect(actx.destination);
      o.start();
      o.stop(actx.currentTime + dur);
    } catch (e) {}
  }
  const sndShot = () => blip(180, 0.08, 'square', 0.18);
  const sndHit = () => { blip(720, 0.06, 'square'); setTimeout(() => blip(420, 0.1, 'triangle'), 50); };
  const sndMiss = () => blip(90, 0.1, 'sawtooth', 0.08);
  const sndReload = () => blip(300, 0.05, 'square', 0.1);
  const sndSuccess = () => { blip(523, 0.1, 'square', 0.14); setTimeout(() => blip(659, 0.1, 'square', 0.14), 90); setTimeout(() => blip(784, 0.18, 'square', 0.14), 180); };
  const sndLaugh = () => { blip(220, 0.12, 'sawtooth', 0.12); setTimeout(() => blip(180, 0.12, 'sawtooth', 0.12), 130); setTimeout(() => blip(140, 0.16, 'sawtooth', 0.12), 260); };

  // ---------- Input ----------
  function shoot(px, py) {
    if (!state.running) return;
    if (state.reloading) return;
    if (state.ammo <= 0) return;
    state.ammo--;
    state.shots.push({ x: px, y: py, life: 0.5 });
    sndShot();
    let hit = false;
    // hit-test newest (front-most) first
    for (let i = state.chickens.length - 1; i >= 0; i--) {
      const c = state.chickens[i];
      if (!c.alive) continue;
      const r = 18 * c.scale;
      const dx = px - c.x, dy = py - c.y;
      if (dx * dx + dy * dy < r * r) {
        c.alive = false;
        c.fallV = -120;
        state.score += c.points;
        if (c.slot != null) {
          state.roundTargets[c.slot] = 'hit';
          updateDots();
        }
        addFloat(c.x, c.y - 20, '+' + c.points, '#ffd700');
        emitFeathers(c.x, c.y, 14, SPECIES[c.type].featherColors);
        sndHit();
        hit = true;
        break;
      }
    }
    if (!hit) {
      sndMiss();
      state.score -= MISS_PENALTY;
      state.misses++;
      addFloat(px, py, '−' + MISS_PENALTY, '#ff5555');
    }
    updateHUD();
    if (state.ammo === 0) startReload();
  }

  function startReload() {
    state.reloading = true;
    ammoEl.textContent = '...';
    setTimeout(() => {
      state.ammo = state.maxAmmo;
      state.reloading = false;
      sndReload();
      updateHUD();
    }, 800);
  }

  canvas.addEventListener('pointerdown', e => {
    e.preventDefault();
    const rect = canvas.getBoundingClientRect();
    shoot(e.clientX - rect.left, e.clientY - rect.top);
  });

  // ---------- Game loop ----------
  function updateHUD() {
    scoreEl.textContent = state.score;
    roundEl.textContent = state.levelIdx + 1;
    if (state.mode === 'playing' && state.roundStartT > 0) {
      const e = (performance.now() - state.roundStartT) / 1000;
      timeEl.textContent = e.toFixed(1);
    }
    if (!state.reloading) ammoEl.textContent = state.ammo;
  }

  function updateDots() {
    for (let i = 0; i < ROUND_SIZE; i++) {
      const t = state.roundTargets[i];
      const cls = ['dot'];
      if (i === ROUND_QUOTA - 1) cls.push('quota');
      if (t === 'hit') cls.push('hit');
      else if (t === 'miss') cls.push('miss');
      dotEls[i].className = cls.join(' ');
    }
  }

  function resetRoundTargets() {
    state.roundTargets = new Array(ROUND_SIZE).fill(null);
    state.spawnedCount = 0;
    updateDots();
  }

  function update(dt) {
    if (state.mode === 'playing' && state.spawnedCount < ROUND_SIZE) {
      state.spawnTimer -= dt;
      if (state.spawnTimer <= 0) {
        spawnChicken();
        state.spawnTimer = 0.5 + Math.random() * 0.9;
      }
    }
    state.chickens.forEach(c => {
      if (c.alive) {
        c.x += c.vx * dt;
        c.bob += dt * 8;
        c.legPhase += dt * 12;
        if (SPECIES[c.type].sparkle && Math.random() < 0.5) {
          state.particles.push({
            x: c.x + (Math.random() - 0.5) * 32 * c.scale,
            y: c.y + (Math.random() - 0.5) * 22 * c.scale,
            vx: 0, vy: -10,
            life: 0.5,
            color: Math.random() < 0.5 ? '#ffd700' : '#fff5b8',
            size: 2 + Math.random() * 2,
            rot: 0, vr: 0,
          });
        }
      } else {
        c.fallV += 600 * dt;
        c.y += c.fallV * dt;
      }
    });
    state.chickens = state.chickens.filter(c => {
      if (!c.alive && c.y > H + 40) return false;
      if (c.alive && (c.x < -80 || c.x > W + 80)) {
        if (c.slot != null && state.roundTargets[c.slot] == null) {
          state.roundTargets[c.slot] = 'miss';
          showBanner('RAN AWAY!', { life: 1.2 });
          updateDots();
        }
        return false;
      }
      return true;
    });
    if (state.mode === 'playing'
        && state.spawnedCount >= ROUND_SIZE
        && state.roundTargets.every(t => t != null)) {
      const hits = state.roundTargets.filter(t => t === 'hit').length;
      triggerRoundEnd(hits);
    }
    if (state.dog.active) {
      state.dog.t += dt;
      if (state.dog.t >= state.dog.dur) {
        state.dog.active = false;
        if (state.dog.mode === 'success') {
          if (state.levelIdx >= LEVELS.length - 1) endGame(true);
          else showLevelEnd();
        } else {
          endGame(false);
        }
      }
    }
  }

  function triggerRoundEnd(hits) {
    const passed = hits >= ROUND_QUOTA;
    state.mode = 'roundEnd';
    state.roundElapsed = (performance.now() - state.roundStartT) / 1000;
    if (passed) {
      state.roundBonus = computeTimeBonus(state.roundElapsed);
      state.score += state.roundBonus;
      if (state.roundBonus > 0) {
        addFloat(W / 2, H * 0.4, 'Time Bonus +' + state.roundBonus, '#ffd042');
      }
    } else {
      state.roundBonus = 0;
    }
    state.dog = {
      active: true,
      t: 0,
      dur: passed ? 2.6 : 2.4,
      mode: passed ? 'success' : 'laugh',
      hits,
    };
    if (passed) sndSuccess(); else sndLaugh();
  }

  function render(dt) {
    drawSky();
    drawClouds(dt);
    LEVELS[state.levelIdx].draw();
    // sort chickens back-to-front (smaller scale = farther = behind)
    const sorted = [...state.chickens].sort((a, b) => a.y - b.y);
    sorted.forEach(drawChicken);
    drawParticles(dt);
    drawShots(dt);
    drawFloats(dt);
    if (state.dog.active) drawDog();
    drawBanner(dt);
  }

  // ---------- Hunting dog ----------
  function drawDog() {
    const t = state.dog.t / state.dog.dur;
    // rise (0..0.18), hold (0.18..0.82), drop (0.82..1)
    let yOff;
    if (t < 0.18) yOff = (1 - t / 0.18) * 130;
    else if (t > 0.82) yOff = ((t - 0.82) / 0.18) * 130;
    else yOff = 0;
    const cx = W * 0.5;
    const baseY = H * 0.92 + yOff;
    // grass / brush hiding bottom half
    ctx.save();
    ctx.translate(cx, baseY);
    // brush silhouette behind the dog
    ctx.fillStyle = '#2d6b2e';
    ctx.beginPath();
    ctx.ellipse(0, 18, 90, 22, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#3d8a3e';
    ctx.beginPath();
    ctx.ellipse(-30, 14, 50, 14, 0, 0, Math.PI * 2);
    ctx.ellipse(40, 12, 40, 12, 0, 0, Math.PI * 2);
    ctx.fill();
    // dog body — bobbing for laugh
    const bob = state.dog.mode === 'laugh' ? Math.sin(state.dog.t * 18) * 3 : 0;
    ctx.translate(0, bob);
    drawDogBody(state.dog.mode, state.dog.hits);
    ctx.restore();
    // speech bubble
    if (yOff === 0) {
      const text = state.dog.mode === 'laugh' ? 'HA HA!' : 'Got ‘em!';
      drawBubble(cx + 70, baseY - 70 + bob, text);
    }
  }

  function drawDogBody(mode, chickensHeld) {
    // body (oval)
    ctx.fillStyle = '#a06a3a';
    ctx.beginPath();
    ctx.ellipse(0, 0, 34, 24, 0, 0, Math.PI * 2);
    ctx.fill();
    // belly
    ctx.fillStyle = '#e6c08a';
    ctx.beginPath();
    ctx.ellipse(0, 8, 22, 14, 0, 0, Math.PI * 2);
    ctx.fill();
    // arms holding chickens up (success)
    if (mode === 'success' && chickensHeld > 0) {
      ctx.fillStyle = '#a06a3a';
      ctx.fillRect(-16, -28, 8, 22);
      ctx.fillRect(8, -32, 8, 26);
      const cn = Math.min(chickensHeld, 3);
      for (let i = 0; i < cn; i++) {
        const hx = -10 + i * 12;
        const hy = -42;
        drawHeldChicken(hx, hy);
      }
    }
    // head
    ctx.save();
    const headTilt = mode === 'laugh' ? -0.35 : 0;
    ctx.translate(22, -18);
    ctx.rotate(headTilt);
    // skull
    ctx.fillStyle = '#a06a3a';
    ctx.beginPath();
    ctx.arc(0, 0, 17, 0, Math.PI * 2);
    ctx.fill();
    // muzzle
    ctx.fillStyle = '#e6c08a';
    ctx.beginPath();
    ctx.ellipse(9, 7, 12, 8, 0, 0, Math.PI * 2);
    ctx.fill();
    // long floppy ear (left)
    ctx.fillStyle = '#7a4a26';
    ctx.beginPath();
    ctx.ellipse(-12, -2, 6, 16, -0.3, 0, Math.PI * 2);
    ctx.fill();
    // ear (right, smaller)
    ctx.beginPath();
    ctx.ellipse(8, -14, 5, 9, 0.4, 0, Math.PI * 2);
    ctx.fill();
    // eye
    ctx.fillStyle = '#000';
    if (mode === 'laugh') {
      ctx.strokeStyle = '#000';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(-3, -3); ctx.quadraticCurveTo(2, -7, 7, -3);
      ctx.stroke();
    } else {
      ctx.beginPath();
      ctx.arc(2, -3, 2.2, 0, Math.PI * 2);
      ctx.fill();
    }
    // nose
    ctx.fillStyle = '#000';
    ctx.beginPath();
    ctx.arc(17, 5, 3.2, 0, Math.PI * 2);
    ctx.fill();
    // open mouth + tongue (laugh)
    if (mode === 'laugh') {
      ctx.fillStyle = '#3a1818';
      ctx.beginPath();
      ctx.ellipse(11, 12, 8, 5, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#e85ca0';
      ctx.beginPath();
      ctx.ellipse(11, 13, 5, 3, 0, 0, Math.PI * 2);
      ctx.fill();
      // teeth
      ctx.fillStyle = '#fff';
      ctx.fillRect(5, 9, 2, 3);
      ctx.fillRect(15, 9, 2, 3);
    } else {
      // smug smile
      ctx.strokeStyle = '#000';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(5, 11); ctx.quadraticCurveTo(11, 14, 17, 11);
      ctx.stroke();
    }
    ctx.restore();
  }

  function drawHeldChicken(x, y) {
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(0.7, 0.7);
    // body
    ctx.fillStyle = '#f5f1e8';
    ctx.beginPath();
    ctx.ellipse(0, 0, 11, 8, 0, 0, Math.PI * 2);
    ctx.fill();
    // head
    ctx.beginPath();
    ctx.arc(8, -4, 5, 0, Math.PI * 2);
    ctx.fill();
    // X eye (dead)
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.moveTo(7, -6); ctx.lineTo(11, -2);
    ctx.moveTo(11, -6); ctx.lineTo(7, -2);
    ctx.stroke();
    // beak
    ctx.fillStyle = '#e8a83a';
    ctx.beginPath();
    ctx.moveTo(13, -4); ctx.lineTo(16, -3); ctx.lineTo(13, -2);
    ctx.closePath();
    ctx.fill();
    // legs sticking up
    ctx.strokeStyle = '#e8a83a';
    ctx.lineWidth = 1.4;
    ctx.beginPath();
    ctx.moveTo(-3, -6); ctx.lineTo(-4, -14);
    ctx.moveTo(2, -6); ctx.lineTo(3, -14);
    ctx.stroke();
    ctx.restore();
  }

  function drawBubble(cx, cy, text) {
    ctx.save();
    ctx.font = 'bold 18px sans-serif';
    const w = ctx.measureText(text).width + 22;
    const h = 28;
    ctx.fillStyle = '#fff';
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.roundRect(cx - w/2, cy - h/2, w, h, 10);
    ctx.fill();
    ctx.stroke();
    // tail
    ctx.beginPath();
    ctx.moveTo(cx - 12, cy + h/2);
    ctx.lineTo(cx - 24, cy + h/2 + 12);
    ctx.lineTo(cx - 4, cy + h/2);
    ctx.closePath();
    ctx.fillStyle = '#fff';
    ctx.fill();
    ctx.stroke();
    ctx.fillStyle = '#000';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(text, cx, cy);
    ctx.textBaseline = 'alphabetic';
    ctx.restore();
  }

  function loop(t) {
    if (!state.running) return;
    const dt = Math.min(0.05, (t - state.lastT) / 1000 || 0);
    state.lastT = t;
    update(dt);
    render(dt);
    updateHUD();
    requestAnimationFrame(loop);
  }

  function announceRound() {
    showBanner('ROUND ' + (state.levelIdx + 1), {
      big: true,
      sub: LEVELS[state.levelIdx].name,
      life: 2.2,
    });
  }

  function startGame() {
    state.running = true;
    state.mode = 'playing';
    state.score = 0;
    state.ammo = state.maxAmmo;
    state.reloading = false;
    state.chickens = [];
    state.particles = [];
    state.floats = [];
    state.shots = [];
    state.spawnTimer = 0.5;
    state.levelIdx = 0;
    state.misses = 0;
    state.roundBonus = 0;
    state.roundElapsed = 0;
    state.roundStartT = performance.now();
    state.dog = { active: false, t: 0, dur: 2.6, mode: 'success', hits: 0 };
    state.banner = { text: '', life: 0, big: false, sub: '' };
    resetRoundTargets();
    targetsBar.classList.remove('hidden');
    state.lastT = performance.now();
    overlay.classList.add('hidden');
    announceRound();
    updateHUD();
    requestAnimationFrame(loop);
  }

  function showLevelEnd() {
    state.running = false;
    state.mode = 'levelEnd';
    const cleared = LEVELS[state.levelIdx].name;
    const next = LEVELS[state.levelIdx + 1].name;
    const hits = state.roundTargets.filter(t => t === 'hit').length;
    overlay.classList.remove('hidden');
    overlay.querySelector('h1').textContent = cleared + ' — Pau!';
    overlay.querySelector('p').innerHTML =
      `Bagged <span class="stat">${hits}/${ROUND_SIZE}</span> in ` +
      `<span class="stat">${state.roundElapsed.toFixed(1)}s</span> &nbsp;·&nbsp; ` +
      `Misses: <span class="stat">${state.misses}</span>` +
      (hits === ROUND_SIZE ? ' &nbsp;<span class="stat">PERFECT!</span>' : '');
    overlay.querySelectorAll('p')[1].innerHTML =
      `Time bonus: <span class="stat">+${state.roundBonus}</span> &nbsp;·&nbsp; ` +
      `Score: <span class="stat">${state.score}</span> &nbsp;·&nbsp; ` +
      `Next: <span class="stat">${next}</span>`;
    startBtn.textContent = 'Proceed';
  }

  function nextLevel() {
    state.levelIdx++;
    state.ammo = state.maxAmmo;
    state.reloading = false;
    state.spawnTimer = 0.5;
    state.chickens = [];
    state.particles = [];
    state.shots = [];
    state.misses = 0;
    state.roundBonus = 0;
    state.roundElapsed = 0;
    state.roundStartT = performance.now();
    state.dog = { active: false, t: 0, dur: 2.6, mode: 'success', hits: 0 };
    state.mode = 'playing';
    state.running = true;
    resetRoundTargets();
    state.lastT = performance.now();
    overlay.classList.add('hidden');
    announceRound();
    updateHUD();
    requestAnimationFrame(loop);
  }

  function endGame(won) {
    state.running = false;
    state.mode = 'gameOver';
    targetsBar.classList.add('hidden');
    overlay.classList.remove('hidden');
    if (won) {
      overlay.querySelector('h1').textContent = 'Hunt Pau! You Win!';
      overlay.querySelector('p').innerHTML =
        `Cleared all 3 rounds. Final score: <span class="stat">${state.score}</span>.`;
      overlay.querySelectorAll('p')[1].innerHTML =
        state.score > 1500 ? 'Da kine sharpshooter! 🎯' :
        state.score > 800  ? 'Solid hunt, bruddah.' :
        'You did it — barely. 😮‍💨';
    } else {
      const hits = state.roundTargets.filter(t => t === 'hit').length;
      overlay.querySelector('h1').textContent = 'Game Over';
      overlay.querySelector('p').innerHTML =
        `Only bagged <span class="stat">${hits}/${ROUND_SIZE}</span> ` +
        `(needed <span class="stat">${ROUND_QUOTA}</span>) on round ` +
        `<span class="stat">${state.levelIdx + 1}</span>.`;
      overlay.querySelectorAll('p')[1].innerHTML =
        'Da dog stay laughing. Try again.';
    }
    startBtn.textContent = 'Play Again';
  }

  startBtn.addEventListener('click', () => {
    if (state.mode === 'levelEnd') nextLevel();
    else startGame();
  });
})();
</script>
</body>
</html>
