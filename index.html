<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Corporate Invaders</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #0a1428;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: #e8eef7;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior: none;
  }
  #game {
    display: block;
    width: 100vw;
    height: 100vh;
    touch-action: none;
  }
  .overlay {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
    box-sizing: border-box;
    background: #000;
    z-index: 10;
    font-family: 'Press Start 2P', 'Courier New', monospace;
  }
  .overlay.hidden { display: none; }
  .invader-row {
    display: flex;
    gap: clamp(14px, 4vw, 28px);
    font-size: clamp(28px, 8vw, 52px);
    font-family: monospace;
    font-weight: bold;
    margin-bottom: clamp(16px, 4vw, 28px);
    animation: drift 1.4s steps(2) infinite;
  }
  .invader-row span:nth-child(1) { color: #eb5757; }
  .invader-row span:nth-child(2) { color: #f2994a; }
  .invader-row span:nth-child(3) { color: #f2c94c; }
  .invader-row span:nth-child(4) { color: #6fcf97; }
  .invader-row span:nth-child(5) { color: #56ccf2; }
  @keyframes drift {
    0%, 100% { transform: translateX(0); }
    50% { transform: translateX(14px); }
  }
  .arcade-title {
    font-size: clamp(22px, 7vw, 44px);
    line-height: 1.5;
    color: #6fcf97;
    text-shadow: 4px 4px 0 #1f5e2c, 8px 8px 0 rgba(0, 0, 0, 0.6);
    letter-spacing: 2px;
    margin: 0 0 clamp(18px, 4vw, 28px);
    text-align: center;
  }
  .arcade-title.warn { color: #eb5757; text-shadow: 4px 4px 0 #6e1f1f, 8px 8px 0 rgba(0, 0, 0, 0.6); }
  .arcade-line {
    font-size: clamp(9px, 2.4vw, 13px);
    line-height: 1.8;
    letter-spacing: 1.5px;
    color: #e8eef7;
    margin: 6px 0;
    max-width: 520px;
    text-transform: uppercase;
  }
  .arcade-line.dim { color: #6a7a90; margin-top: clamp(14px, 3vw, 20px); }
  .arcade-line.score { color: #f2c94c; margin-top: clamp(14px, 3vw, 20px); font-size: clamp(11px, 3vw, 16px); }
  .arcade-btn {
    margin-top: clamp(22px, 5vw, 36px);
    padding: 16px 28px;
    background: transparent;
    color: #f2c94c;
    border: 3px solid #f2c94c;
    font-family: inherit;
    font-size: clamp(11px, 3vw, 15px);
    letter-spacing: 3px;
    text-transform: uppercase;
    cursor: pointer;
    touch-action: manipulation;
    animation: blink 1.2s steps(2, start) infinite;
  }
  .arcade-btn:active { background: #f2c94c; color: #000; animation: none; }
  @keyframes blink { 50% { opacity: 0.35; } }
  .accent { color: #6fcf97; }
  .warn { color: #eb5757; }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="startScreen" class="overlay">
  <div class="invader-row" aria-hidden="true">
    <span>$</span><span>$</span><span>$</span><span>$</span><span>$</span>
  </div>
  <h1 class="arcade-title">CORPORATE<br>INVADERS</h1>
  <p class="arcade-line">Defend the Hawaii State Capitol</p>
  <p class="arcade-line dim">Drag to move &middot; Tap to fire</p>
  <button id="startBtn" class="arcade-btn">Press Start</button>
</div>

<div id="endScreen" class="overlay hidden">
  <h2 id="endTitle" class="arcade-title warn">Game Over</h2>
  <p id="endStats" class="arcade-line score"></p>
  <button id="restartBtn" class="arcade-btn">Play Again</button>
</div>

<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');

  // Virtual resolution (portrait). All game logic uses these coords.
  const VW = 800;
  const VH = 1200;
  let scale = 1;
  let offsetX = 0;
  let offsetY = 0;

  function resize() {
    const dpr = window.devicePixelRatio || 1;
    const cssW = window.innerWidth;
    const cssH = window.innerHeight;
    canvas.width = Math.floor(cssW * dpr);
    canvas.height = Math.floor(cssH * dpr);
    canvas.style.width = cssW + 'px';
    canvas.style.height = cssH + 'px';
    // Fit virtual resolution into the canvas, letterboxing as needed.
    const sx = canvas.width / VW;
    const sy = canvas.height / VH;
    scale = Math.min(sx, sy);
    offsetX = (canvas.width - VW * scale) / 2;
    offsetY = (canvas.height - VH * scale) / 2;
  }
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', resize);
  resize();

  // Map a CSS-pixel touch/mouse point to virtual coords.
  function toVirtual(clientX, clientY) {
    const rect = canvas.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    const px = (clientX - rect.left) * dpr;
    const py = (clientY - rect.top) * dpr;
    return {
      x: (px - offsetX) / scale,
      y: (py - offsetY) / scale
    };
  }

  // ---------- Game state ----------
  const state = {
    running: false,
    player: { x: VW / 2, y: VH - 180, w: 80, h: 36, cooldown: 0 },
    bullets: [],
    invaders: [],
    invaderBullets: [],
    particles: [],
    bonus: null,
    dir: 1,
    speed: 28,         // px/sec horizontal
    descend: 20,       // px per edge bounce
    fireRate: 0.28,    // seconds between player shots
    firing: false,
    score: 0,
    wave: 1,
    capitolHeight: 140,
    capitol: null,
    smokeTimer: 0,
    over: false,
    won: false
  };

  const PILLAR_COUNT = 8;
  const CAPITOL_MAX_HP = 10; // 8 pillars + seal cracked + seal destroyed

  function newCapitol() {
    return {
      maxHp: CAPITOL_MAX_HP,
      hp: CAPITOL_MAX_HP,
      destroyedPillars: new Set(),
      sealCracked: false,
      sealDestroyed: false
    };
  }

  function pillarCenterX(i) {
    const cx = VW / 2;
    const w = 520;
    const left = cx - w / 2;
    const pillarW = 28;
    const pillarGap = (w - pillarW * PILLAR_COUNT) / (PILLAR_COUNT - 1);
    return left + i * (pillarW + pillarGap) + pillarW / 2;
  }

  function getCapitolRects() {
    const c = state.capitol;
    const baseY = VH - 20;
    const top = VH - state.capitolHeight;
    const cx = VW / 2;
    const w = 520;
    const left = cx - w / 2;
    const pillarW = 28;
    const pillarGap = (w - pillarW * PILLAR_COUNT) / (PILLAR_COUNT - 1);
    const rects = [];
    rects.push({ x: left - 20, y: baseY - 16, w: w + 40, h: 16 }); // platform
    for (let i = 0; i < PILLAR_COUNT; i++) {
      if (c && c.destroyedPillars.has(i)) continue;
      const px = left + i * (pillarW + pillarGap);
      rects.push({ x: px, y: top + 26, w: pillarW, h: baseY - 16 - (top + 26) });
    }
    rects.push({ x: left - 24, y: top - 10, w: w + 48, h: 36 }); // flat roof slab
    rects.push({ x: cx - 100, y: top - 32, w: 200, h: 22 }); // upper tier
    if (!c || !c.sealDestroyed) {
      rects.push({ x: cx - 40, y: top + 38, w: 80, h: 80 }); // seal disc bbox
    }
    return rects;
  }

  function damageCapitol(x) {
    const c = state.capitol;
    if (!c || c.hp <= 0) return;
    c.hp--;
    const dmg = c.maxHp - c.hp; // 1..maxHp
    if (dmg <= PILLAR_COUNT) {
      // Destroy the pillar nearest the impact x.
      const remaining = [];
      for (let p = 0; p < PILLAR_COUNT; p++) if (!c.destroyedPillars.has(p)) remaining.push(p);
      let pick = remaining[0];
      let bestDist = Math.abs(pillarCenterX(pick) - x);
      for (const p of remaining) {
        const d = Math.abs(pillarCenterX(p) - x);
        if (d < bestDist) { bestDist = d; pick = p; }
      }
      c.destroyedPillars.add(pick);
      const px = pillarCenterX(pick);
      spawnParticles(px, VH - 80, '#cfd6df');
      spawnParticles(px, VH - 60, '#8a96aa');
    } else if (dmg === PILLAR_COUNT + 1) {
      c.sealCracked = true;
      spawnParticles(VW / 2, VH - state.capitolHeight + 78, '#5f7b6d');
    } else {
      c.sealDestroyed = true;
      for (let i = -1; i <= 1; i++) {
        spawnParticles(VW / 2 + i * 24, VH - state.capitolHeight + 78, '#5f7b6d');
      }
    }
    if (c.hp <= 0) endGame(false);
  }

  const ROWS = 5;
  const COLS = 8;
  const ROW_COLORS = ['#eb5757', '#f2994a', '#f2c94c', '#6fcf97', '#56ccf2'];
  const ROW_LABEL = ['Mega PAC', 'Lobbyist', 'Industry', 'Trade Group', 'Small Donor'];

  function spawnWave() {
    state.invaders.length = 0;
    const marginX = 100;
    const marginY = 140;
    const spacingX = (VW - marginX * 2) / (COLS - 1);
    const spacingY = 70;
    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        state.invaders.push({
          x: marginX + c * spacingX,
          y: marginY + r * spacingY,
          row: r,
          alive: true,
          w: 50,
          h: 50
        });
      }
    }
    state.dir = 1;
    state.speed = 28 + (state.wave - 1) * 8;
  }

  // ---------- Music (procedural chiptune) ----------
  const Music = (() => {
    let ctx = null;
    let master = null;
    let playing = false;
    let timer = null;
    let nextTime = 0;
    let step = 0;
    const stepDur = 0.2;
    const bassPattern = [40, 40, 38, 38, 35, 35, 38, 38];   // E2 D2 B1 D2 (MIDI)
    const leadPattern = [64, 67, 71, 67, 64, 67, 72, 67];   // E4 G4 B4 / C5
    const kickSteps = new Set([0, 2, 4, 6]);
    const freq = (m) => 440 * Math.pow(2, (m - 69) / 12);

    function blip(f, t, dur, type, vol) {
      const o = ctx.createOscillator();
      const g = ctx.createGain();
      o.type = type;
      o.frequency.setValueAtTime(f, t);
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(vol, t + 0.005);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g).connect(master);
      o.start(t);
      o.stop(t + dur + 0.05);
    }
    function kick(t) {
      const o = ctx.createOscillator();
      const g = ctx.createGain();
      o.type = 'sine';
      o.frequency.setValueAtTime(120, t);
      o.frequency.exponentialRampToValueAtTime(40, t + 0.08);
      g.gain.setValueAtTime(0.18, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.15);
      o.connect(g).connect(master);
      o.start(t);
      o.stop(t + 0.2);
    }
    function tick() {
      if (!playing) return;
      while (nextTime < ctx.currentTime + 0.4) {
        const bi = step % bassPattern.length;
        const li = step % leadPattern.length;
        blip(freq(bassPattern[bi]), nextTime, stepDur * 0.9, 'square', 0.05);
        blip(freq(leadPattern[li]), nextTime, stepDur * 0.7, 'square', 0.03);
        if (kickSteps.has(step % 8)) kick(nextTime);
        nextTime += stepDur;
        step++;
      }
      timer = setTimeout(tick, 100);
    }
    return {
      start() {
        if (playing) return;
        try {
          if (!ctx) {
            const AC = window.AudioContext || window.webkitAudioContext;
            if (!AC) return;
            ctx = new AC();
            master = ctx.createGain();
            master.gain.value = 0.5;
            master.connect(ctx.destination);
          }
          if (ctx.state === 'suspended') ctx.resume();
          master.gain.cancelScheduledValues(ctx.currentTime);
          master.gain.setValueAtTime(0, ctx.currentTime);
          master.gain.linearRampToValueAtTime(0.5, ctx.currentTime + 0.2);
          playing = true;
          nextTime = ctx.currentTime + 0.05;
          step = 0;
          tick();
        } catch (e) { /* silent */ }
      },
      stop() {
        if (!playing) return;
        playing = false;
        if (timer) { clearTimeout(timer); timer = null; }
        if (master && ctx) {
          master.gain.cancelScheduledValues(ctx.currentTime);
          master.gain.setValueAtTime(master.gain.value, ctx.currentTime);
          master.gain.linearRampToValueAtTime(0, ctx.currentTime + 0.3);
        }
      }
    };
  })();

  function startGame() {
    state.score = 0;
    state.wave = 1;
    state.bullets.length = 0;
    state.invaderBullets.length = 0;
    state.particles.length = 0;
    state.bonus = null;
    state.player.x = VW / 2;
    state.player.cooldown = 0;
    state.capitol = newCapitol();
    state.smokeTimer = 0;
    state.over = false;
    state.won = false;
    state.running = true;
    spawnWave();
    document.getElementById('startScreen').classList.add('hidden');
    document.getElementById('endScreen').classList.add('hidden');
    Music.start();
  }

  function endGame(won) {
    Music.stop();
    state.running = false;
    state.over = true;
    state.won = won;
    const title = document.getElementById('endTitle');
    const stats = document.getElementById('endStats');
    if (won) {
      title.textContent = 'Capitol Defended';
      title.className = 'arcade-title';
    } else {
      title.textContent = 'Game Over';
      title.className = 'arcade-title warn';
    }
    stats.textContent = `Score: ${state.score}  ·  Wave: ${state.wave}`;
    document.getElementById('endScreen').classList.remove('hidden');
  }

  // ---------- Input ----------
  let dragActive = false;
  let dragOffsetX = 0;

  function pressAt(vx, vy) {
    state.firing = true;
    // If the touch is near or below the player, treat as a drag handle.
    if (vy > VH * 0.45) {
      dragActive = true;
      dragOffsetX = state.player.x - vx;
    }
  }
  function moveAt(vx) {
    if (!dragActive) return;
    let nx = vx + dragOffsetX;
    nx = Math.max(state.player.w / 2, Math.min(VW - state.player.w / 2, nx));
    state.player.x = nx;
  }
  function release() {
    state.firing = false;
    dragActive = false;
  }

  canvas.addEventListener('touchstart', (e) => {
    e.preventDefault();
    if (!state.running) return;
    const t = e.changedTouches[0];
    const p = toVirtual(t.clientX, t.clientY);
    pressAt(p.x, p.y);
  }, { passive: false });
  canvas.addEventListener('touchmove', (e) => {
    e.preventDefault();
    if (!state.running) return;
    const t = e.changedTouches[0];
    const p = toVirtual(t.clientX, t.clientY);
    moveAt(p.x);
  }, { passive: false });
  canvas.addEventListener('touchend', (e) => {
    e.preventDefault();
    release();
  }, { passive: false });
  canvas.addEventListener('touchcancel', (e) => {
    e.preventDefault();
    release();
  }, { passive: false });

  canvas.addEventListener('mousedown', (e) => {
    if (!state.running) return;
    const p = toVirtual(e.clientX, e.clientY);
    pressAt(p.x, p.y);
  });
  canvas.addEventListener('mousemove', (e) => {
    if (!state.running) return;
    const p = toVirtual(e.clientX, e.clientY);
    moveAt(p.x);
  });
  window.addEventListener('mouseup', release);

  const keys = {};
  window.addEventListener('keydown', (e) => {
    keys[e.key] = true;
    if (e.key === ' ') state.firing = true;
  });
  window.addEventListener('keyup', (e) => {
    keys[e.key] = false;
    if (e.key === ' ') state.firing = false;
  });

  document.getElementById('startBtn').addEventListener('click', startGame);
  document.getElementById('restartBtn').addEventListener('click', startGame);

  // ---------- Update ----------
  function fireBullet() {
    state.bullets.push({
      x: state.player.x,
      y: state.player.y - state.player.h / 2,
      vy: -630,
      w: 5,
      h: 14
    });
    state.player.cooldown = state.fireRate;
  }

  function invaderShoot() {
    // Bottom-most living invader in a random column fires.
    const cols = new Map();
    for (const inv of state.invaders) {
      if (!inv.alive) continue;
      const key = Math.round(inv.x);
      const cur = cols.get(key);
      if (!cur || inv.y > cur.y) cols.set(key, inv);
    }
    const shooters = [...cols.values()];
    if (!shooters.length) return;
    const s = shooters[Math.floor(Math.random() * shooters.length)];
    state.invaderBullets.push({
      x: s.x,
      y: s.y + s.h / 2,
      vy: 252,
      w: 6,
      h: 14
    });
  }

  let invaderShootTimer = 0;
  let bonusTimer = 8;

  function update(dt) {
    if (!state.running) return;

    // Keyboard movement
    const kSpeed = 364;
    if (keys['ArrowLeft'] || keys['a']) state.player.x -= kSpeed * dt;
    if (keys['ArrowRight'] || keys['d']) state.player.x += kSpeed * dt;
    state.player.x = Math.max(state.player.w / 2, Math.min(VW - state.player.w / 2, state.player.x));

    // Player firing
    state.player.cooldown -= dt;
    if (state.firing && state.player.cooldown <= 0) fireBullet();

    // Player bullets
    for (const b of state.bullets) b.y += b.vy * dt;
    state.bullets = state.bullets.filter(b => b.y + b.h > 0);

    // Invader movement
    let minX = Infinity, maxX = -Infinity, maxY = -Infinity;
    let aliveCount = 0;
    for (const inv of state.invaders) {
      if (!inv.alive) continue;
      aliveCount++;
      minX = Math.min(minX, inv.x - inv.w / 2);
      maxX = Math.max(maxX, inv.x + inv.w / 2);
      maxY = Math.max(maxY, inv.y + inv.h / 2);
    }
    // Speed ramps as fewer remain.
    const speedMul = 1 + (1 - aliveCount / (ROWS * COLS)) * 2.2;
    const sp = state.speed * speedMul;
    let bounce = false;
    if (aliveCount > 0) {
      const dx = state.dir * sp * dt;
      if (state.dir > 0 && maxX + dx > VW - 30) bounce = true;
      if (state.dir < 0 && minX + dx < 30) bounce = true;
      for (const inv of state.invaders) {
        if (!inv.alive) continue;
        if (bounce) inv.y += state.descend;
        else inv.x += dx;
      }
      if (bounce) state.dir *= -1;
    } else {
      state.wave++;
      state.capitol = newCapitol();
      state.invaderBullets.length = 0;
      spawnWave();
    }

    // Invader shooting
    invaderShootTimer -= dt;
    const shootInterval = Math.max(1.6, 6.4 - state.wave * 0.6);
    if (invaderShootTimer <= 0) {
      invaderShoot();
      invaderShootTimer = shootInterval * (0.6 + Math.random() * 0.8);
    }

    // Bonus "Super PAC" streaker
    bonusTimer -= dt;
    if (!state.bonus && bonusTimer <= 0) {
      const fromLeft = Math.random() < 0.5;
      state.bonus = {
        x: fromLeft ? -60 : VW + 60,
        y: 80,
        vx: fromLeft ? 168 : -168,
        w: 110,
        h: 40
      };
      bonusTimer = 12 + Math.random() * 8;
    }
    if (state.bonus) {
      state.bonus.x += state.bonus.vx * dt;
      if (state.bonus.x < -120 || state.bonus.x > VW + 120) state.bonus = null;
    }

    // Invader bullets
    const capitolTop = VH - state.capitolHeight;
    for (const b of state.invaderBullets) b.y += b.vy * dt;
    const capitolRects = getCapitolRects();
    state.invaderBullets = state.invaderBullets.filter(b => {
      for (const r of capitolRects) {
        if (b.x >= r.x && b.x <= r.x + r.w && b.y >= r.y && b.y <= r.y + r.h) {
          damageCapitol(b.x);
          spawnParticles(b.x, b.y, '#eb5757');
          return false;
        }
      }
      return b.y < VH + 20;
    });

    // Collisions: player bullets vs invaders
    for (const b of state.bullets) {
      for (const inv of state.invaders) {
        if (!inv.alive) continue;
        if (Math.abs(b.x - inv.x) < inv.w / 2 && Math.abs(b.y - inv.y) < inv.h / 2) {
          inv.alive = false;
          b.y = -100;
          state.score += 10 * (ROWS - inv.row);
          spawnParticles(inv.x, inv.y, ROW_COLORS[inv.row]);
          break;
        }
      }
      // vs bonus
      if (state.bonus) {
        const bn = state.bonus;
        if (Math.abs(b.x - bn.x) < bn.w / 2 && Math.abs(b.y - bn.y) < bn.h / 2) {
          state.score += 250;
          spawnParticles(bn.x, bn.y, '#f2c94c');
          spawnParticles(bn.x - 20, bn.y, '#f2c94c');
          spawnParticles(bn.x + 20, bn.y, '#f2c94c');
          state.bonus = null;
          b.y = -100;
        }
      }
    }
    state.bullets = state.bullets.filter(b => b.y + b.h > 0);

    // Collisions: invader bullets vs player
    const p = state.player;
    for (const b of state.invaderBullets) {
      if (Math.abs(b.x - p.x) < p.w / 2 && Math.abs(b.y - p.y) < p.h / 2) {
        endGame(false);
        return;
      }
    }

    // Invaders that crash into the Capitol chip away at it.
    for (const inv of state.invaders) {
      if (!inv.alive) continue;
      if (inv.y + inv.h / 2 >= capitolTop - 10) {
        inv.alive = false;
        spawnParticles(inv.x, inv.y, ROW_COLORS[inv.row]);
        damageCapitol(inv.x);
        if (state.over) return;
      }
    }

    // Smoke from damaged areas.
    state.smokeTimer -= dt;
    if (state.smokeTimer <= 0 && state.capitol) {
      state.smokeTimer = 0.18;
      const c = state.capitol;
      for (const p of c.destroyedPillars) {
        if (Math.random() < 0.6) emitSmoke(pillarCenterX(p), VH - 80);
      }
      if (c.sealCracked && !c.sealDestroyed) {
        emitSmoke(VW / 2 + (Math.random() - 0.5) * 30, VH - state.capitolHeight + 78);
      }
      if (c.sealDestroyed) {
        emitSmoke(VW / 2 + (Math.random() - 0.5) * 60, VH - 30);
      }
    }

    // Particles
    for (const pt of state.particles) {
      pt.x += pt.vx * dt;
      pt.y += pt.vy * dt;
      pt.life -= dt;
    }
    state.particles = state.particles.filter(pt => pt.life > 0);
  }

  function spawnParticles(x, y, color) {
    for (let i = 0; i < 10; i++) {
      const a = Math.random() * Math.PI * 2;
      const s = 80 + Math.random() * 160;
      state.particles.push({
        x, y,
        vx: Math.cos(a) * s,
        vy: Math.sin(a) * s,
        life: 0.4 + Math.random() * 0.3,
        color
      });
    }
  }

  function emitSmoke(x, y) {
    state.particles.push({
      x: x + (Math.random() - 0.5) * 8,
      y,
      vx: (Math.random() - 0.5) * 30,
      vy: -40 - Math.random() * 40,
      life: 1.2 + Math.random() * 0.6,
      color: '#5a6478',
      smoke: true
    });
  }

  // ---------- Render ----------
  function drawCapitol() {
    // Hawaii State Capitol stylized: tall fluted pillars under a flat
    // upper structure, with the State Seal hung between center pillars.
    const c = state.capitol;
    const baseY = VH - 20;
    const top = VH - state.capitolHeight;
    const cx = VW / 2;
    const w = 520;
    const left = cx - w / 2;

    // Reflecting pool / base
    ctx.fillStyle = '#1a3050';
    ctx.fillRect(0, baseY - 10, VW, 30);

    // Platform
    ctx.fillStyle = '#cfd6df';
    ctx.fillRect(left - 20, baseY - 16, w + 40, 16);

    // Pillars (skip destroyed; draw rubble stub in their place)
    const pillarW = 28;
    const pillarGap = (w - pillarW * PILLAR_COUNT) / (PILLAR_COUNT - 1);
    const pillarTop = top + 26;
    const pillarBottom = baseY - 16;
    for (let i = 0; i < PILLAR_COUNT; i++) {
      const px = left + i * (pillarW + pillarGap);
      if (c && c.destroyedPillars.has(i)) {
        // Rubble stub
        ctx.fillStyle = '#6c7588';
        ctx.fillRect(px, pillarBottom - 10, pillarW, 10);
        ctx.fillStyle = '#4a5060';
        ctx.fillRect(px + 4, pillarBottom - 14, pillarW - 8, 4);
        // Scorch
        ctx.fillStyle = 'rgba(0,0,0,0.35)';
        ctx.beginPath();
        ctx.ellipse(px + pillarW / 2, pillarBottom - 2, pillarW * 0.7, 4, 0, 0, Math.PI * 2);
        ctx.fill();
      } else {
        ctx.fillStyle = '#e8eef7';
        ctx.fillRect(px, pillarTop, pillarW, pillarBottom - pillarTop);
        // Fluting lines
        ctx.fillStyle = '#bcc4d0';
        ctx.fillRect(px + 8, pillarTop, 1, pillarBottom - pillarTop);
        ctx.fillRect(px + 14, pillarTop, 1, pillarBottom - pillarTop);
        ctx.fillRect(px + 20, pillarTop, 1, pillarBottom - pillarTop);
      }
    }

    // Upper tier — a modest truncated section poking above the flat roof
    ctx.fillStyle = '#9aa7bd';
    ctx.beginPath();
    ctx.moveTo(cx - 100, top - 10);
    ctx.lineTo(cx - 70, top - 32);
    ctx.lineTo(cx + 70, top - 32);
    ctx.lineTo(cx + 100, top - 10);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = '#b6c0d0';
    ctx.fillRect(cx - 70, top - 32, 140, 4);

    // Flat upper roof slab
    ctx.fillStyle = '#cfd6df';
    ctx.fillRect(left - 24, top - 10, w + 48, 36);
    ctx.fillStyle = '#e8eef7';
    ctx.fillRect(left - 24, top - 10, w + 48, 4);
    ctx.fillStyle = '#9aa7bd';
    ctx.fillRect(left - 24, top + 22, w + 48, 4);

    // Hanging State Seal
    const sealCx = cx;
    const sealCy = top + 78;
    const sealR = 40;

    if (!c || !c.sealDestroyed) {
      // Suspension chains from the roof
      ctx.strokeStyle = '#6a7488';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(sealCx - 32, top + 26);
      ctx.lineTo(sealCx - 18, sealCy - sealR + 4);
      ctx.moveTo(sealCx + 32, top + 26);
      ctx.lineTo(sealCx + 18, sealCy - sealR + 4);
      ctx.stroke();
      ctx.lineWidth = 1;

      // Patina disc: outer raised rim, recessed channel, central field
      ctx.fillStyle = '#7d9588';                       // outer rim, oxidized copper
      ctx.beginPath();
      ctx.arc(sealCx, sealCy, sealR, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#3d5547';                       // recessed channel (text track)
      ctx.beginPath();
      ctx.arc(sealCx, sealCy, sealR - 3, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#5f7b6d';                       // inner field
      ctx.beginPath();
      ctx.arc(sealCx, sealCy, sealR - 11, 0, Math.PI * 2);
      ctx.fill();
      // Subtle bronze undertone bleeding through patina
      ctx.fillStyle = 'rgba(168, 123, 63, 0.22)';
      ctx.beginPath();
      ctx.arc(sealCx - 4, sealCy - 6, sealR - 14, 0, Math.PI * 2);
      ctx.fill();

      // Beaded inner border (raised dots between channel and field)
      ctx.fillStyle = '#a8c0b3';
      for (let i = 0; i < 32; i++) {
        const a = i * (Math.PI * 2) / 32;
        const x = sealCx + Math.cos(a) * (sealR - 11);
        const y = sealCy + Math.sin(a) * (sealR - 11);
        ctx.beginPath();
        ctx.arc(x, y, 0.9, 0, Math.PI * 2);
        ctx.fill();
      }

      // Arc text on the channel
      ctx.fillStyle = '#1f2a25';
      ctx.font = 'bold 7px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      drawArcText(ctx, 'STATE OF HAWAII', sealCx, sealCy, sealR - 6, -Math.PI / 2, 0.118, false);
      ctx.font = 'bold 5px sans-serif';
      drawArcText(ctx, 'UA MAU KE EA O KA AINA I KA PONO', sealCx, sealCy, sealR - 6, Math.PI / 2, 0.078, true);

      // Stars + 1959 inside the upper field
      ctx.fillStyle = '#1f2a25';
      ctx.font = 'bold 6px sans-serif';
      ctx.fillText('★  1959  ★', sealCx, sealCy - sealR + 17);

      // Central crest: simple shield with stripes, flanked by suggestion marks
      const shX = sealCx, shY = sealCy + 2, shW = 18, shH = 22;
      // Shield silhouette
      ctx.fillStyle = '#9bb0a4';
      ctx.beginPath();
      ctx.moveTo(shX - shW / 2, shY - shH / 2);
      ctx.lineTo(shX + shW / 2, shY - shH / 2);
      ctx.lineTo(shX + shW / 2, shY + shH / 4);
      ctx.quadraticCurveTo(shX, shY + shH / 2 + 4, shX - shW / 2, shY + shH / 4);
      ctx.closePath();
      ctx.fill();
      // Vertical stripes on shield
      ctx.fillStyle = '#3d5547';
      ctx.fillRect(shX - shW / 2 + 3, shY - shH / 2 + 3, 3, shH - 8);
      ctx.fillRect(shX - 1.5, shY - shH / 2 + 3, 3, shH - 8);
      ctx.fillRect(shX + shW / 2 - 6, shY - shH / 2 + 3, 3, shH - 8);
      // Shield outline
      ctx.strokeStyle = '#1f2a25';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(shX - shW / 2, shY - shH / 2);
      ctx.lineTo(shX + shW / 2, shY - shH / 2);
      ctx.lineTo(shX + shW / 2, shY + shH / 4);
      ctx.quadraticCurveTo(shX, shY + shH / 2 + 4, shX - shW / 2, shY + shH / 4);
      ctx.closePath();
      ctx.stroke();
      // Flanking figure suggestions (two small uprights — King Kamehameha and Goddess of Liberty stand-ins)
      ctx.fillStyle = '#3d5547';
      ctx.fillRect(shX - 18, shY - 6, 3, 14);
      ctx.fillRect(shX + 15, shY - 6, 3, 14);
      // Sun rays behind shield (above)
      ctx.strokeStyle = '#a8c0b3';
      ctx.lineWidth = 0.8;
      for (let i = -2; i <= 2; i++) {
        ctx.beginPath();
        ctx.moveTo(shX, shY - shH / 2 - 1);
        ctx.lineTo(shX + i * 4, shY - shH / 2 - 7);
        ctx.stroke();
      }
      ctx.lineWidth = 1;

      if (c && c.sealCracked) {
        ctx.strokeStyle = '#0a1428';
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.moveTo(sealCx - sealR + 4, sealCy - 8);
        ctx.lineTo(sealCx - 6, sealCy + 2);
        ctx.lineTo(sealCx + 4, sealCy - 6);
        ctx.lineTo(sealCx + sealR - 6, sealCy + 12);
        ctx.stroke();
        ctx.lineWidth = 1;
      }
    } else {
      // Seal has fallen: snapped chains and patina fragments on the platform
      ctx.strokeStyle = '#6a7488';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(sealCx - 32, top + 26);
      ctx.lineTo(sealCx - 28, top + 60);
      ctx.moveTo(sealCx + 32, top + 26);
      ctx.lineTo(sealCx + 28, top + 60);
      ctx.stroke();
      ctx.lineWidth = 1;
      // Fragments resting on platform
      ctx.fillStyle = '#3d5547';
      ctx.fillRect(sealCx - 34, baseY - 22, 18, 6);
      ctx.fillRect(sealCx - 6, baseY - 24, 22, 8);
      ctx.fillRect(sealCx + 18, baseY - 22, 14, 6);
      ctx.fillStyle = '#7d9588';
      ctx.fillRect(sealCx - 30, baseY - 22, 6, 4);
      ctx.fillRect(sealCx + 4, baseY - 24, 8, 4);
      // Ember glow
      ctx.fillStyle = 'rgba(235, 87, 87, 0.45)';
      ctx.beginPath();
      ctx.ellipse(sealCx, baseY - 18, 40, 4, 0, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function drawArcText(ctx, text, cx, cy, radius, centerAngle, spacing, inverted) {
    const n = text.length;
    for (let i = 0; i < n; i++) {
      const offset = i - (n - 1) / 2;
      const angle = centerAngle + offset * spacing * (inverted ? -1 : 1);
      ctx.save();
      ctx.translate(cx + Math.cos(angle) * radius, cy + Math.sin(angle) * radius);
      ctx.rotate(angle + (inverted ? -Math.PI / 2 : Math.PI / 2));
      ctx.fillText(text[i], 0, 0);
      ctx.restore();
    }
  }

  function drawPlayer() {
    const p = state.player;
    // Base
    ctx.fillStyle = '#6fcf97';
    ctx.fillRect(p.x - p.w / 2, p.y - 6, p.w, 14);
    // Cannon
    ctx.fillStyle = '#aef0c4';
    ctx.fillRect(p.x - 6, p.y - p.h / 2, 12, 24);
    // Label
    ctx.fillStyle = '#0a1428';
    ctx.font = 'bold 14px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('SB2471', p.x, p.y + 1);
  }

  function drawInvaders() {
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = 'bold 48px monospace';
    for (const inv of state.invaders) {
      if (!inv.alive) continue;
      ctx.fillStyle = ROW_COLORS[inv.row];
      ctx.fillText('$', inv.x, inv.y);
    }
  }

  function drawBonus() {
    if (!state.bonus) return;
    const b = state.bonus;
    ctx.fillStyle = 'rgba(242, 201, 76, 0.18)';
    ctx.fillRect(b.x - b.w / 2, b.y - b.h / 2, b.w, b.h);
    ctx.fillStyle = '#f2c94c';
    ctx.font = 'bold 28px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('SUPER PAC $$$', b.x, b.y);
  }

  function drawBullets() {
    ctx.fillStyle = '#aef0c4';
    for (const b of state.bullets) ctx.fillRect(b.x - b.w / 2, b.y - b.h / 2, b.w, b.h);
    ctx.fillStyle = '#eb5757';
    for (const b of state.invaderBullets) ctx.fillRect(b.x - b.w / 2, b.y - b.h / 2, b.w, b.h);
  }

  function drawParticles() {
    for (const pt of state.particles) {
      if (pt.smoke) {
        ctx.globalAlpha = Math.max(0, Math.min(0.55, pt.life * 0.5));
        ctx.fillStyle = pt.color;
        const r = 6 + (1.5 - pt.life) * 6;
        ctx.beginPath();
        ctx.arc(pt.x, pt.y, r, 0, Math.PI * 2);
        ctx.fill();
      } else {
        ctx.globalAlpha = Math.max(0, pt.life);
        ctx.fillStyle = pt.color;
        ctx.fillRect(pt.x - 2, pt.y - 2, 4, 4);
      }
    }
    ctx.globalAlpha = 1;
  }

  function drawHUD() {
    ctx.fillStyle = '#aab8d0';
    ctx.font = '20px sans-serif';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'top';
    ctx.fillText(`Score: ${state.score}`, 24, 24);
    ctx.textAlign = 'right';
    ctx.fillText(`Wave ${state.wave}`, VW - 24, 24);

    // Capitol integrity bar
    if (state.capitol) {
      const c = state.capitol;
      const barW = 220;
      const barH = 14;
      const barX = (VW - barW) / 2;
      const barY = 28;
      ctx.fillStyle = '#1a2a4a';
      ctx.fillRect(barX, barY, barW, barH);
      const pct = Math.max(0, c.hp / c.maxHp);
      const color = pct > 0.66 ? '#6fcf97' : pct > 0.33 ? '#f2c94c' : '#eb5757';
      ctx.fillStyle = color;
      ctx.fillRect(barX, barY, barW * pct, barH);
      ctx.strokeStyle = '#aab8d0';
      ctx.lineWidth = 1;
      ctx.strokeRect(barX, barY, barW, barH);
      ctx.fillStyle = '#aab8d0';
      ctx.font = '14px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('CAPITOL INTEGRITY', VW / 2, barY + barH + 4);
    }
  }

  function drawStars() {
    // Static-ish starfield. Seeded pattern.
    ctx.fillStyle = '#1a2a4a';
    for (let i = 0; i < 60; i++) {
      const x = (i * 137.5) % VW;
      const y = (i * 71.3) % (VH - state.capitolHeight - 20);
      ctx.fillRect(x, y, 2, 2);
    }
  }

  function render() {
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = '#0a1428';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.setTransform(scale, 0, 0, scale, offsetX, offsetY);

    drawStars();
    drawCapitol();
    drawInvaders();
    drawBonus();
    drawBullets();
    drawParticles();
    drawPlayer();
    drawHUD();
  }

  // ---------- Loop ----------
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    update(dt);
    render();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
