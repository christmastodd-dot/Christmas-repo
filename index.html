<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Sammy Kong</title>
<style>
  :root { color-scheme: dark; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #000;
    font-family: "Courier New", monospace;
    color: #fff;
    overflow: hidden;
    touch-action: none;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  #wrap {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
  }
  #game {
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    background: #000;
    display: block;
    /* Fill viewport while preserving 256x288 aspect ratio */
    width: min(100vw, calc(100dvh * 256 / 288));
    height: min(100dvh, calc(100vw * 288 / 256));
  }
  /* On touch devices, reserve the bottom slice for the d-pad/jump */
  body.mobile #wrap {
    inset: 0 0 30dvh 0;
  }
  body.mobile #game {
    width: min(100vw, calc(70dvh * 256 / 288));
    height: min(70dvh, calc(100vw * 288 / 256));
  }
  #title {
    position: fixed; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: #000;
    text-align: center; padding: 16px;
    z-index: 10;
  }
  #titleSammy {
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    width: min(92vmin, 420px);
    height: auto;
    aspect-ratio: 224 / 256;
    margin: 0 0 12px;
  }
  #title button {
    margin-top: 4px; padding: 14px 26px;
    background: #ffcf00; color: #000; border: 3px solid #fff;
    font: bold 18px "Courier New", monospace; letter-spacing: 2px;
    cursor: pointer;
  }
  #title button:active { transform: translate(1px,1px); }
  .touch {
    position: fixed; bottom: 0; left: 0; right: 0;
    display: none; justify-content: space-between;
    padding: 14px; pointer-events: none;
  }
  .pad {
    display: grid;
    --c: clamp(52px, 18vw, 78px);
    grid-template-columns: var(--c) var(--c) var(--c);
    grid-template-rows: var(--c) var(--c) var(--c);
    gap: 4px;
  }
  .btn {
    pointer-events: auto;
    background: rgba(255,255,255,0.10);
    border: 2px solid rgba(255,255,255,0.55);
    color: #fff; font: bold 28px "Courier New", monospace;
    display: flex; align-items: center; justify-content: center;
    border-radius: 10px;
    -webkit-user-select: none; user-select: none;
  }
  .btn.active { background: rgba(255,207,0,0.3); border-color: #ffcf00; }
  .jump {
    width: clamp(88px, 28vw, 130px);
    height: clamp(88px, 28vw, 130px);
    align-self: end; font-size: 22px;
    background: rgba(255,207,0,0.15);
    border-color: rgba(255,207,0,0.7);
  }
  body.mobile .touch { display: flex; }
  body.mobile #title button { padding: 18px 32px; font-size: 20px; }
  #muteBtn {
    position: fixed; top: 10px; right: 10px;
    z-index: 11;
    width: 38px; height: 38px;
    background: rgba(0,0,0,0.55);
    border: 2px solid rgba(255,255,255,0.55);
    color: #ffcf00;
    font: bold 18px "Courier New", monospace;
    border-radius: 8px;
    cursor: pointer;
    -webkit-user-select: none; user-select: none;
  }
  #muteBtn:active { transform: translate(1px,1px); }
  #muteBtn.muted { color: #888; border-color: rgba(255,255,255,0.25); }
</style>
</head>
<body>
<div id="wrap"><canvas id="game" width="256" height="288"></canvas></div>

<div id="title">
  <canvas id="titleSammy" width="224" height="256"></canvas>
  <button id="startBtn">START</button>
</div>

<button id="muteBtn" title="Mute (M)" aria-label="Toggle music">&#9835;</button>

<div class="touch" id="touch">
  <div class="pad">
    <div></div>
    <div class="btn" data-key="up">&#9650;</div>
    <div></div>
    <div class="btn" data-key="left">&#9664;</div>
    <div></div>
    <div class="btn" data-key="right">&#9654;</div>
    <div></div>
    <div class="btn" data-key="down">&#9660;</div>
    <div></div>
  </div>
  <div style="display:flex;align-items:flex-end;">
    <div class="btn jump" data-key="jump">JUMP</div>
  </div>
</div>

<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  ctx.imageSmoothingEnabled = false;
  const W = canvas.width, H = canvas.height;

  if (matchMedia('(pointer: coarse)').matches || 'ontouchstart' in window) {
    document.body.classList.add('mobile');
  }

  // ---- Input ----
  const keys = { left:false, right:false, up:false, down:false, jump:false };
  const keyMap = {
    ArrowLeft:'left', KeyA:'left',
    ArrowRight:'right', KeyD:'right',
    ArrowUp:'up', KeyW:'up',
    ArrowDown:'down', KeyS:'down',
    Space:'jump', KeyJ:'jump', KeyZ:'jump',
  };
  addEventListener('keydown', e => {
    const k = keyMap[e.code]; if (!k) return;
    keys[k] = true; e.preventDefault();
  });
  addEventListener('keyup', e => {
    const k = keyMap[e.code]; if (!k) return;
    keys[k] = false; e.preventDefault();
  });
  document.querySelectorAll('.btn').forEach(btn => {
    const k = btn.dataset.key;
    const press = e => { keys[k] = true; btn.classList.add('active'); e.preventDefault(); };
    const release = e => { keys[k] = false; btn.classList.remove('active'); e.preventDefault(); };
    btn.addEventListener('touchstart', press, {passive:false});
    btn.addEventListener('touchend', release, {passive:false});
    btn.addEventListener('touchcancel', release, {passive:false});
    btn.addEventListener('mousedown', press);
    btn.addEventListener('mouseup', release);
    btn.addEventListener('mouseleave', release);
  });

  // ---- Level data ----
  const GIRDER_H = 6;
  const LADDER_W = 12;

  const LEVELS = [
    { // 1: GIRDERS — classic tower, slow cigars
      name: 'GIRDERS',
      floors: [
        { y: 264, x0: 0,   x1: 256 },
        { y: 224, x0: 16,  x1: 256 },
        { y: 184, x0: 0,   x1: 240 },
        { y: 144, x0: 16,  x1: 256 },
        { y: 104, x0: 0,   x1: 240 },
        { y: 64,  x0: 16,  x1: 200 },
      ],
      ladders: [
        { x: 220, top: 224, bot: 264 },
        { x: 40,  top: 184, bot: 224 },
        { x: 200, top: 144, bot: 184 },
        { x: 60,  top: 104, bot: 144 },
        { x: 180, top: 64,  bot: 104 },
      ],
      sammy:       { x: 50,  y: 64 },
      trophy:      { x: 180, y: 52 },
      drum:        { x: 24,  y: 264, lit: false },
      playerStart: { x: 230, floorY: 264 },
      cigarSpeed: 0.9, ladderProb: 0.32, barrelMul: 1.5,
    },
    { // 2: CATWALK — split middle floors with center gaps
      name: 'CATWALK',
      floors: [
        { y: 264, x0: 0,   x1: 256 },
        { y: 224, x0: 0,   x1: 96 },
        { y: 224, x0: 160, x1: 256 },
        { y: 184, x0: 32,  x1: 224 },
        { y: 144, x0: 0,   x1: 96 },
        { y: 144, x0: 160, x1: 256 },
        { y: 104, x0: 32,  x1: 224 },
        { y: 64,  x0: 80,  x1: 176 },
      ],
      ladders: [
        { x: 60,  top: 224, bot: 264 },
        { x: 200, top: 224, bot: 264 },
        { x: 56,  top: 184, bot: 224 },
        { x: 200, top: 184, bot: 224 },
        { x: 80,  top: 144, bot: 184 },
        { x: 180, top: 144, bot: 184 },
        { x: 56,  top: 104, bot: 144 },
        { x: 200, top: 104, bot: 144 },
        { x: 128, top: 64,  bot: 104 },
      ],
      sammy:       { x: 100, y: 64 },
      trophy:      { x: 160, y: 52 },
      drum:        { x: 24,  y: 264, lit: false },
      playerStart: { x: 30,  floorY: 264 },
      cigarSpeed: 1.3, ladderProb: 0.32, barrelMul: 1.0,
    },
    { // 3: STACKS — taller, narrower spacing, more floors
      name: 'STACKS',
      floors: [
        { y: 268, x0: 0,   x1: 256 },
        { y: 236, x0: 16,  x1: 256 },
        { y: 204, x0: 0,   x1: 240 },
        { y: 172, x0: 16,  x1: 256 },
        { y: 140, x0: 0,   x1: 240 },
        { y: 108, x0: 16,  x1: 256 },
        { y: 76,  x0: 0,   x1: 240 },
        { y: 44,  x0: 32,  x1: 220 },
      ],
      ladders: [
        { x: 220, top: 236, bot: 268 },
        { x: 40,  top: 204, bot: 236 },
        { x: 200, top: 172, bot: 204 },
        { x: 60,  top: 140, bot: 172 },
        { x: 200, top: 108, bot: 140 },
        { x: 60,  top: 76,  bot: 108 },
        { x: 180, top: 44,  bot: 76 },
      ],
      sammy:       { x: 60,  y: 44 },
      trophy:      { x: 200, y: 32 },
      drum:        { x: 24,  y: 268, lit: false },
      playerStart: { x: 230, floorY: 268 },
      cigarSpeed: 1.4, ladderProb: 0.4, barrelMul: 0.95,
    },
    { // 4: FOUNDRY — drum lit from start, more fireballs
      name: 'FOUNDRY',
      floors: [
        { y: 268, x0: 0,   x1: 256 },
        { y: 218, x0: 32,  x1: 224 },
        { y: 168, x0: 0,   x1: 256 },
        { y: 118, x0: 32,  x1: 224 },
        { y: 68,  x0: 64,  x1: 192 },
      ],
      ladders: [
        { x: 200, top: 218, bot: 268 },
        { x: 56,  top: 168, bot: 218 },
        { x: 200, top: 118, bot: 168 },
        { x: 80,  top: 68,  bot: 118 },
      ],
      sammy:       { x: 96,  y: 68 },
      trophy:      { x: 168, y: 56 },
      drum:        { x: 24,  y: 268, lit: true },
      playerStart: { x: 230, floorY: 268 },
      cigarSpeed: 1.5, ladderProb: 0.5, barrelMul: 0.85,
    },
    { // 5: SHOWDOWN — small arena, double ladders, fast cigars
      name: 'SHOWDOWN',
      floors: [
        { y: 268, x0: 0,   x1: 256 },
        { y: 200, x0: 16,  x1: 240 },
        { y: 132, x0: 0,   x1: 256 },
        { y: 64,  x0: 64,  x1: 192 },
      ],
      ladders: [
        { x: 32,  top: 200, bot: 268 },
        { x: 224, top: 200, bot: 268 },
        { x: 32,  top: 132, bot: 200 },
        { x: 224, top: 132, bot: 200 },
        { x: 80,  top: 64,  bot: 132 },
        { x: 176, top: 64,  bot: 132 },
      ],
      sammy:       { x: 96,  y: 64 },
      trophy:      { x: 160, y: 52 },
      drum:        { x: 24,  y: 268, lit: true },
      playerStart: { x: 128, floorY: 268 },
      cigarSpeed: 1.6, ladderProb: 0.5, barrelMul: 0.7,
    },
  ];

  let floors, ladders, sammy, trophy, oilDrum;
  let topFloorY, groundFloorY, sammyFloor;
  let playerSpawnX, playerSpawnY;
  let cigarSpeed = 1.0, ladderProb = 0.32, barrelMul = 1.0;
  let level = 1;
  let levelIntroT = 0;

  function loadLevel(n) {
    const lvl = LEVELS[Math.max(0, Math.min(LEVELS.length, n) - 1)];
    floors  = lvl.floors.map(f => ({ ...f }));
    ladders = lvl.ladders.map(l => ({ ...l }));
    sammy   = { x: lvl.sammy.x,  y: lvl.sammy.y, throwT: 0 };
    trophy  = { x: lvl.trophy.x, y: lvl.trophy.y };
    oilDrum = { x: lvl.drum.x,   y: lvl.drum.y, lit: lvl.drum.lit, flameT: lvl.drum.lit ? 30 : 0 };
    cigarSpeed = lvl.cigarSpeed;
    ladderProb = lvl.ladderProb;
    barrelMul  = lvl.barrelMul;
    topFloorY    = Math.min(...floors.map(f => f.y));
    groundFloorY = Math.max(...floors.map(f => f.y));
    sammyFloor = floors.find(f => f.y === sammy.y && sammy.x >= f.x0 && sammy.x <= f.x1)
                || floors.find(f => f.y === sammy.y);
    playerSpawnX = lvl.playerStart.x;
    playerSpawnY = lvl.playerStart.floorY - 14;
    levelIntroT = 90;
  }

  loadLevel(1);

  // ---- Player ----
  const player = {
    x: playerSpawnX, y: playerSpawnY,
    w: 10, h: 14,
    vx: 0, vy: 0,
    onGround: true,
    onLadder: false,
    facing: -1,
    alive: true,
    win: false,
    walkT: 0,
    smashT: 0,  // shaka power-up timer
    coffeeT: 0, // coffee cup power-up timer (speed + jump)
    iframes: 0,
  };

  const GRAVITY = 0.35;
  const MOVE_SPEED = 1.1;
  const CLIMB_SPEED = 0.9;
  const JUMP_V = -4.6;

  // ---- Entities ----
  const barrels = [];
  const fireballs = [];
  const pickups = [];

  let barrelTimer = 90;
  let pickupTimer = 60 * 12; // first pickup ~12s
  let fireballTimer = 60 * 8;
  let gameShakaTimer = 0;
  let titleShakaTimer = 0;
  let levelTime = 0;
  let score = 0;
  let lives = 3;
  let state = 'title';

  function difficulty() { return Math.min(10, Math.floor(levelTime / 600)); }
  function barrelInterval() { return Math.max(64, 157 - difficulty() * 10) * barrelMul; }

  function reset(full=false) {
    if (full) { score = 0; lives = 3; level = 1; }
    loadLevel(level);
    player.x = playerSpawnX; player.y = playerSpawnY;
    player.vx = 0; player.vy = 0;
    player.onGround = true; player.onLadder = false; player.ladder = null;
    player.alive = true; player.win = false;
    player.smashT = 0; player.coffeeT = 0; player.iframes = 30;
    player.facing = -1;
    barrels.length = 0;
    fireballs.length = 0;
    pickups.length = 0;
    gameShakas.length = 0;
    barrelTimer = 60;
    pickupTimer = 60 * 12;
    fireballTimer = 60 * 8;
    levelTime = 0;
  }

  // ---- Procedural chiptune (square + triangle, looping 8 bars) ----
  const MUSIC = {
    ctx: null, master: null,
    on: false, muted: false,
    nextTime: 0, step: 0, timer: null,
    vol: 0.10,
  };
  const TEMPO = 138;
  const STEP = 60 / TEMPO / 2; // eighth-note seconds

  function nf(name) {
    if (!name || name === '_') return 0;
    const m = { C:0, D:2, E:4, F:5, G:7, A:9, B:11 };
    let i = 1, semi = m[name[0]];
    if (name[i] === '#') { semi += 1; i++; }
    else if (name[i] === 'b') { semi -= 1; i++; }
    const oct = parseInt(name.slice(i));
    const midi = (oct + 1) * 12 + semi;
    return 440 * Math.pow(2, (midi - 69) / 12);
  }

  // 8-bar loop in C major: C — G — Am — F — F — G — Am — Em
  const MELODY = [
    'C5','E5','G5','E5','C5','E5','G5','E5',
    'B4','D5','G5','D5','B4','D5','G5','D5',
    'A4','C5','E5','C5','A4','C5','E5','C5',
    'F4','A4','C5','A4','F4','A4','C5','A4',
    'F4','A4','C5','A4','F4','A4','C5','A4',
    'B4','D5','G5','D5','B4','D5','G5','D5',
    'A4','C5','E5','C5','A4','C5','E5','C5',
    'G4','B4','E5','B4','G4','B4','E5','B4',
  ];
  const BASS = [
    'C3','_','_','_','G3','_','_','_',
    'G2','_','_','_','D3','_','_','_',
    'A2','_','_','_','E3','_','_','_',
    'F2','_','_','_','C3','_','_','_',
    'F2','_','_','_','C3','_','_','_',
    'G2','_','_','_','D3','_','_','_',
    'A2','_','_','_','E3','_','_','_',
    'E2','_','_','_','B2','_','_','_',
  ];

  function initMusic() {
    if (MUSIC.ctx) return;
    try {
      const Ctx = window.AudioContext || window.webkitAudioContext;
      MUSIC.ctx = new Ctx();
      MUSIC.master = MUSIC.ctx.createGain();
      MUSIC.master.gain.value = 0;
      MUSIC.master.connect(MUSIC.ctx.destination);
    } catch (e) { MUSIC.ctx = null; }
  }
  function setMusicVol(v) {
    if (!MUSIC.ctx) return;
    MUSIC.master.gain.cancelScheduledValues(MUSIC.ctx.currentTime);
    MUSIC.master.gain.linearRampToValueAtTime(v, MUSIC.ctx.currentTime + 0.05);
  }
  function blip(freq, dur, type, when, vol) {
    if (!freq || !MUSIC.ctx) return;
    const osc = MUSIC.ctx.createOscillator();
    const env = MUSIC.ctx.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    env.gain.setValueAtTime(0, when);
    env.gain.linearRampToValueAtTime(vol, when + 0.005);
    env.gain.linearRampToValueAtTime(vol * 0.5, when + dur * 0.5);
    env.gain.linearRampToValueAtTime(0, when + dur * 0.97);
    osc.connect(env);
    env.connect(MUSIC.master);
    osc.start(when);
    osc.stop(when + dur);
  }
  function scheduleMusic() {
    if (!MUSIC.on || !MUSIC.ctx) return;
    const now = MUSIC.ctx.currentTime;
    if (MUSIC.nextTime < now - 0.5) MUSIC.nextTime = now + 0.05;
    while (MUSIC.nextTime < now + 0.25) {
      const i = MUSIC.step % MELODY.length;
      blip(nf(MELODY[i]), STEP * 0.92, 'square',   MUSIC.nextTime, 0.18);
      blip(nf(BASS[i]),    STEP * 0.92, 'triangle', MUSIC.nextTime, 0.22);
      MUSIC.nextTime += STEP;
      MUSIC.step++;
    }
    MUSIC.timer = setTimeout(scheduleMusic, 60);
  }
  function startMusic() {
    initMusic();
    if (!MUSIC.ctx) return;
    if (MUSIC.ctx.state === 'suspended') MUSIC.ctx.resume();
    setMusicVol(MUSIC.muted ? 0 : MUSIC.vol);
    if (MUSIC.on) return;
    MUSIC.on = true;
    MUSIC.step = 0;
    MUSIC.nextTime = MUSIC.ctx.currentTime + 0.05;
    scheduleMusic();
  }
  function toggleMute() {
    MUSIC.muted = !MUSIC.muted;
    setMusicVol(MUSIC.muted ? 0 : MUSIC.vol);
    const btn = document.getElementById('muteBtn');
    if (btn) {
      btn.innerHTML = MUSIC.muted ? '&#128263;' : '&#9835;';
      btn.classList.toggle('muted', MUSIC.muted);
    }
  }
  document.getElementById('muteBtn').addEventListener('click', e => {
    toggleMute(); e.preventDefault();
  });
  addEventListener('keydown', e => {
    if (e.code === 'KeyM') { toggleMute(); e.preventDefault(); }
  });

  function start() {
    reset(true);
    state = 'play';
    document.getElementById('title').style.display = 'none';
    titleMode = 'main';
    document.getElementById('startBtn').textContent = 'START';
    startMusic();
  }
  document.getElementById('startBtn').addEventListener('click', start);

  // ---- Helpers ----
  function floorAt(x, y) {
    for (const f of floors) {
      if (Math.abs(y - f.y) < 1.5 && x >= f.x0 - 2 && x <= f.x1 + 2) return f;
    }
    return null;
  }
  function floorBelow(x, y) {
    let best = null;
    for (const f of floors) {
      if (f.y >= y && x >= f.x0 && x <= f.x1) {
        if (!best || f.y < best.y) best = f;
      }
    }
    return best;
  }
  function ladderAt(x, y) {
    for (const l of ladders) {
      if (Math.abs(x - l.x) <= LADDER_W/2 && y >= l.top - 4 && y <= l.bot + 4) return l;
    }
    return null;
  }

  // ---- Barrels ----
  function spawnBarrel() {
    barrels.push({
      x: sammy.x + 12, y: topFloorY - 4,
      vx: cigarSpeed, vy: 0,
      onFloor: sammyFloor,
      rot: 0,
    });
    // Occasionally spawn a second barrel after a delay (high difficulty)
    if (difficulty() >= 4 && Math.random() < 0.21) {
      setTimeout(() => {
        if (state === 'play') {
          barrels.push({
            x: sammy.x + 12, y: topFloorY - 4,
            vx: cigarSpeed, vy: 0, onFloor: sammyFloor, rot: 0,
          });
        }
      }, 500);
    }
  }

  function updateBarrel(b) {
    if (b.onFloor) {
      b.x += b.vx;
      if (b.vx > 0 && b.x > b.onFloor.x1 - 4) {
        b.onFloor = null;
      } else if (b.vx < 0 && b.x < b.onFloor.x0 + 4) {
        b.onFloor = null;
      } else {
        for (const l of ladders) {
          if (l.top === b.onFloor.y && Math.abs(b.x - l.x) < 1.8 && Math.random() < ladderProb) {
            b.onFloor = null;
            b.descendingLadder = l;
            b.vx = 0;
            break;
          }
        }
      }
    } else if (b.descendingLadder) {
      b.y += 1.8;
      b.x = b.descendingLadder.x;
      if (b.y >= b.descendingLadder.bot - 4) {
        // Pick a floor at the ladder's bottom that contains the ladder x
        const f = floors.find(f => f.y === b.descendingLadder.bot
          && b.x >= f.x0 && b.x <= f.x1)
          || floors.find(f => f.y === b.descendingLadder.bot);
        b.onFloor = f;
        b.y = f.y - 4;
        b.vx = (Math.random() < 0.5 ? -1 : 1) * cigarSpeed;
        b.descendingLadder = null;
      }
    } else {
      b.vy += GRAVITY;
      b.y += b.vy;
      const f = floorBelow(b.x, b.y);
      if (f && b.y >= f.y - 4) {
        b.onFloor = f;
        b.y = f.y - 4;
        b.vy = 0;
        // Keep rolling the same direction so barrels cascade off the
        // stack instead of zigzagging back and forth on each platform.
        if (b.vx === 0) b.vx = (b.x < W/2 ? 1 : -1) * cigarSpeed;
        else b.vx = Math.sign(b.vx) * cigarSpeed;
      }
    }
    b.rot += b.vx * 0.2;

    // Hit oil drum on bottom floor — light it & destroy barrel, maybe spawn fireball
    if (b.onFloor && b.onFloor.y === groundFloorY && Math.abs(b.x - oilDrum.x) < 7) {
      b.dead = true;
      oilDrum.lit = true;
      oilDrum.flameT = 30;
      if (Math.random() < 0.45 && fireballs.length < 3) spawnFireball();
    }

    if (b.y > H + 20) b.dead = true;
  }

  // ---- Fireballs ----
  function spawnFireball() {
    fireballs.push({
      x: oilDrum.x, y: groundFloorY - 6,
      vx: (Math.random() < 0.5 ? -0.55 : 0.55),
      onFloor: floors.find(f => f.y === groundFloorY && oilDrum.x >= f.x0 && oilDrum.x <= f.x1) || floors[0],
      climbing: null,
      flick: 0,
    });
  }

  function updateFireball(fb) {
    fb.flick = (fb.flick + 1) % 8;
    if (fb.climbing) {
      const l = fb.climbing;
      fb.y += fb.climbDir * 0.5;
      fb.x = l.x;
      if (fb.climbDir < 0 && fb.y <= l.top - 2) {
        // reached top
        const f = floors.find(f => f.y === l.top);
        fb.onFloor = f; fb.y = f.y - 6;
        fb.climbing = null;
        fb.vx = (Math.random() < 0.5 ? -0.55 : 0.55);
      } else if (fb.climbDir > 0 && fb.y >= l.bot - 6) {
        const f = floors.find(f => f.y === l.bot);
        fb.onFloor = f; fb.y = f.y - 6;
        fb.climbing = null;
        fb.vx = (Math.random() < 0.5 ? -0.55 : 0.55);
      }
      return;
    }
    if (!fb.onFloor) return;
    fb.x += fb.vx;
    // Turn around at edges
    if (fb.x < fb.onFloor.x0 + 3) { fb.x = fb.onFloor.x0 + 3; fb.vx = Math.abs(fb.vx); }
    if (fb.x > fb.onFloor.x1 - 3) { fb.x = fb.onFloor.x1 - 3; fb.vx = -Math.abs(fb.vx); }
    // Random ladder use
    for (const l of ladders) {
      if ((l.top === fb.onFloor.y || l.bot === fb.onFloor.y) &&
          Math.abs(fb.x - l.x) < 1.5 && Math.random() < 0.012) {
        fb.climbing = l;
        fb.climbDir = (l.bot === fb.onFloor.y) ? -1 : 1;
        fb.x = l.x;
        break;
      }
    }
  }

  // ---- Pickups (power-ups) ----
  function spawnPickup() {
    // Place on a random non-top, non-bottom floor that's wide enough
    const candidates = floors.filter(f =>
      f.y !== groundFloorY && f.y !== topFloorY && (f.x1 - f.x0) >= 50);
    if (!candidates.length) return;
    const f = candidates[Math.floor(Math.random() * candidates.length)];
    const x = f.x0 + 20 + Math.random() * (f.x1 - f.x0 - 40);
    const type = Math.random() < 0.55 ? 'shaka' : 'coffee';
    pickups.push({ x, y: f.y - 8, t: 0, type });
  }
  function updatePickup(p) {
    p.t++;
    p.bob = Math.sin(p.t * 0.12) * 1.5;
  }

  // ---- Player update ----
  function updatePlayer() {
    if (!player.alive || player.win) return;
    if (player.iframes > 0) player.iframes--;
    if (player.smashT > 0) player.smashT--;
    if (player.coffeeT > 0) player.coffeeT--;

    const cx = player.x + player.w/2;
    const feetY = player.y + player.h;

    const lFeet = ladderAt(cx, feetY);
    const lMid  = ladderAt(cx, player.y + player.h/2);
    const lAny  = lFeet || lMid;

    if (!player.onLadder) {
      if (lAny && (keys.up && lAny.bot - feetY > -2 && feetY - lAny.top > -2)) {
        player.onLadder = true;
        player.ladder = lAny;
        player.x = lAny.x - player.w/2;
        player.vy = 0;
      } else if (lAny && keys.down && player.onGround) {
        const floor = floorAt(cx, feetY);
        if (floor && floor.y === lAny.top) {
          player.onLadder = true;
          player.ladder = lAny;
          player.x = lAny.x - player.w/2;
          player.y += 2;
          player.vy = 0;
        }
      }
    }

    if (player.onLadder) {
      const l = player.ladder;
      player.vx = 0; player.vy = 0;
      const climb = player.coffeeT > 0 ? CLIMB_SPEED * 1.5 : CLIMB_SPEED;
      if (keys.up) player.y -= climb;
      else if (keys.down) player.y += climb;
      // Auto-dismount onto upper floor as soon as feet reach its top
      if (player.y + player.h <= l.top) {
        player.onLadder = false;
        player.ladder = null;
        player.y = l.top - player.h;
        player.onGround = true;
      } else if (player.y + player.h >= l.bot) {
        player.onLadder = false;
        player.ladder = null;
        player.y = l.bot - player.h;
        player.onGround = true;
      } else if ((keys.left || keys.right) && Math.abs((player.y + player.h) - l.top) < 3) {
        // Step off sideways near the top
        player.onLadder = false;
        player.ladder = null;
        player.y = l.top - player.h;
        player.onGround = true;
      }
    }

    if (!player.onLadder) {
      const speed = player.coffeeT > 0 ? MOVE_SPEED * 1.6 : MOVE_SPEED;
      const jumpV = player.coffeeT > 0 ? JUMP_V * 1.22 : JUMP_V;
      player.vx = 0;
      if (keys.left)  { player.vx = -speed; player.facing = -1; }
      if (keys.right) { player.vx =  speed; player.facing =  1; }
      player.x += player.vx;
      if (player.vx !== 0 && player.onGround) player.walkT += 0.2;

      if (keys.jump && player.onGround) {
        player.vy = jumpV;
        player.onGround = false;
        keys.jump = false;
      }

      player.vy += GRAVITY;
      if (player.vy > 6) player.vy = 6;
      const prevFeet = player.y + player.h;
      player.y += player.vy;
      const newFeet = player.y + player.h;

      player.onGround = false;
      if (player.vy >= 0) {
        for (const f of floors) {
          if (cx >= f.x0 && cx <= f.x1 && prevFeet <= f.y + 0.5 && newFeet >= f.y) {
            player.y = f.y - player.h;
            player.vy = 0;
            player.onGround = true;
            break;
          }
        }
      }

      if (player.x < 0) player.x = 0;
      if (player.x + player.w > W) player.x = W - player.w;
    }

    // Trophy collision
    if (Math.abs((player.x + player.w/2) - trophy.x) < 8 &&
        Math.abs((player.y + player.h/2) - trophy.y) < 10) {
      player.win = true;
      state = 'win';
      score += 1000;
    }

    // Pickup collision
    for (const p of pickups) {
      if (p.dead) continue;
      const dx = (player.x + player.w/2) - p.x;
      const dy = (player.y + player.h/2) - p.y;
      if (Math.abs(dx) < 8 && Math.abs(dy) < 9) {
        p.dead = true;
        if (p.type === 'coffee') {
          score += 250;
          player.coffeeT = 360;
        } else {
          score += 500;
          player.smashT = 360;
        }
      }
    }

    // Barrel collision
    for (const b of barrels) {
      if (b.dead) continue;
      const dx = (player.x + player.w/2) - b.x;
      const dy = (player.y + player.h/2) - b.y;
      if (Math.abs(dx) < 7 && Math.abs(dy) < 8) {
        if (player.smashT > 0) {
          b.dead = true;
          score += 200;
        } else if (player.iframes <= 0) {
          player.alive = false;
          state = 'dead';
        }
      } else if (!b.scored && b.onFloor && Math.abs(dy) > 6 && Math.abs(dy) < 14 &&
                 Math.abs(dx) < 10 && !player.onGround) {
        b.scored = true;
        score += 100;
      }
    }

    // Fireball collision
    for (const fb of fireballs) {
      const dx = (player.x + player.w/2) - fb.x;
      const dy = (player.y + player.h/2) - fb.y;
      if (Math.abs(dx) < 6 && Math.abs(dy) < 8) {
        if (player.smashT > 0) {
          fb.dead = true;
          score += 300;
        } else if (player.iframes <= 0) {
          player.alive = false;
          state = 'dead';
        }
      }
    }
  }

  // ---- Drawing ----

  // Procedural Sammy: receded silver hair + matching white goatee/mustache,
  // faint silver glasses, big crinkled smile with teeth, navy suit with
  // notched lapels, blue dress shirt and medium-blue tie.
  // Optional shaka pose with arms raised.
  // (cx, footY) places his feet on a girder.

  // ---- Shaka particle system (always-on emoji popping around Sammy) ----
  const gameShakas = [];
  const titleShakas = [];

  function drawShakaEmoji(g, x, y, size, flip) {
    g.font = (size | 0) + 'px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
    g.textAlign = 'center';
    g.textBaseline = 'middle';
    if (flip) {
      g.save();
      g.translate(x | 0, y | 0);
      g.scale(-1, 1);
      g.fillText('🤙', 0, 0);
      g.restore();
    } else {
      g.fillText('🤙', x | 0, y | 0);
    }
    g.textAlign = 'left';
    g.textBaseline = 'alphabetic';
  }

  function spawnShaka(arr, cx, cy, range) {
    const angle = Math.random() * Math.PI * 2;
    const r = range * (0.4 + Math.random() * 0.7);
    arr.push({
      x: cx + Math.cos(angle) * r,
      y: cy + Math.sin(angle) * r,
      vx: (Math.random() - 0.5) * 0.4,
      vy: -0.4 - Math.random() * 0.6,
      life: 50 + ((Math.random() * 30) | 0),
      age: 0,
      flip: Math.random() < 0.5,
      size: 11 + ((Math.random() * 6) | 0),
      wobble: Math.random() * Math.PI * 2,
    });
  }

  function updateShakas(arr) {
    for (const p of arr) {
      p.age++;
      p.wobble += 0.18;
      p.x += p.vx + Math.sin(p.wobble) * 0.25;
      p.y += p.vy;
      if (p.age >= p.life) p.dead = true;
    }
    for (let i = arr.length - 1; i >= 0; i--) if (arr[i].dead) arr.splice(i, 1);
  }

  function drawShakas(g, arr) {
    for (const p of arr) {
      const a = 1 - p.age / p.life;
      g.globalAlpha = Math.max(0, Math.min(1, a < 0.2 ? a / 0.2 : 1));
      drawShakaEmoji(g, p.x, p.y, p.size, p.flip);
    }
    g.globalAlpha = 1;
  }

  function drawSammy(g, cx, footY, throwing) {
    const headW = 16, headH = 16;
    const bodyH = 14;
    const top = footY - bodyH - headH;
    const fx = cx - headW/2;
    const fy = top + 2;

    const SKIN        = '#e8b48a';
    const SKIN_SHADE  = '#b87f4f';
    const SKIN_HI     = '#f0c89a';
    const HAIR        = '#f5f5f5';
    const HAIR_SHADE  = '#c8c8c8';
    const TEETH       = '#fff5dc';
    const MOUTH       = '#3a1818';
    const SUIT        = '#0e1f33';
    const SUIT_HL     = '#1f4476';
    const SUIT_DK     = '#050d18';
    const SHIRT       = '#7ab3e0';
    const TIE         = '#2e6cb8';
    const TIE_HL      = '#5fa8e8';
    const TIE_DK      = '#1a3f7a';
    const FRAME       = '#9ea4ad';

    // ---- Face skin (slightly oval) ----
    g.fillStyle = SKIN;
    g.fillRect(fx + 1, fy, headW - 2, headH);     // main face
    g.fillRect(fx,     fy + 3, headW, headH - 6); // cheek widen
    g.fillRect(fx + 3, fy + headH, headW - 6, 1); // chin under

    // ---- Hair (receded: full crown, side temples, forehead skin shows) ----
    // Crown (above forehead)
    g.fillStyle = HAIR_SHADE;
    g.fillRect(fx + 1, fy - 3, headW - 2, 1);
    g.fillRect(fx,     fy - 2, headW,     1);
    g.fillStyle = HAIR;
    g.fillRect(fx + 2, fy - 4, headW - 4, 1);
    g.fillRect(fx + 1, fy - 3, headW - 2, 1);
    g.fillRect(fx + 1, fy - 1, headW - 2, 1);
    // Receded hairline: hair only at corners on row fy, skin between
    g.fillRect(fx + 1, fy,     2, 1);
    g.fillRect(fx + headW-3, fy, 2, 1);
    // Hair sides (temples down past brow)
    g.fillStyle = HAIR;
    g.fillRect(fx,     fy,     1, 4);
    g.fillRect(fx + headW-1, fy, 1, 4);
    g.fillStyle = HAIR_SHADE;
    g.fillRect(fx - 1, fy + 1, 1, 3);
    g.fillRect(fx + headW, fy + 1, 1, 3);

    // Subtle hairline shadow on forehead
    g.fillStyle = SKIN_SHADE;
    g.fillRect(fx + 4, fy + 1, headW - 8, 1);

    // ---- Ears (tiny) ----
    g.fillStyle = SKIN_SHADE;
    g.fillRect(fx - 1, fy + 7, 1, 3);
    g.fillRect(fx + headW, fy + 7, 1, 3);

    // ---- Glasses (thin silver, barely visible) ----
    g.fillStyle = FRAME;
    // left lens
    g.fillRect(fx + 2, fy + 5, 5, 1);
    g.fillRect(fx + 2, fy + 8, 5, 1);
    g.fillRect(fx + 2, fy + 6, 1, 2);
    g.fillRect(fx + 6, fy + 6, 1, 2);
    // right lens
    g.fillRect(fx + 9, fy + 5, 5, 1);
    g.fillRect(fx + 9, fy + 8, 5, 1);
    g.fillRect(fx + 9, fy + 6, 1, 2);
    g.fillRect(fx + 13, fy + 6, 1, 2);
    // bridge & temple arms
    g.fillRect(fx + 7, fy + 6, 2, 1);
    g.fillRect(fx + 1, fy + 6, 1, 1);
    g.fillRect(fx + 14, fy + 6, 1, 1);
    // lens shine
    g.fillStyle = '#dde9f5';
    g.fillRect(fx + 3, fy + 6, 1, 1);
    g.fillRect(fx + 10, fy + 6, 1, 1);

    // ---- Eyes (smiling slits) + crinkles ----
    g.fillStyle = '#1a1a1a';
    g.fillRect(fx + 4, fy + 7, 2, 1);
    g.fillRect(fx + 11, fy + 7, 2, 1);
    // crow's-feet hints
    g.fillStyle = SKIN_SHADE;
    g.fillRect(fx + 1, fy + 7, 1, 1);
    g.fillRect(fx + headW - 2, fy + 7, 1, 1);

    // ---- Cheek highlights (raised from smile) ----
    g.fillStyle = SKIN_HI;
    g.fillRect(fx + 2, fy + 10, 2, 1);
    g.fillRect(fx + headW - 4, fy + 10, 2, 1);

    // ---- Nose ----
    g.fillStyle = SKIN_SHADE;
    g.fillRect(fx + 7, fy + 9, 2, 2);
    g.fillRect(fx + 8, fy + 11, 1, 1);

    // ---- Mustache (wide white, slight droop at outer corners) ----
    g.fillStyle = HAIR;
    g.fillRect(fx + 3, fy + 11, headW - 6, 1);
    g.fillRect(fx + 4, fy + 12, headW - 8, 1);

    // ---- Smile (full grin with visible teeth) ----
    g.fillStyle = MOUTH;
    g.fillRect(fx + 4, fy + 13, headW - 8, 2);
    g.fillStyle = TEETH;
    g.fillRect(fx + 5, fy + 13, headW - 10, 1);
    // smile corners curl up (dimples)
    g.fillStyle = MOUTH;
    g.fillRect(fx + 3, fy + 13, 1, 1);
    g.fillRect(fx + headW - 4, fy + 13, 1, 1);
    g.fillStyle = SKIN_SHADE;
    g.fillRect(fx + 2, fy + 12, 1, 1);
    g.fillRect(fx + headW - 3, fy + 12, 1, 1);

    // ---- Goatee (wider triangular, white) ----
    g.fillStyle = HAIR;
    g.fillRect(fx + 4, fy + 15, headW - 8, 1);
    g.fillRect(fx + 5, fy + 16, headW - 10, 1);
    g.fillRect(fx + 6, fy + 17, headW - 12, 1);

    // ---- Body — navy suit ----
    const bx = cx - 12, by = top + headH + 2;
    g.fillStyle = SUIT;
    g.fillRect(bx, by, 24, bodyH);
    // shoulder highlight
    g.fillStyle = SUIT_HL;
    g.fillRect(bx, by, 2, 5);
    g.fillRect(bx + 22, by, 2, 5);
    // bottom shadow
    g.fillStyle = SUIT_DK;
    g.fillRect(bx, by + bodyH - 2, 24, 2);

    // ---- Lapels (notched V) ----
    g.fillStyle = SUIT_DK;
    // left lapel inner edge
    g.fillRect(bx + 7, by, 1, 6);
    g.fillRect(bx + 8, by + 1, 1, 5);
    g.fillRect(bx + 9, by + 2, 1, 3);
    // right lapel inner edge
    g.fillRect(bx + 16, by, 1, 6);
    g.fillRect(bx + 15, by + 1, 1, 5);
    g.fillRect(bx + 14, by + 2, 1, 3);
    // lapel highlights
    g.fillStyle = SUIT_HL;
    g.fillRect(bx + 6, by + 1, 1, 4);
    g.fillRect(bx + 17, by + 1, 1, 4);

    // ---- Shirt collar (blue) ----
    g.fillStyle = SHIRT;
    g.fillRect(bx + 10, by, 4, 2);
    g.fillRect(bx + 11, by + 2, 2, 1);

    // ---- Bow tie (centered at bx + 12) ----
    const bowY = by + 3;
    // Left wing (tapered fat-out, narrow-in)
    g.fillStyle = TIE;
    g.fillRect(bx + 8,  bowY,     3, 1);  // top edge
    g.fillRect(bx + 7,  bowY + 1, 4, 2);  // middle (widest)
    g.fillRect(bx + 8,  bowY + 3, 3, 1);  // bottom edge
    // Right wing
    g.fillRect(bx + 13, bowY,     3, 1);
    g.fillRect(bx + 13, bowY + 1, 4, 2);
    g.fillRect(bx + 13, bowY + 3, 3, 1);
    // Knot (darker center, full height)
    g.fillStyle = TIE_DK;
    g.fillRect(bx + 11, bowY,     2, 4);
    // Wing highlights (top corners)
    g.fillStyle = TIE_HL;
    g.fillRect(bx + 8, bowY + 1, 1, 1);
    g.fillRect(bx + 15, bowY + 1, 1, 1);
    // Knot center notch
    g.fillRect(bx + 11, bowY + 1, 1, 1);

    // ---- Arms ----
    if (throwing) {
      // ===== Sleeves: chunky stair-step from shoulder up to wrist =====
      // LEFT arm
      g.fillStyle = SUIT;
      g.fillRect(bx - 1,  by - 2, 3, 5);   // shoulder cap
      g.fillRect(bx - 4,  by - 7, 4, 6);   // upper
      g.fillRect(bx - 6,  by - 13, 4, 6);  // mid
      g.fillRect(bx - 9,  by - 19, 4, 6);  // forearm to wrist
      g.fillStyle = SUIT_HL;
      g.fillRect(bx - 9,  by - 19, 1, 6);  // outer edge
      g.fillStyle = '#1a1a1a';
      g.fillRect(bx - 9,  by - 19, 4, 1);  // cuff line

      // RIGHT arm (mirror)
      g.fillStyle = SUIT;
      g.fillRect(bx + 22, by - 2, 3, 5);
      g.fillRect(bx + 24, by - 7, 4, 6);
      g.fillRect(bx + 26, by - 13, 4, 6);
      g.fillRect(bx + 29, by - 19, 4, 6);
      g.fillStyle = SUIT_HL;
      g.fillRect(bx + 32, by - 19, 1, 6);
      g.fillStyle = '#1a1a1a';
      g.fillRect(bx + 29, by - 19, 4, 1);

      // ===== LEFT shaka hand =====
      // 12 wide x 12 tall sprite. Pinky is a tall vertical bar on the
      // upper-right. Fist has a knuckle row with dimples between three
      // folded fingers. Thumb stair-steps down-left from the fist base.
      const lhx = bx - 14, lhy = by - 26;
      g.fillStyle = SKIN;
      // Pinky shaft (col 10, rows 0-3)
      g.fillRect(lhx + 10, lhy + 0, 1, 4);
      // Fist top + knuckle row (cols 4-9, rows 2-3)
      g.fillRect(lhx + 4, lhy + 2, 6, 1);
      g.fillRect(lhx + 4, lhy + 3, 6, 1);
      // Fist body — widest in the middle, tapering toward wrist
      g.fillRect(lhx + 3, lhy + 4, 8, 1);   // row 4
      g.fillRect(lhx + 2, lhy + 5, 9, 1);   // row 5
      g.fillRect(lhx + 2, lhy + 6, 9, 1);   // row 6
      g.fillRect(lhx + 3, lhy + 7, 7, 1);   // row 7 (wrist)
      // Knuckle dimples — three darker dots between the folded fingers
      g.fillStyle = SKIN_SHADE;
      g.fillRect(lhx + 5, lhy + 3, 1, 1);
      g.fillRect(lhx + 7, lhy + 3, 1, 1);
      g.fillRect(lhx + 9, lhy + 3, 1, 1);
      // Pinky tip highlight
      g.fillStyle = SKIN_HI;
      g.fillRect(lhx + 10, lhy + 0, 1, 1);
      // Thumb — diagonal stair-step DOWN-LEFT from bottom-left of fist
      g.fillStyle = SKIN;
      g.fillRect(lhx + 2, lhy + 8,  2, 1);
      g.fillRect(lhx + 1, lhy + 9,  2, 1);
      g.fillRect(lhx + 0, lhy + 10, 2, 1);
      g.fillRect(lhx + 0, lhy + 11, 1, 1);

      // ===== RIGHT shaka hand (mirrored within 12-wide sprite) =====
      const rhx = bx + 16, rhy = by - 26;
      g.fillStyle = SKIN;
      // Pinky shaft (col 1)
      g.fillRect(rhx + 1, rhy + 0, 1, 4);
      // Fist top + knuckle row (cols 2-7, rows 2-3)
      g.fillRect(rhx + 2, rhy + 2, 6, 1);
      g.fillRect(rhx + 2, rhy + 3, 6, 1);
      // Fist body
      g.fillRect(rhx + 1, rhy + 4, 8, 1);
      g.fillRect(rhx + 1, rhy + 5, 9, 1);
      g.fillRect(rhx + 1, rhy + 6, 9, 1);
      g.fillRect(rhx + 2, rhy + 7, 7, 1);
      // Knuckle dimples
      g.fillStyle = SKIN_SHADE;
      g.fillRect(rhx + 6, rhy + 3, 1, 1);
      g.fillRect(rhx + 4, rhy + 3, 1, 1);
      g.fillRect(rhx + 2, rhy + 3, 1, 1);
      // Pinky tip
      g.fillStyle = SKIN_HI;
      g.fillRect(rhx + 1, rhy + 0, 1, 1);
      // Thumb — diagonal stair-step DOWN-RIGHT
      g.fillStyle = SKIN;
      g.fillRect(rhx + 8,  rhy + 8,  2, 1);
      g.fillRect(rhx + 9,  rhy + 9,  2, 1);
      g.fillRect(rhx + 10, rhy + 10, 2, 1);
      g.fillRect(rhx + 11, rhy + 11, 1, 1);

      // Motion sparkles bracketing the raised hands
      g.fillStyle = '#ffcf00';
      const blink = ((sammy && sammy.throwT) || 0) % 12;
      if (blink < 6) {
        g.fillRect(bx - 17, by - 24, 1, 1);
        g.fillRect(bx + 30, by - 24, 1, 1);
        g.fillRect(bx - 11, by - 28, 1, 1);
        g.fillRect(bx + 26, by - 28, 1, 1);
      } else {
        g.fillRect(bx - 15, by - 27, 1, 1);
        g.fillRect(bx + 28, by - 27, 1, 1);
        g.fillRect(bx - 8,  by - 28, 1, 1);
        g.fillRect(bx + 24, by - 28, 1, 1);
      }
    } else {
      g.fillStyle = SUIT;
      g.fillRect(bx - 2, by + 2, 3, 8);
      g.fillRect(bx + 23, by + 2, 3, 8);
      g.fillStyle = SKIN;
      g.fillRect(bx - 2, by + 10, 3, 2);
      g.fillRect(bx + 23, by + 10, 3, 2);
    }

    // ---- Legs / shoes ----
    g.fillStyle = SUIT_DK;
    g.fillRect(bx + 6, by + bodyH, 4, 2);
    g.fillRect(bx + 14, by + bodyH, 4, 2);
    g.fillStyle = '#1a1a1a';
    g.fillRect(bx + 5, by + bodyH + 2, 5, 1);
    g.fillRect(bx + 14, by + bodyH + 2, 5, 1);
  }

  function drawSprite(sx, sy, grid, palette, scale=1, flip=false) {
    for (let r = 0; r < grid.length; r++) {
      const row = grid[r];
      for (let c = 0; c < row.length; c++) {
        const ch = row[c];
        if (ch === '.' || ch === ' ') continue;
        const col = palette[ch];
        if (!col) continue;
        const dx = flip ? (row.length - 1 - c) : c;
        ctx.fillStyle = col;
        ctx.fillRect((sx + dx*scale)|0, (sy + r*scale)|0, scale, scale);
      }
    }
  }

  const playerSprite = [
    "...HHHH...",
    "..HFFFFH..",
    ".HFEFFEFH.",
    ".HFFFFFFH.",
    "..HFFFFH..",
    "...MMMM...",
    "..MMSSMM..",
    ".MMSSSSMM.",
    ".MSSSSSSM.",
    ".MSSSSSSM.",
    ".PPP..PPP.",
    ".PPP..PPP.",
    "..PP..PP..",
    "..BB..BB..",
  ];
  const playerPalette = {
    H: '#3a1a05', F: '#e9c39a', E: '#101010',
    M: '#c41a1a', S: '#ffffff', P: '#1d4a8a', B: '#3a1a05',
  };

  function drawCigarBarrel(b) {
    ctx.save();
    ctx.translate(b.x|0, b.y|0);
    ctx.rotate(b.rot);
    ctx.fillStyle = '#6b3a1a';
    ctx.fillRect(-6, -3, 12, 6);
    ctx.fillStyle = '#8a4f24';
    ctx.fillRect(-6, -3, 12, 1);
    ctx.fillStyle = '#4a2510';
    ctx.fillRect(-6,  2, 12, 1);
    ctx.fillStyle = '#3a1a05';
    ctx.fillRect(-2, -3, 1, 6);
    ctx.fillRect(2, -3, 1, 6);
    ctx.fillStyle = '#ffae22';
    ctx.fillRect(5, -2, 1, 4);
    ctx.fillStyle = '#ff3500';
    ctx.fillRect(6, -1, 1, 2);
    ctx.fillStyle = '#bcbcbc';
    ctx.fillRect(-7, -2, 1, 4);
    ctx.restore();
  }

  function drawFireball(fb) {
    const x = fb.x|0, y = fb.y|0;
    const f = fb.flick;
    ctx.fillStyle = '#ff2200';
    ctx.fillRect(x-3, y-2, 6, 5);
    ctx.fillStyle = '#ff8800';
    ctx.fillRect(x-2, y-1, 4, 3);
    ctx.fillStyle = '#ffe060';
    ctx.fillRect(x-1, y, 2, 1);
    // flickering tongues
    ctx.fillStyle = '#ff5500';
    ctx.fillRect(x - 1, y - 4 + (f<4?0:1), 1, 2);
    ctx.fillRect(x + 1, y - 5 + (f<4?1:0), 1, 2);
    // little legs
    ctx.fillStyle = '#1a1a1a';
    ctx.fillRect(x - 2, y + 3, 1, 2);
    ctx.fillRect(x + 1, y + 3, 1, 2);
    // eyes
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(x - 1, y - 1, 1, 1);
    ctx.fillRect(x + 1, y - 1, 1, 1);
  }

  function drawTrophy(x, y) {
    ctx.fillStyle = '#ffcf00';
    ctx.fillRect(x-5, y, 10, 6);
    ctx.fillRect(x-6, y-1, 12, 2);
    ctx.fillRect(x-7, y+1, 1, 3);
    ctx.fillRect(x+6, y+1, 1, 3);
    ctx.fillRect(x-1, y+6, 2, 3);
    ctx.fillRect(x-4, y+9, 8, 2);
    ctx.fillStyle = '#fff7a0';
    ctx.fillRect(x-4, y+1, 2, 3);
    const s = (Math.sin(performance.now()/200) > 0) ? '#ffffff' : '#fff7a0';
    ctx.fillStyle = s;
    ctx.fillRect(x+2, y-2, 1, 1);
  }

  function drawOilDrum(d) {
    const x = d.x|0, y = d.y|0;
    // Drum body
    ctx.fillStyle = '#1d4ea0';
    ctx.fillRect(x-6, y-12, 12, 12);
    ctx.fillStyle = '#2e6fd0';
    ctx.fillRect(x-6, y-12, 1, 12);
    ctx.fillStyle = '#0e2a5a';
    ctx.fillRect(x+5, y-12, 1, 12);
    // Bands
    ctx.fillStyle = '#ffd84a';
    ctx.fillRect(x-6, y-10, 12, 1);
    ctx.fillRect(x-6, y-3, 12, 1);
    // Top rim
    ctx.fillStyle = '#0e2a5a';
    ctx.fillRect(x-6, y-12, 12, 1);

    if (d.lit) {
      const t = performance.now() / 60;
      const flick = (Math.sin(t) + 1) * 0.5;
      // Flames
      ctx.fillStyle = '#ff2200';
      ctx.fillRect(x-4, y-15, 8, 3);
      ctx.fillStyle = '#ff8800';
      ctx.fillRect(x-3, y-17 - (flick>0.5?1:0), 6, 3);
      ctx.fillStyle = '#ffe060';
      ctx.fillRect(x-2, y-18 - (flick>0.7?1:0), 4, 2);
      ctx.fillStyle = '#fff5b0';
      ctx.fillRect(x-1, y-19, 2, 1);
    }
  }

  function drawShakaPickup(p) {
    const x = p.x|0, y = (p.y + (p.bob || 0))|0;
    // Hand: orange/skin colored shaka silhouette
    ctx.fillStyle = '#e8b48a';
    // palm
    ctx.fillRect(x-2, y-1, 4, 4);
    // thumb (out left)
    ctx.fillRect(x-4, y-1, 2, 2);
    // pinky (out right)
    ctx.fillRect(x+2, y-2, 2, 3);
    // wrist
    ctx.fillRect(x-2, y+3, 4, 2);
    // shine sparkle
    const spk = (Math.sin(p.t * 0.2) > 0) ? '#fff7a0' : '#ffffff';
    ctx.fillStyle = spk;
    ctx.fillRect(x-5, y-4, 1, 1);
    ctx.fillRect(x+4, y-5, 1, 1);
    ctx.fillRect(x, y-6, 1, 1);
  }

  function drawCoffeePickup(p) {
    const x = p.x|0, y = (p.y + (p.bob || 0))|0;
    // Steam wisps (animated)
    const s = (p.t / 6)|0;
    ctx.fillStyle = '#dfe5ee';
    ctx.fillRect(x-2, y-7 + (s%2), 1, 1);
    ctx.fillRect(x,   y-8 + ((s+1)%2), 1, 1);
    ctx.fillRect(x+2, y-7 + (s%2), 1, 1);
    ctx.fillRect(x-1, y-9 + (s%2), 1, 1);
    ctx.fillRect(x+1, y-9 + ((s+1)%2), 1, 1);
    // Cup body (white ceramic)
    ctx.fillStyle = '#f4ede1';
    ctx.fillRect(x-3, y-3, 6, 6);
    // Coffee surface (brown)
    ctx.fillStyle = '#3a1d09';
    ctx.fillRect(x-2, y-3, 4, 1);
    // Crema highlight
    ctx.fillStyle = '#7a4a1c';
    ctx.fillRect(x-1, y-3, 2, 1);
    // Cup shading
    ctx.fillStyle = '#c8bfac';
    ctx.fillRect(x+2, y-2, 1, 4);
    // Handle (dark outline + interior)
    ctx.fillStyle = '#3a1818';
    ctx.fillRect(x+3, y-2, 2, 1);
    ctx.fillRect(x+4, y-1, 1, 2);
    ctx.fillRect(x+3, y+1, 2, 1);
    // Saucer
    ctx.fillStyle = '#c8bfac';
    ctx.fillRect(x-4, y+3, 8, 1);
    ctx.fillStyle = '#9a8e76';
    ctx.fillRect(x-4, y+4, 8, 1);
    // Sparkle
    const spk = (Math.sin(p.t * 0.2) > 0) ? '#fff7a0' : '#ffffff';
    ctx.fillStyle = spk;
    ctx.fillRect(x-5, y-5, 1, 1);
    ctx.fillRect(x+5, y-4, 1, 1);
  }

  function drawGirder(f) {
    ctx.fillStyle = '#d33a2c';
    ctx.fillRect(f.x0, f.y, f.x1 - f.x0, GIRDER_H);
    ctx.fillStyle = '#ff7a5c';
    ctx.fillRect(f.x0, f.y, f.x1 - f.x0, 1);
    ctx.fillStyle = '#7a1d12';
    ctx.fillRect(f.x0, f.y + GIRDER_H - 1, f.x1 - f.x0, 1);
    ctx.fillStyle = '#a82418';
    for (let x = f.x0 + 2; x < f.x1 - 2; x += 6) {
      ctx.fillRect(x, f.y + 2, 2, 2);
    }
  }
  function drawLadder(l) {
    ctx.fillStyle = '#ffd84a';
    ctx.fillRect(l.x - LADDER_W/2, l.top, 2, l.bot - l.top);
    ctx.fillRect(l.x + LADDER_W/2 - 2, l.top, 2, l.bot - l.top);
    for (let y = l.top + 3; y < l.bot - 1; y += 5) {
      ctx.fillRect(l.x - LADDER_W/2 + 2, y, LADDER_W - 4, 1);
    }
  }

  function drawPlayer() {
    if (!player.alive) {
      ctx.fillStyle = '#c41a1a';
      ctx.fillRect(player.x - 2, player.y + player.h - 4, player.w + 4, 4);
      return;
    }
    // Smash power-up: flicker with golden aura
    if (player.smashT > 0) {
      const halo = (player.smashT % 6) < 3;
      if (halo) {
        ctx.fillStyle = 'rgba(255,207,0,0.45)';
        ctx.fillRect(player.x - 2, player.y - 2, player.w + 4, player.h + 4);
      }
    }
    // Coffee power-up: speed-line trail behind facing direction
    if (player.coffeeT > 0) {
      ctx.fillStyle = 'rgba(170,255,170,0.35)';
      const dir = player.facing < 0 ? 1 : -1;
      ctx.fillRect(player.x + dir * 4, player.y + 2, 3, player.h - 4);
      ctx.fillRect(player.x + dir * 7, player.y + 5, 2, player.h - 9);
    }
    // i-frames flash
    if (player.iframes > 0 && (player.iframes % 6) < 3) return;
    drawSprite(player.x, player.y, playerSprite, playerPalette, 1, player.facing < 0);
  }

  function render() {
    // Background
    ctx.fillStyle = '#080812';
    ctx.fillRect(0, 0, W, H);
    for (let i = 0; i < 30; i++) {
      const sx = (i * 53) % W;
      const sy = (i * 37) % Math.max(8, topFloorY - 8);
      ctx.fillStyle = i % 5 === 0 ? '#ffd0d0' : '#5a5a7a';
      ctx.fillRect(sx, sy, 1, 1);
    }

    for (const f of floors) drawGirder(f);
    for (const l of ladders) drawLadder(l);

    // Oil drum sits on ground floor
    drawOilDrum(oilDrum);

    // Sammy + always-on shaka emoji burst around him
    drawSammy(ctx, sammy.x, sammy.y, false);
    drawShakas(ctx, gameShakas);

    // Trophy
    drawTrophy(trophy.x, trophy.y);

    // Pickups
    for (const p of pickups) if (!p.dead) (p.type === 'coffee' ? drawCoffeePickup : drawShakaPickup)(p);

    // Barrels
    for (const b of barrels) if (!b.dead) drawCigarBarrel(b);

    // Fireballs
    for (const fb of fireballs) if (!fb.dead) drawFireball(fb);

    drawPlayer();

    // HUD
    ctx.fillStyle = '#fff';
    ctx.font = '8px "Courier New", monospace';
    ctx.textAlign = 'left';
    ctx.fillText('SCORE ' + String(score).padStart(5,'0'), 6, 10);
    ctx.fillText('LIVES ' + lives, W - 56, 10);
    ctx.fillStyle = '#ff3b3b';
    ctx.fillText('SAMMY KONG', W/2 - 30, 10);

    // Power-up timer bars (smash on top, coffee below)
    if (player.smashT > 0) {
      ctx.fillStyle = '#000';
      ctx.fillRect(W/2 - 32, 14, 64, 4);
      ctx.fillStyle = '#ffcf00';
      ctx.fillRect(W/2 - 31, 15, (62 * player.smashT/360)|0, 2);
    }
    if (player.coffeeT > 0) {
      const yBar = player.smashT > 0 ? 20 : 14;
      ctx.fillStyle = '#000';
      ctx.fillRect(W/2 - 32, yBar, 64, 4);
      ctx.fillStyle = '#7cd97c';
      ctx.fillRect(W/2 - 31, yBar + 1, (62 * player.coffeeT/360)|0, 2);
    }

    // Level indicator
    ctx.fillStyle = '#ffcf00';
    ctx.fillText('STAGE ' + level + '/' + LEVELS.length, 6, 20);
    ctx.fillStyle = '#888';
    ctx.fillText(LEVELS[level - 1].name, 6, 30);

    if (levelIntroT > 0 && state === 'play') {
      banner('STAGE ' + level, LEVELS[level - 1].name);
    } else if (state === 'dead') {
      banner('OUCH!', lives > 1 ? 'tap / press jump' : 'GAME OVER');
    } else if (state === 'win') {
      const more = level < LEVELS.length;
      banner(more ? 'STAGE CLEAR!' : 'YOU SAVED THE TROPHY!',
             more ? 'tap / press jump for next stage'
                  : 'tap / press jump to play again');
    }
  }
  function banner(a, b) {
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    ctx.fillRect(0, H/2 - 24, W, 48);
    ctx.fillStyle = '#ffcf00';
    ctx.font = 'bold 14px "Courier New", monospace';
    ctx.textAlign = 'center';
    ctx.fillText(a, W/2, H/2 - 4);
    ctx.fillStyle = '#fff';
    ctx.font = '8px "Courier New", monospace';
    ctx.fillText(b, W/2, H/2 + 10);
    ctx.textAlign = 'left';
  }

  // ---- Title card (DK-style arcade title screen) ----
  let titleMode = 'main'; // 'main' | 'gameover' | 'youwin'

  // Chunky 5x7 pixel font for the big SAMMY KONG letters
  const BIG_FONT = {
    S: [".XXXX","X....","X....",".XXX.","....X","....X","XXXX."],
    A: [".XXX.","X...X","X...X","XXXXX","X...X","X...X","X...X"],
    M: ["X...X","XX.XX","X.X.X","X.X.X","X...X","X...X","X...X"],
    Y: ["X...X","X...X",".X.X.","..X..","..X..","..X..","..X.."],
    K: ["X...X","X..X.","X.X..","XX...","X.X..","X..X.","X...X"],
    O: [".XXX.","X...X","X...X","X...X","X...X","X...X",".XXX."],
    N: ["X...X","XX..X","X.X.X","X..XX","X...X","X...X","X...X"],
    G: [".XXXX","X....","X....","X..XX","X...X","X...X",".XXXX"],
  };

  function drawBigText(g, text, cx, top, block) {
    const letterW = 5 * block;
    const letterH = 7 * block;
    const gap = block;
    const totalW = text.length * letterW + Math.max(0, text.length - 1) * gap;
    let x = (cx - totalW / 2) | 0;
    const BLUE    = '#3858f8';
    const BLUE_HL = '#7898ff';
    const BLUE_DK = '#1828a8';
    for (const ch of text) {
      const grid = BIG_FONT[ch];
      if (grid) {
        for (let r = 0; r < 7; r++) {
          for (let c = 0; c < 5; c++) {
            if (grid[r][c] !== 'X') continue;
            const px = x + c * block;
            const py = top + r * block;
            g.fillStyle = BLUE;
            g.fillRect(px, py, block, block);
            g.fillStyle = BLUE_HL;
            g.fillRect(px, py, 1, 1);
            g.fillStyle = BLUE_DK;
            g.fillRect(px + block - 1, py + block - 1, 1, 1);
          }
        }
      }
      x += letterW + gap;
    }
  }

  function paintTitleCard() {
    const tc = document.getElementById('titleSammy');
    if (!tc) return;
    const tg = tc.getContext('2d');
    tg.imageSmoothingEnabled = false;
    const tw = tc.width, th = tc.height;

    // Background
    tg.fillStyle = '#000';
    tg.fillRect(0, 0, tw, th);

    // ----- Top score bar -----
    tg.font = 'bold 9px "Courier New", monospace';
    tg.textAlign = 'left';
    tg.fillStyle = '#ff3b3b';
    tg.fillText('1UP', 14, 12);
    tg.fillText('HIGH SCORE', 84, 12);
    tg.fillStyle = '#ffcf00';
    tg.fillText('L=' + String(level).padStart(2, '0'), 184, 12);
    tg.fillStyle = '#ffffff';
    tg.fillText(String(score).padStart(6, '0'), 14, 24);
    tg.fillText('010000', 92, 24);

    // ----- BIG title: SAMMY / KONG -----
    drawBigText(tg, 'SAMMY', tw / 2, 40, 4);
    drawBigText(tg, 'KONG',  tw / 2, 80, 4);

    // TM mark in green to the right of KONG
    tg.fillStyle = '#3ade3a';
    tg.font = 'bold 8px "Courier New", monospace';
    tg.fillText('TM', tw / 2 + 50, 96);

    // ----- State-specific banner under the title -----
    if (titleMode === 'gameover') {
      tg.fillStyle = '#ff3b3b';
      tg.font = 'bold 14px "Courier New", monospace';
      tg.textAlign = 'center';
      tg.fillText('GAME OVER', tw / 2, 134);
    } else if (titleMode === 'youwin') {
      tg.fillStyle = '#ffcf00';
      tg.font = 'bold 12px "Courier New", monospace';
      tg.textAlign = 'center';
      tg.fillText('YOU SAVED THE TROPHY!', tw / 2, 134);
    }

    // ----- Sammy character below the title with shaka emoji burst -----
    titleShakaTimer--;
    if (titleShakaTimer <= 0) {
      spawnShaka(titleShakas, tw / 2, 168, 32);
      titleShakaTimer = 8 + ((Math.random() * 10) | 0);
    }
    updateShakas(titleShakas);

    drawSammy(tg, tw / 2, 184, false);
    drawShakas(tg, titleShakas);

    // Sammy stands on a tiny "girder" plinth (red beam, like the floors)
    tg.fillStyle = '#d33a2c';
    tg.fillRect(tw / 2 - 30, 184, 60, 6);
    tg.fillStyle = '#ff7a5c';
    tg.fillRect(tw / 2 - 30, 184, 60, 1);
    tg.fillStyle = '#7a1d12';
    tg.fillRect(tw / 2 - 30, 189, 60, 1);

    // ----- Footer -----
    tg.font = '8px "Courier New", monospace';
    tg.textAlign = 'center';
    tg.fillStyle = '#ffffff';
    tg.fillText('© 2026  SAMMYWARE INC.', tw / 2, 222);

    // Push start prompt (blinking)
    if ((Math.floor(performance.now() / 500) % 2) === 0) {
      tg.fillStyle = '#ffcf00';
      tg.font = 'bold 9px "Courier New", monospace';
      tg.fillText('PUSH START', tw / 2, 244);
    }

    tg.textAlign = 'left';
  }

  // Re-paint the title every frame so PUSH START blinks and Sammy stays current
  function tickTitle() {
    if (state === 'title') paintTitleCard();
    requestAnimationFrame(tickTitle);
  }
  tickTitle();

  // ---- Main loop ----
  function tick() {
    if (state === 'play') {
      levelTime++;
      updatePlayer();
      // Always-on shaka emoji burst around Sammy
      gameShakaTimer--;
      if (gameShakaTimer <= 0) {
        spawnShaka(gameShakas, sammy.x, sammy.y - 18, 24);
        gameShakaTimer = 14 + ((Math.random() * 14) | 0);
      }
      updateShakas(gameShakas);
      barrelTimer--;
      if (barrelTimer <= 0) {
        spawnBarrel();
        barrelTimer = barrelInterval() + ((Math.random() * 43)|0);
      }
      pickupTimer--;
      if (pickupTimer <= 0 && pickups.filter(p=>!p.dead).length === 0) {
        spawnPickup();
        pickupTimer = 60 * (15 + (Math.random()*10)|0);
      }
      fireballTimer--;
      if (fireballTimer <= 0 && fireballs.length < 1 + Math.floor(difficulty()/3)) {
        if (oilDrum.lit) spawnFireball();
        fireballTimer = 60 * (8 + (Math.random()*6)|0);
      }
      for (const b of barrels) updateBarrel(b);
      for (const fb of fireballs) updateFireball(fb);
      for (const p of pickups) updatePickup(p);
      for (let i = barrels.length - 1; i >= 0; i--) if (barrels[i].dead) barrels.splice(i,1);
      for (let i = fireballs.length - 1; i >= 0; i--) if (fireballs[i].dead) fireballs.splice(i,1);
      for (let i = pickups.length - 1; i >= 0; i--) if (pickups[i].dead) pickups.splice(i,1);
      if (oilDrum.flameT > 0) oilDrum.flameT--;
      if (levelIntroT > 0) levelIntroT--;
    } else if (state === 'dead' || state === 'win') {
      if (keys.jump) {
        keys.jump = false;
        if (state === 'dead') {
          lives--;
          if (lives <= 0) {
            state = 'title';
            titleMode = 'gameover';
            document.getElementById('title').style.display = 'flex';
            document.getElementById('startBtn').textContent = 'TRY AGAIN';
          } else {
            // Respawn at start of current level (keep level + score)
            reset(false);
            state = 'play';
          }
        } else {
          // Advance to next level, or finish the run
          if (level < LEVELS.length) {
            level++;
            score += 500; // stage clear bonus
            reset(false);
            state = 'play';
          } else {
            state = 'title';
            titleMode = 'youwin';
            document.getElementById('title').style.display = 'flex';
            document.getElementById('startBtn').textContent = 'PLAY AGAIN';
          }
        }
      }
    }
    render();
    requestAnimationFrame(tick);
  }
  tick();
})();
</script>
</body>
</html>
