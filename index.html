<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Sammy Kong</title>
<style>
  :root { color-scheme: dark; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #000;
    font-family: "Courier New", monospace;
    color: #fff;
    overflow: hidden;
    touch-action: none;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  #wrap {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
  }
  #game {
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    background: #000;
    display: block;
    /* Fill viewport while preserving 256x288 aspect ratio */
    width: min(100vw, calc(100dvh * 256 / 288));
    height: min(100dvh, calc(100vw * 288 / 256));
  }
  /* On touch devices, reserve the bottom slice for the d-pad/jump */
  body.mobile #wrap {
    inset: 0 0 30dvh 0;
  }
  body.mobile #game {
    width: min(100vw, calc(70dvh * 256 / 288));
    height: min(70dvh, calc(100vw * 288 / 256));
  }
  #title {
    position: fixed; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: rgba(0,0,0,0.9);
    text-align: center; padding: 16px;
    z-index: 10;
  }
  #title h1 {
    font-size: 44px; margin: 0 0 6px;
    color: #ff3b3b; letter-spacing: 4px;
    text-shadow: 3px 3px 0 #000, 0 0 12px #ff0000;
  }
  #title h2 {
    font-size: 14px; margin: 0 0 14px;
    color: #ffcf00; letter-spacing: 4px;
  }
  #title p { margin: 6px 0; font-size: 13px; max-width: 320px; }
  #titleSammy {
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    width: 168px; height: 224px;
    margin: 8px 0;
  }
  #title button {
    margin-top: 14px; padding: 14px 26px;
    background: #ffcf00; color: #000; border: 3px solid #fff;
    font: bold 18px "Courier New", monospace; letter-spacing: 2px;
    cursor: pointer;
  }
  #title button:active { transform: translate(1px,1px); }
  .touch {
    position: fixed; bottom: 0; left: 0; right: 0;
    display: none; justify-content: space-between;
    padding: 14px; pointer-events: none;
  }
  .pad {
    display: grid;
    --c: clamp(52px, 18vw, 78px);
    grid-template-columns: var(--c) var(--c) var(--c);
    grid-template-rows: var(--c) var(--c) var(--c);
    gap: 4px;
  }
  .btn {
    pointer-events: auto;
    background: rgba(255,255,255,0.10);
    border: 2px solid rgba(255,255,255,0.55);
    color: #fff; font: bold 28px "Courier New", monospace;
    display: flex; align-items: center; justify-content: center;
    border-radius: 10px;
    -webkit-user-select: none; user-select: none;
  }
  .btn.active { background: rgba(255,207,0,0.3); border-color: #ffcf00; }
  .jump {
    width: clamp(88px, 28vw, 130px);
    height: clamp(88px, 28vw, 130px);
    align-self: end; font-size: 22px;
    background: rgba(255,207,0,0.15);
    border-color: rgba(255,207,0,0.7);
  }
  body.mobile .touch { display: flex; }
  body.mobile #title button { padding: 18px 32px; font-size: 20px; }
</style>
</head>
<body>
<div id="wrap"><canvas id="game" width="256" height="288"></canvas></div>

<div id="title">
  <h1>SAMMY KONG</h1>
  <h2>~ 1981 ~</h2>
  <canvas id="titleSammy" width="42" height="56"></canvas>
  <p>Climb the girders. Dodge the cigar barrels.<br>Watch out for the fireballs. Rescue the trophy.</p>
  <p style="opacity:.7">Arrows / WASD &middot; Space to jump<br>Grab a SHAKA to smash barrels</p>
  <button id="startBtn">START</button>
</div>

<div class="touch" id="touch">
  <div class="pad">
    <div></div>
    <div class="btn" data-key="up">&#9650;</div>
    <div></div>
    <div class="btn" data-key="left">&#9664;</div>
    <div></div>
    <div class="btn" data-key="right">&#9654;</div>
    <div></div>
    <div class="btn" data-key="down">&#9660;</div>
    <div></div>
  </div>
  <div style="display:flex;align-items:flex-end;">
    <div class="btn jump" data-key="jump">JUMP</div>
  </div>
</div>

<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  ctx.imageSmoothingEnabled = false;
  const W = canvas.width, H = canvas.height;

  if (matchMedia('(pointer: coarse)').matches || 'ontouchstart' in window) {
    document.body.classList.add('mobile');
  }

  // ---- Input ----
  const keys = { left:false, right:false, up:false, down:false, jump:false };
  const keyMap = {
    ArrowLeft:'left', KeyA:'left',
    ArrowRight:'right', KeyD:'right',
    ArrowUp:'up', KeyW:'up',
    ArrowDown:'down', KeyS:'down',
    Space:'jump', KeyJ:'jump', KeyZ:'jump',
  };
  addEventListener('keydown', e => {
    const k = keyMap[e.code]; if (!k) return;
    keys[k] = true; e.preventDefault();
  });
  addEventListener('keyup', e => {
    const k = keyMap[e.code]; if (!k) return;
    keys[k] = false; e.preventDefault();
  });
  document.querySelectorAll('.btn').forEach(btn => {
    const k = btn.dataset.key;
    const press = e => { keys[k] = true; btn.classList.add('active'); e.preventDefault(); };
    const release = e => { keys[k] = false; btn.classList.remove('active'); e.preventDefault(); };
    btn.addEventListener('touchstart', press, {passive:false});
    btn.addEventListener('touchend', release, {passive:false});
    btn.addEventListener('touchcancel', release, {passive:false});
    btn.addEventListener('mousedown', press);
    btn.addEventListener('mouseup', release);
    btn.addEventListener('mouseleave', release);
  });

  // ---- Level geometry ----
  const GIRDER_H = 6;
  const floors = [
    { y: 264, x0: 0,   x1: 256 },
    { y: 224, x0: 16,  x1: 256 },
    { y: 184, x0: 0,   x1: 240 },
    { y: 144, x0: 16,  x1: 256 },
    { y: 104, x0: 0,   x1: 240 },
    { y: 64,  x0: 16,  x1: 200 },
  ];
  const ladders = [
    { x: 220, top: floors[1].y, bot: floors[0].y },
    { x: 40,  top: floors[2].y, bot: floors[1].y },
    { x: 200, top: floors[3].y, bot: floors[2].y },
    { x: 60,  top: floors[4].y, bot: floors[3].y },
    { x: 180, top: floors[5].y, bot: floors[4].y },
  ];
  const LADDER_W = 12;

  const trophy  = { x: 180, y: floors[5].y - 12 };
  const sammy   = { x: 50, y: floors[5].y, throwT: 0, blink: 0 };
  const oilDrum = { x: 24, y: floors[0].y, lit: false, flameT: 0 };

  // ---- Player ----
  const player = {
    x: 230, y: floors[0].y - 14,
    w: 10, h: 14,
    vx: 0, vy: 0,
    onGround: true,
    onLadder: false,
    facing: -1,
    alive: true,
    win: false,
    walkT: 0,
    smashT: 0, // shaka power-up timer
    iframes: 0,
  };

  const GRAVITY = 0.35;
  const MOVE_SPEED = 1.1;
  const CLIMB_SPEED = 0.9;
  const JUMP_V = -4.6;

  // ---- Entities ----
  const barrels = [];
  const fireballs = [];
  const pickups = [];

  let barrelTimer = 90;
  let pickupTimer = 60 * 12; // first pickup ~12s
  let fireballTimer = 60 * 8;
  let levelTime = 0;
  let score = 0;
  let lives = 3;
  let state = 'title';

  function difficulty() { return Math.min(10, Math.floor(levelTime / 600)); }
  function barrelInterval() { return Math.max(64, 157 - difficulty() * 10); }

  function reset(full=false) {
    player.x = 230; player.y = floors[0].y - player.h;
    player.vx = 0; player.vy = 0;
    player.onGround = true; player.onLadder = false; player.ladder = null;
    player.alive = true; player.win = false;
    player.smashT = 0; player.iframes = 30;
    player.facing = -1;
    barrels.length = 0;
    fireballs.length = 0;
    pickups.length = 0;
    barrelTimer = 60;
    pickupTimer = 60 * 12;
    fireballTimer = 60 * 8;
    levelTime = 0;
    sammy.throwT = 0;
    oilDrum.lit = false; oilDrum.flameT = 0;
    if (full) { score = 0; lives = 3; }
  }

  function start() {
    reset(true);
    state = 'play';
    document.getElementById('title').style.display = 'none';
  }
  document.getElementById('startBtn').addEventListener('click', start);

  // ---- Helpers ----
  function floorAt(x, y) {
    for (const f of floors) {
      if (Math.abs(y - f.y) < 1.5 && x >= f.x0 - 2 && x <= f.x1 + 2) return f;
    }
    return null;
  }
  function floorBelow(x, y) {
    let best = null;
    for (const f of floors) {
      if (f.y >= y && x >= f.x0 && x <= f.x1) {
        if (!best || f.y < best.y) best = f;
      }
    }
    return best;
  }
  function ladderAt(x, y) {
    for (const l of ladders) {
      if (Math.abs(x - l.x) <= LADDER_W/2 && y >= l.top - 4 && y <= l.bot + 4) return l;
    }
    return null;
  }

  // ---- Barrels ----
  function spawnBarrel() {
    barrels.push({
      x: sammy.x + 12, y: floors[5].y - 4,
      vx: 1.4, vy: 0,
      onFloor: floors[5],
      rot: 0,
    });
    sammy.throwT = 18;
    // Occasionally spawn a second barrel after a delay (high difficulty)
    if (difficulty() >= 4 && Math.random() < 0.21) {
      setTimeout(() => {
        if (state === 'play') {
          barrels.push({
            x: sammy.x + 12, y: floors[5].y - 4,
            vx: 1.4, vy: 0, onFloor: floors[5], rot: 0,
          });
          sammy.throwT = 18;
        }
      }, 500);
    }
  }

  function updateBarrel(b) {
    if (b.onFloor) {
      b.x += b.vx;
      if (b.vx > 0 && b.x > b.onFloor.x1 - 4) {
        b.onFloor = null;
      } else if (b.vx < 0 && b.x < b.onFloor.x0 + 4) {
        b.onFloor = null;
      } else {
        for (const l of ladders) {
          if (l.top === b.onFloor.y && Math.abs(b.x - l.x) < 1.8 && Math.random() < 0.32) {
            b.onFloor = null;
            b.descendingLadder = l;
            b.vx = 0;
            break;
          }
        }
      }
    } else if (b.descendingLadder) {
      b.y += 1.8;
      b.x = b.descendingLadder.x;
      if (b.y >= b.descendingLadder.bot - 4) {
        const f = floors.find(f => f.y === b.descendingLadder.bot);
        b.onFloor = f;
        b.y = f.y - 4;
        b.vx = (Math.random() < 0.5 ? -1 : 1) * 1.4;
        b.descendingLadder = null;
      }
    } else {
      b.vy += GRAVITY;
      b.y += b.vy;
      const f = floorBelow(b.x, b.y);
      if (f && b.y >= f.y - 4) {
        b.onFloor = f;
        b.y = f.y - 4;
        b.vy = 0;
        // Keep rolling the same direction so barrels cascade off the
        // stack instead of zigzagging back and forth on each platform.
        if (b.vx === 0) b.vx = (b.x < W/2 ? 1 : -1) * 1.4;
        else b.vx = Math.sign(b.vx) * 1.4;
      }
    }
    b.rot += b.vx * 0.2;

    // Hit oil drum on bottom floor — light it & destroy barrel, maybe spawn fireball
    if (b.onFloor === floors[0] && Math.abs(b.x - oilDrum.x) < 7) {
      b.dead = true;
      oilDrum.lit = true;
      oilDrum.flameT = 30;
      if (Math.random() < 0.45 && fireballs.length < 3) spawnFireball();
    }

    if (b.y > H + 20) b.dead = true;
  }

  // ---- Fireballs ----
  function spawnFireball() {
    fireballs.push({
      x: oilDrum.x, y: floors[0].y - 6,
      vx: (Math.random() < 0.5 ? -0.55 : 0.55),
      onFloor: floors[0],
      climbing: null,
      flick: 0,
    });
  }

  function updateFireball(fb) {
    fb.flick = (fb.flick + 1) % 8;
    if (fb.climbing) {
      const l = fb.climbing;
      fb.y += fb.climbDir * 0.5;
      fb.x = l.x;
      if (fb.climbDir < 0 && fb.y <= l.top - 2) {
        // reached top
        const f = floors.find(f => f.y === l.top);
        fb.onFloor = f; fb.y = f.y - 6;
        fb.climbing = null;
        fb.vx = (Math.random() < 0.5 ? -0.55 : 0.55);
      } else if (fb.climbDir > 0 && fb.y >= l.bot - 6) {
        const f = floors.find(f => f.y === l.bot);
        fb.onFloor = f; fb.y = f.y - 6;
        fb.climbing = null;
        fb.vx = (Math.random() < 0.5 ? -0.55 : 0.55);
      }
      return;
    }
    if (!fb.onFloor) return;
    fb.x += fb.vx;
    // Turn around at edges
    if (fb.x < fb.onFloor.x0 + 3) { fb.x = fb.onFloor.x0 + 3; fb.vx = Math.abs(fb.vx); }
    if (fb.x > fb.onFloor.x1 - 3) { fb.x = fb.onFloor.x1 - 3; fb.vx = -Math.abs(fb.vx); }
    // Random ladder use
    for (const l of ladders) {
      if ((l.top === fb.onFloor.y || l.bot === fb.onFloor.y) &&
          Math.abs(fb.x - l.x) < 1.5 && Math.random() < 0.012) {
        fb.climbing = l;
        fb.climbDir = (l.bot === fb.onFloor.y) ? -1 : 1;
        fb.x = l.x;
        break;
      }
    }
  }

  // ---- Pickups (shaka power-up) ----
  function spawnPickup() {
    // Place on a random non-top, non-bottom floor at random x
    const fIdx = 1 + Math.floor(Math.random() * 4);
    const f = floors[fIdx];
    const x = f.x0 + 20 + Math.random() * (f.x1 - f.x0 - 40);
    pickups.push({ x, y: f.y - 8, t: 0, type: 'shaka' });
  }
  function updatePickup(p) {
    p.t++;
    p.bob = Math.sin(p.t * 0.12) * 1.5;
  }

  // ---- Player update ----
  function updatePlayer() {
    if (!player.alive || player.win) return;
    if (player.iframes > 0) player.iframes--;
    if (player.smashT > 0) player.smashT--;

    const cx = player.x + player.w/2;
    const feetY = player.y + player.h;

    const lFeet = ladderAt(cx, feetY);
    const lMid  = ladderAt(cx, player.y + player.h/2);
    const lAny  = lFeet || lMid;

    if (!player.onLadder) {
      if (lAny && (keys.up && lAny.bot - feetY > -2 && feetY - lAny.top > -2)) {
        player.onLadder = true;
        player.ladder = lAny;
        player.x = lAny.x - player.w/2;
        player.vy = 0;
      } else if (lAny && keys.down && player.onGround) {
        const floor = floorAt(cx, feetY);
        if (floor && floor.y === lAny.top) {
          player.onLadder = true;
          player.ladder = lAny;
          player.x = lAny.x - player.w/2;
          player.y += 2;
          player.vy = 0;
        }
      }
    }

    if (player.onLadder) {
      const l = player.ladder;
      player.vx = 0; player.vy = 0;
      if (keys.up) player.y -= CLIMB_SPEED;
      else if (keys.down) player.y += CLIMB_SPEED;
      // Auto-dismount onto upper floor as soon as feet reach its top
      if (player.y + player.h <= l.top) {
        player.onLadder = false;
        player.ladder = null;
        player.y = l.top - player.h;
        player.onGround = true;
      } else if (player.y + player.h >= l.bot) {
        player.onLadder = false;
        player.ladder = null;
        player.y = l.bot - player.h;
        player.onGround = true;
      } else if ((keys.left || keys.right) && Math.abs((player.y + player.h) - l.top) < 3) {
        // Step off sideways near the top
        player.onLadder = false;
        player.ladder = null;
        player.y = l.top - player.h;
        player.onGround = true;
      }
    }

    if (!player.onLadder) {
      player.vx = 0;
      if (keys.left)  { player.vx = -MOVE_SPEED; player.facing = -1; }
      if (keys.right) { player.vx =  MOVE_SPEED; player.facing =  1; }
      player.x += player.vx;
      if (player.vx !== 0 && player.onGround) player.walkT += 0.2;

      if (keys.jump && player.onGround) {
        player.vy = JUMP_V;
        player.onGround = false;
        keys.jump = false;
      }

      player.vy += GRAVITY;
      if (player.vy > 6) player.vy = 6;
      const prevFeet = player.y + player.h;
      player.y += player.vy;
      const newFeet = player.y + player.h;

      player.onGround = false;
      if (player.vy >= 0) {
        for (const f of floors) {
          if (cx >= f.x0 && cx <= f.x1 && prevFeet <= f.y + 0.5 && newFeet >= f.y) {
            player.y = f.y - player.h;
            player.vy = 0;
            player.onGround = true;
            break;
          }
        }
      }

      if (player.x < 0) player.x = 0;
      if (player.x + player.w > W) player.x = W - player.w;
    }

    // Trophy collision
    if (Math.abs((player.x + player.w/2) - trophy.x) < 8 &&
        Math.abs((player.y + player.h/2) - trophy.y) < 10) {
      player.win = true;
      state = 'win';
      score += 1000;
    }

    // Pickup collision
    for (const p of pickups) {
      if (p.dead) continue;
      const dx = (player.x + player.w/2) - p.x;
      const dy = (player.y + player.h/2) - p.y;
      if (Math.abs(dx) < 8 && Math.abs(dy) < 9) {
        p.dead = true;
        score += 500;
        player.smashT = 360;
      }
    }

    // Barrel collision
    for (const b of barrels) {
      if (b.dead) continue;
      const dx = (player.x + player.w/2) - b.x;
      const dy = (player.y + player.h/2) - b.y;
      if (Math.abs(dx) < 7 && Math.abs(dy) < 8) {
        if (player.smashT > 0) {
          b.dead = true;
          score += 200;
        } else if (player.iframes <= 0) {
          player.alive = false;
          state = 'dead';
        }
      } else if (!b.scored && b.onFloor && Math.abs(dy) > 6 && Math.abs(dy) < 14 &&
                 Math.abs(dx) < 10 && !player.onGround) {
        b.scored = true;
        score += 100;
      }
    }

    // Fireball collision
    for (const fb of fireballs) {
      const dx = (player.x + player.w/2) - fb.x;
      const dy = (player.y + player.h/2) - fb.y;
      if (Math.abs(dx) < 6 && Math.abs(dy) < 8) {
        if (player.smashT > 0) {
          fb.dead = true;
          score += 300;
        } else if (player.iframes <= 0) {
          player.alive = false;
          state = 'dead';
        }
      }
    }
  }

  // ---- Drawing ----

  // Procedural Sammy: receded silver hair + matching white goatee/mustache,
  // faint silver glasses, big crinkled smile with teeth, navy suit with
  // notched lapels, blue dress shirt and medium-blue tie.
  // Optional shaka pose with arms raised.
  // (cx, footY) places his feet on a girder.
  function drawSammy(g, cx, footY, throwing) {
    const headW = 16, headH = 16;
    const bodyH = 14;
    const top = footY - bodyH - headH;
    const fx = cx - headW/2;
    const fy = top + 2;

    const SKIN        = '#e8b48a';
    const SKIN_SHADE  = '#b87f4f';
    const SKIN_HI     = '#f0c89a';
    const HAIR        = '#f5f5f5';
    const HAIR_SHADE  = '#c8c8c8';
    const TEETH       = '#fff5dc';
    const MOUTH       = '#3a1818';
    const SUIT        = '#0e1f33';
    const SUIT_HL     = '#1f4476';
    const SUIT_DK     = '#050d18';
    const SHIRT       = '#7ab3e0';
    const TIE         = '#2e6cb8';
    const TIE_HL      = '#5fa8e8';
    const FRAME       = '#9ea4ad';

    // ---- Face skin (slightly oval) ----
    g.fillStyle = SKIN;
    g.fillRect(fx + 1, fy, headW - 2, headH);     // main face
    g.fillRect(fx,     fy + 3, headW, headH - 6); // cheek widen
    g.fillRect(fx + 3, fy + headH, headW - 6, 1); // chin under

    // ---- Hair (receded: full crown, side temples, forehead skin shows) ----
    // Crown (above forehead)
    g.fillStyle = HAIR_SHADE;
    g.fillRect(fx + 1, fy - 3, headW - 2, 1);
    g.fillRect(fx,     fy - 2, headW,     1);
    g.fillStyle = HAIR;
    g.fillRect(fx + 2, fy - 4, headW - 4, 1);
    g.fillRect(fx + 1, fy - 3, headW - 2, 1);
    g.fillRect(fx + 1, fy - 1, headW - 2, 1);
    // Receded hairline: hair only at corners on row fy, skin between
    g.fillRect(fx + 1, fy,     2, 1);
    g.fillRect(fx + headW-3, fy, 2, 1);
    // Hair sides (temples down past brow)
    g.fillStyle = HAIR;
    g.fillRect(fx,     fy,     1, 4);
    g.fillRect(fx + headW-1, fy, 1, 4);
    g.fillStyle = HAIR_SHADE;
    g.fillRect(fx - 1, fy + 1, 1, 3);
    g.fillRect(fx + headW, fy + 1, 1, 3);

    // Subtle hairline shadow on forehead
    g.fillStyle = SKIN_SHADE;
    g.fillRect(fx + 4, fy + 1, headW - 8, 1);

    // ---- Ears (tiny) ----
    g.fillStyle = SKIN_SHADE;
    g.fillRect(fx - 1, fy + 7, 1, 3);
    g.fillRect(fx + headW, fy + 7, 1, 3);

    // ---- Glasses (thin silver, barely visible) ----
    g.fillStyle = FRAME;
    // left lens
    g.fillRect(fx + 2, fy + 5, 5, 1);
    g.fillRect(fx + 2, fy + 8, 5, 1);
    g.fillRect(fx + 2, fy + 6, 1, 2);
    g.fillRect(fx + 6, fy + 6, 1, 2);
    // right lens
    g.fillRect(fx + 9, fy + 5, 5, 1);
    g.fillRect(fx + 9, fy + 8, 5, 1);
    g.fillRect(fx + 9, fy + 6, 1, 2);
    g.fillRect(fx + 13, fy + 6, 1, 2);
    // bridge & temple arms
    g.fillRect(fx + 7, fy + 6, 2, 1);
    g.fillRect(fx + 1, fy + 6, 1, 1);
    g.fillRect(fx + 14, fy + 6, 1, 1);
    // lens shine
    g.fillStyle = '#dde9f5';
    g.fillRect(fx + 3, fy + 6, 1, 1);
    g.fillRect(fx + 10, fy + 6, 1, 1);

    // ---- Eyes (smiling slits) + crinkles ----
    g.fillStyle = '#1a1a1a';
    g.fillRect(fx + 4, fy + 7, 2, 1);
    g.fillRect(fx + 11, fy + 7, 2, 1);
    // crow's-feet hints
    g.fillStyle = SKIN_SHADE;
    g.fillRect(fx + 1, fy + 7, 1, 1);
    g.fillRect(fx + headW - 2, fy + 7, 1, 1);

    // ---- Cheek highlights (raised from smile) ----
    g.fillStyle = SKIN_HI;
    g.fillRect(fx + 2, fy + 10, 2, 1);
    g.fillRect(fx + headW - 4, fy + 10, 2, 1);

    // ---- Nose ----
    g.fillStyle = SKIN_SHADE;
    g.fillRect(fx + 7, fy + 9, 2, 2);
    g.fillRect(fx + 8, fy + 11, 1, 1);

    // ---- Mustache (wide white, slight droop at outer corners) ----
    g.fillStyle = HAIR;
    g.fillRect(fx + 3, fy + 11, headW - 6, 1);
    g.fillRect(fx + 4, fy + 12, headW - 8, 1);

    // ---- Smile (full grin with visible teeth) ----
    g.fillStyle = MOUTH;
    g.fillRect(fx + 4, fy + 13, headW - 8, 2);
    g.fillStyle = TEETH;
    g.fillRect(fx + 5, fy + 13, headW - 10, 1);
    // smile corners curl up (dimples)
    g.fillStyle = MOUTH;
    g.fillRect(fx + 3, fy + 13, 1, 1);
    g.fillRect(fx + headW - 4, fy + 13, 1, 1);
    g.fillStyle = SKIN_SHADE;
    g.fillRect(fx + 2, fy + 12, 1, 1);
    g.fillRect(fx + headW - 3, fy + 12, 1, 1);

    // ---- Goatee (wider triangular, white) ----
    g.fillStyle = HAIR;
    g.fillRect(fx + 4, fy + 15, headW - 8, 1);
    g.fillRect(fx + 5, fy + 16, headW - 10, 1);
    g.fillRect(fx + 6, fy + 17, headW - 12, 1);

    // ---- Body — navy suit ----
    const bx = cx - 12, by = top + headH + 2;
    g.fillStyle = SUIT;
    g.fillRect(bx, by, 24, bodyH);
    // shoulder highlight
    g.fillStyle = SUIT_HL;
    g.fillRect(bx, by, 2, 5);
    g.fillRect(bx + 22, by, 2, 5);
    // bottom shadow
    g.fillStyle = SUIT_DK;
    g.fillRect(bx, by + bodyH - 2, 24, 2);

    // ---- Lapels (notched V) ----
    g.fillStyle = SUIT_DK;
    // left lapel inner edge
    g.fillRect(bx + 7, by, 1, 6);
    g.fillRect(bx + 8, by + 1, 1, 5);
    g.fillRect(bx + 9, by + 2, 1, 3);
    // right lapel inner edge
    g.fillRect(bx + 16, by, 1, 6);
    g.fillRect(bx + 15, by + 1, 1, 5);
    g.fillRect(bx + 14, by + 2, 1, 3);
    // lapel highlights
    g.fillStyle = SUIT_HL;
    g.fillRect(bx + 6, by + 1, 1, 4);
    g.fillRect(bx + 17, by + 1, 1, 4);

    // ---- Shirt collar (blue) ----
    g.fillStyle = SHIRT;
    g.fillRect(bx + 10, by, 4, 2);
    g.fillRect(bx + 11, by + 2, 2, 1);

    // ---- Tie (medium blue with knot) ----
    g.fillStyle = TIE;
    g.fillRect(bx + 11, by + 3, 2, 1);   // knot top
    g.fillRect(bx + 10, by + 4, 4, 3);   // knot
    g.fillRect(bx + 11, by + 7, 2, 5);   // tie body
    g.fillRect(bx + 11, by + 12, 2, 1);  // tip
    // tie highlight
    g.fillStyle = TIE_HL;
    g.fillRect(bx + 11, by + 4, 1, 1);
    g.fillRect(bx + 11, by + 8, 1, 2);

    // ---- Arms ----
    if (throwing) {
      // Shaka pose - arms raised at sides
      g.fillStyle = SUIT;
      g.fillRect(bx - 3, by - 2, 4, 5);
      g.fillRect(bx + 23, by - 2, 4, 5);
      g.fillRect(bx - 5, by - 5, 4, 4);
      g.fillRect(bx + 25, by - 5, 4, 4);
      g.fillStyle = SUIT_HL;
      g.fillRect(bx - 5, by - 5, 1, 4);
      g.fillRect(bx + 28, by - 5, 1, 4);
      // hands
      g.fillStyle = SKIN;
      g.fillRect(bx - 6, by - 7, 4, 3);
      g.fillRect(bx + 26, by - 7, 4, 3);
      // shaka thumbs out
      g.fillRect(bx - 8, by - 6, 2, 1);
      g.fillRect(bx + 30, by - 6, 2, 1);
      // pinkies up
      g.fillRect(bx - 3, by - 9, 1, 2);
      g.fillRect(bx + 29, by - 9, 1, 2);
    } else {
      g.fillStyle = SUIT;
      g.fillRect(bx - 2, by + 2, 3, 8);
      g.fillRect(bx + 23, by + 2, 3, 8);
      g.fillStyle = SKIN;
      g.fillRect(bx - 2, by + 10, 3, 2);
      g.fillRect(bx + 23, by + 10, 3, 2);
    }

    // ---- Legs / shoes ----
    g.fillStyle = SUIT_DK;
    g.fillRect(bx + 6, by + bodyH, 4, 2);
    g.fillRect(bx + 14, by + bodyH, 4, 2);
    g.fillStyle = '#1a1a1a';
    g.fillRect(bx + 5, by + bodyH + 2, 5, 1);
    g.fillRect(bx + 14, by + bodyH + 2, 5, 1);
  }

  function drawSprite(sx, sy, grid, palette, scale=1, flip=false) {
    for (let r = 0; r < grid.length; r++) {
      const row = grid[r];
      for (let c = 0; c < row.length; c++) {
        const ch = row[c];
        if (ch === '.' || ch === ' ') continue;
        const col = palette[ch];
        if (!col) continue;
        const dx = flip ? (row.length - 1 - c) : c;
        ctx.fillStyle = col;
        ctx.fillRect((sx + dx*scale)|0, (sy + r*scale)|0, scale, scale);
      }
    }
  }

  const playerSprite = [
    "...HHHH...",
    "..HFFFFH..",
    ".HFEFFEFH.",
    ".HFFFFFFH.",
    "..HFFFFH..",
    "...MMMM...",
    "..MMSSMM..",
    ".MMSSSSMM.",
    ".MSSSSSSM.",
    ".MSSSSSSM.",
    ".PPP..PPP.",
    ".PPP..PPP.",
    "..PP..PP..",
    "..BB..BB..",
  ];
  const playerPalette = {
    H: '#3a1a05', F: '#e9c39a', E: '#101010',
    M: '#c41a1a', S: '#ffffff', P: '#1d4a8a', B: '#3a1a05',
  };

  function drawCigarBarrel(b) {
    ctx.save();
    ctx.translate(b.x|0, b.y|0);
    ctx.rotate(b.rot);
    ctx.fillStyle = '#6b3a1a';
    ctx.fillRect(-6, -3, 12, 6);
    ctx.fillStyle = '#8a4f24';
    ctx.fillRect(-6, -3, 12, 1);
    ctx.fillStyle = '#4a2510';
    ctx.fillRect(-6,  2, 12, 1);
    ctx.fillStyle = '#3a1a05';
    ctx.fillRect(-2, -3, 1, 6);
    ctx.fillRect(2, -3, 1, 6);
    ctx.fillStyle = '#ffae22';
    ctx.fillRect(5, -2, 1, 4);
    ctx.fillStyle = '#ff3500';
    ctx.fillRect(6, -1, 1, 2);
    ctx.fillStyle = '#bcbcbc';
    ctx.fillRect(-7, -2, 1, 4);
    ctx.restore();
  }

  function drawFireball(fb) {
    const x = fb.x|0, y = fb.y|0;
    const f = fb.flick;
    ctx.fillStyle = '#ff2200';
    ctx.fillRect(x-3, y-2, 6, 5);
    ctx.fillStyle = '#ff8800';
    ctx.fillRect(x-2, y-1, 4, 3);
    ctx.fillStyle = '#ffe060';
    ctx.fillRect(x-1, y, 2, 1);
    // flickering tongues
    ctx.fillStyle = '#ff5500';
    ctx.fillRect(x - 1, y - 4 + (f<4?0:1), 1, 2);
    ctx.fillRect(x + 1, y - 5 + (f<4?1:0), 1, 2);
    // little legs
    ctx.fillStyle = '#1a1a1a';
    ctx.fillRect(x - 2, y + 3, 1, 2);
    ctx.fillRect(x + 1, y + 3, 1, 2);
    // eyes
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(x - 1, y - 1, 1, 1);
    ctx.fillRect(x + 1, y - 1, 1, 1);
  }

  function drawTrophy(x, y) {
    ctx.fillStyle = '#ffcf00';
    ctx.fillRect(x-5, y, 10, 6);
    ctx.fillRect(x-6, y-1, 12, 2);
    ctx.fillRect(x-7, y+1, 1, 3);
    ctx.fillRect(x+6, y+1, 1, 3);
    ctx.fillRect(x-1, y+6, 2, 3);
    ctx.fillRect(x-4, y+9, 8, 2);
    ctx.fillStyle = '#fff7a0';
    ctx.fillRect(x-4, y+1, 2, 3);
    const s = (Math.sin(performance.now()/200) > 0) ? '#ffffff' : '#fff7a0';
    ctx.fillStyle = s;
    ctx.fillRect(x+2, y-2, 1, 1);
  }

  function drawOilDrum(d) {
    const x = d.x|0, y = d.y|0;
    // Drum body
    ctx.fillStyle = '#1d4ea0';
    ctx.fillRect(x-6, y-12, 12, 12);
    ctx.fillStyle = '#2e6fd0';
    ctx.fillRect(x-6, y-12, 1, 12);
    ctx.fillStyle = '#0e2a5a';
    ctx.fillRect(x+5, y-12, 1, 12);
    // Bands
    ctx.fillStyle = '#ffd84a';
    ctx.fillRect(x-6, y-10, 12, 1);
    ctx.fillRect(x-6, y-3, 12, 1);
    // Top rim
    ctx.fillStyle = '#0e2a5a';
    ctx.fillRect(x-6, y-12, 12, 1);

    if (d.lit) {
      const t = performance.now() / 60;
      const flick = (Math.sin(t) + 1) * 0.5;
      // Flames
      ctx.fillStyle = '#ff2200';
      ctx.fillRect(x-4, y-15, 8, 3);
      ctx.fillStyle = '#ff8800';
      ctx.fillRect(x-3, y-17 - (flick>0.5?1:0), 6, 3);
      ctx.fillStyle = '#ffe060';
      ctx.fillRect(x-2, y-18 - (flick>0.7?1:0), 4, 2);
      ctx.fillStyle = '#fff5b0';
      ctx.fillRect(x-1, y-19, 2, 1);
    }
  }

  function drawShakaPickup(p) {
    const x = p.x|0, y = (p.y + (p.bob || 0))|0;
    // Hand: orange/skin colored shaka silhouette
    ctx.fillStyle = '#e8b48a';
    // palm
    ctx.fillRect(x-2, y-1, 4, 4);
    // thumb (out left)
    ctx.fillRect(x-4, y-1, 2, 2);
    // pinky (out right)
    ctx.fillRect(x+2, y-2, 2, 3);
    // wrist
    ctx.fillRect(x-2, y+3, 4, 2);
    // shine sparkle
    const spk = (Math.sin(p.t * 0.2) > 0) ? '#fff7a0' : '#ffffff';
    ctx.fillStyle = spk;
    ctx.fillRect(x-5, y-4, 1, 1);
    ctx.fillRect(x+4, y-5, 1, 1);
    ctx.fillRect(x, y-6, 1, 1);
  }

  function drawGirder(f) {
    ctx.fillStyle = '#d33a2c';
    ctx.fillRect(f.x0, f.y, f.x1 - f.x0, GIRDER_H);
    ctx.fillStyle = '#ff7a5c';
    ctx.fillRect(f.x0, f.y, f.x1 - f.x0, 1);
    ctx.fillStyle = '#7a1d12';
    ctx.fillRect(f.x0, f.y + GIRDER_H - 1, f.x1 - f.x0, 1);
    ctx.fillStyle = '#a82418';
    for (let x = f.x0 + 2; x < f.x1 - 2; x += 6) {
      ctx.fillRect(x, f.y + 2, 2, 2);
    }
  }
  function drawLadder(l) {
    ctx.fillStyle = '#ffd84a';
    ctx.fillRect(l.x - LADDER_W/2, l.top, 2, l.bot - l.top);
    ctx.fillRect(l.x + LADDER_W/2 - 2, l.top, 2, l.bot - l.top);
    for (let y = l.top + 3; y < l.bot - 1; y += 5) {
      ctx.fillRect(l.x - LADDER_W/2 + 2, y, LADDER_W - 4, 1);
    }
  }

  function drawPlayer() {
    if (!player.alive) {
      ctx.fillStyle = '#c41a1a';
      ctx.fillRect(player.x - 2, player.y + player.h - 4, player.w + 4, 4);
      return;
    }
    // Smash power-up: flicker with golden aura
    if (player.smashT > 0) {
      const halo = (player.smashT % 6) < 3;
      if (halo) {
        ctx.fillStyle = 'rgba(255,207,0,0.45)';
        ctx.fillRect(player.x - 2, player.y - 2, player.w + 4, player.h + 4);
      }
    }
    // i-frames flash
    if (player.iframes > 0 && (player.iframes % 6) < 3) return;
    drawSprite(player.x, player.y, playerSprite, playerPalette, 1, player.facing < 0);
  }

  function render() {
    // Background
    ctx.fillStyle = '#080812';
    ctx.fillRect(0, 0, W, H);
    for (let i = 0; i < 30; i++) {
      const sx = (i * 53) % W;
      const sy = (i * 37) % (floors[5].y - 8);
      ctx.fillStyle = i % 5 === 0 ? '#ffd0d0' : '#5a5a7a';
      ctx.fillRect(sx, sy, 1, 1);
    }

    for (const f of floors) drawGirder(f);
    for (const l of ladders) drawLadder(l);

    // Oil drum sits on ground floor
    drawOilDrum(oilDrum);

    // Sammy
    drawSammy(ctx, sammy.x, sammy.y, sammy.throwT > 0);

    // Trophy
    drawTrophy(trophy.x, trophy.y);

    // Pickups
    for (const p of pickups) if (!p.dead) drawShakaPickup(p);

    // Barrels
    for (const b of barrels) if (!b.dead) drawCigarBarrel(b);

    // Fireballs
    for (const fb of fireballs) if (!fb.dead) drawFireball(fb);

    drawPlayer();

    // HUD
    ctx.fillStyle = '#fff';
    ctx.font = '8px "Courier New", monospace';
    ctx.textAlign = 'left';
    ctx.fillText('SCORE ' + String(score).padStart(5,'0'), 6, 10);
    ctx.fillText('LIVES ' + lives, W - 56, 10);
    ctx.fillStyle = '#ff3b3b';
    ctx.fillText('SAMMY KONG', W/2 - 30, 10);

    // Smash timer bar
    if (player.smashT > 0) {
      ctx.fillStyle = '#000';
      ctx.fillRect(W/2 - 32, 14, 64, 4);
      ctx.fillStyle = '#ffcf00';
      ctx.fillRect(W/2 - 31, 15, (62 * player.smashT/360)|0, 2);
    }

    // Difficulty indicator
    ctx.fillStyle = '#888';
    ctx.fillText('LV' + (difficulty()+1), 6, 20);

    if (state === 'dead') {
      banner('OUCH!', lives > 1 ? 'tap / press jump' : 'GAME OVER');
    } else if (state === 'win') {
      banner('YOU GOT THE TROPHY!', 'tap / press jump to play again');
    }
  }
  function banner(a, b) {
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    ctx.fillRect(0, H/2 - 24, W, 48);
    ctx.fillStyle = '#ffcf00';
    ctx.font = 'bold 14px "Courier New", monospace';
    ctx.textAlign = 'center';
    ctx.fillText(a, W/2, H/2 - 4);
    ctx.fillStyle = '#fff';
    ctx.font = '8px "Courier New", monospace';
    ctx.fillText(b, W/2, H/2 + 10);
    ctx.textAlign = 'left';
  }

  // Render Sammy (idle) onto the title canvas
  (function paintTitleSammy() {
    const tc = document.getElementById('titleSammy');
    const tg = tc.getContext('2d');
    tg.imageSmoothingEnabled = false;
    tg.clearRect(0, 0, tc.width, tc.height);
    drawSammy(tg, 21, 50, false);
  })();

  // ---- Main loop ----
  function tick() {
    if (state === 'play') {
      levelTime++;
      updatePlayer();
      if (sammy.throwT > 0) sammy.throwT--;
      barrelTimer--;
      if (barrelTimer <= 0) {
        spawnBarrel();
        barrelTimer = barrelInterval() + ((Math.random() * 43)|0);
      }
      pickupTimer--;
      if (pickupTimer <= 0 && pickups.filter(p=>!p.dead).length === 0) {
        spawnPickup();
        pickupTimer = 60 * (15 + (Math.random()*10)|0);
      }
      fireballTimer--;
      if (fireballTimer <= 0 && fireballs.length < 1 + Math.floor(difficulty()/3)) {
        if (oilDrum.lit) spawnFireball();
        fireballTimer = 60 * (8 + (Math.random()*6)|0);
      }
      for (const b of barrels) updateBarrel(b);
      for (const fb of fireballs) updateFireball(fb);
      for (const p of pickups) updatePickup(p);
      for (let i = barrels.length - 1; i >= 0; i--) if (barrels[i].dead) barrels.splice(i,1);
      for (let i = fireballs.length - 1; i >= 0; i--) if (fireballs[i].dead) fireballs.splice(i,1);
      for (let i = pickups.length - 1; i >= 0; i--) if (pickups[i].dead) pickups.splice(i,1);
      if (oilDrum.flameT > 0) oilDrum.flameT--;
    } else if (state === 'dead' || state === 'win') {
      if (keys.jump) {
        keys.jump = false;
        if (state === 'dead') {
          lives--;
          if (lives <= 0) {
            state = 'title';
            document.getElementById('title').style.display = 'flex';
            document.querySelector('#title h1').textContent = 'GAME OVER';
            document.getElementById('startBtn').textContent = 'TRY AGAIN';
          } else {
            reset(false);
            state = 'play';
          }
        } else {
          reset(true);
          state = 'play';
        }
      }
    }
    render();
    requestAnimationFrame(tick);
  }
  tick();
})();
</script>
</body>
</html>
