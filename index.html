<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a1428">
<title>Defend the Capitol</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #0a1428;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: #e8eef7;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior: none;
  }
  #game {
    display: block;
    width: 100vw;
    height: 100vh;
    touch-action: none;
  }
  .overlay {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
    box-sizing: border-box;
    background: rgba(10, 20, 40, 0.92);
    z-index: 10;
  }
  .overlay.hidden { display: none; }
  .overlay h1 {
    font-size: clamp(28px, 7vw, 48px);
    margin: 0 0 12px;
    letter-spacing: 1px;
  }
  .overlay h2 {
    font-size: clamp(22px, 6vw, 36px);
    margin: 0 0 12px;
  }
  .overlay p {
    font-size: clamp(14px, 4vw, 18px);
    max-width: 480px;
    line-height: 1.5;
    margin: 6px 0;
    color: #aab8d0;
  }
  .overlay button {
    margin-top: 24px;
    padding: 14px 32px;
    font-size: clamp(16px, 4.5vw, 20px);
    background: #2a7a3a;
    color: white;
    border: none;
    border-radius: 8px;
    font-weight: 600;
    cursor: pointer;
    touch-action: manipulation;
  }
  .overlay button:active { background: #1f5e2c; }
  .accent { color: #6fcf97; }
  .warn { color: #eb5757; }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="startScreen" class="overlay">
  <h1>Defend the <span class="accent">Capitol</span></h1>
  <p>Corporate <span class="accent">$</span> are descending on the Hawaii State Capitol.</p>
  <p>Shoot them down before they buy the building.</p>
  <p style="margin-top:18px;font-size:0.9em;">Drag to move &middot; Tap or hold to fire</p>
  <button id="startBtn">Start</button>
</div>

<div id="endScreen" class="overlay hidden">
  <h2 id="endTitle">The Capitol has been bought.</h2>
  <p id="endStats"></p>
  <button id="restartBtn">Play Again</button>
</div>

<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');

  // Virtual resolution (portrait). All game logic uses these coords.
  const VW = 800;
  const VH = 1200;
  let scale = 1;
  let offsetX = 0;
  let offsetY = 0;

  function resize() {
    const dpr = window.devicePixelRatio || 1;
    const cssW = window.innerWidth;
    const cssH = window.innerHeight;
    canvas.width = Math.floor(cssW * dpr);
    canvas.height = Math.floor(cssH * dpr);
    canvas.style.width = cssW + 'px';
    canvas.style.height = cssH + 'px';
    // Fit virtual resolution into the canvas, letterboxing as needed.
    const sx = canvas.width / VW;
    const sy = canvas.height / VH;
    scale = Math.min(sx, sy);
    offsetX = (canvas.width - VW * scale) / 2;
    offsetY = (canvas.height - VH * scale) / 2;
  }
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', resize);
  resize();

  // Map a CSS-pixel touch/mouse point to virtual coords.
  function toVirtual(clientX, clientY) {
    const rect = canvas.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    const px = (clientX - rect.left) * dpr;
    const py = (clientY - rect.top) * dpr;
    return {
      x: (px - offsetX) / scale,
      y: (py - offsetY) / scale
    };
  }

  // ---------- Game state ----------
  const state = {
    running: false,
    player: { x: VW / 2, y: VH - 180, w: 80, h: 36, cooldown: 0 },
    bullets: [],
    invaders: [],
    invaderBullets: [],
    particles: [],
    bonus: null,
    dir: 1,
    speed: 40,         // px/sec horizontal
    descend: 28,       // px per edge bounce
    fireRate: 0.28,    // seconds between player shots
    firing: false,
    score: 0,
    wave: 1,
    capitolHeight: 140,
    capitol: null,
    smokeTimer: 0,
    over: false,
    won: false
  };

  const PILLAR_COUNT = 8;
  const CAPITOL_MAX_HP = 6; // 4 pillars + dome cracked + dome destroyed

  function newCapitol() {
    return {
      maxHp: CAPITOL_MAX_HP,
      hp: CAPITOL_MAX_HP,
      destroyedPillars: new Set(),
      domeCracked: false,
      domeDestroyed: false
    };
  }

  function pillarCenterX(i) {
    const cx = VW / 2;
    const w = 520;
    const left = cx - w / 2;
    const pillarW = 28;
    const pillarGap = (w - pillarW * PILLAR_COUNT) / (PILLAR_COUNT - 1);
    return left + i * (pillarW + pillarGap) + pillarW / 2;
  }

  function damageCapitol(x) {
    const c = state.capitol;
    if (!c || c.hp <= 0) return;
    c.hp--;
    const dmg = c.maxHp - c.hp; // 1..maxHp
    if (dmg <= 4) {
      // Destroy the pillar nearest the impact x.
      const remaining = [];
      for (let p = 0; p < PILLAR_COUNT; p++) if (!c.destroyedPillars.has(p)) remaining.push(p);
      let pick = remaining[0];
      let bestDist = Math.abs(pillarCenterX(pick) - x);
      for (const p of remaining) {
        const d = Math.abs(pillarCenterX(p) - x);
        if (d < bestDist) { bestDist = d; pick = p; }
      }
      c.destroyedPillars.add(pick);
      const px = pillarCenterX(pick);
      spawnParticles(px, VH - 80, '#cfd6df');
      spawnParticles(px, VH - 60, '#8a96aa');
    } else if (dmg === 5) {
      c.domeCracked = true;
      spawnParticles(VW / 2, VH - state.capitolHeight, '#9aa7bd');
    } else {
      c.domeDestroyed = true;
      for (let i = -1; i <= 1; i++) {
        spawnParticles(VW / 2 + i * 40, VH - state.capitolHeight + 10, '#9aa7bd');
      }
    }
    if (c.hp <= 0) endGame(false);
  }

  const ROWS = 5;
  const COLS = 8;
  const ROW_COLORS = ['#eb5757', '#f2994a', '#f2c94c', '#6fcf97', '#56ccf2'];
  const ROW_LABEL = ['Mega PAC', 'Lobbyist', 'Industry', 'Trade Group', 'Small Donor'];

  function spawnWave() {
    state.invaders.length = 0;
    const marginX = 100;
    const marginY = 140;
    const spacingX = (VW - marginX * 2) / (COLS - 1);
    const spacingY = 70;
    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        state.invaders.push({
          x: marginX + c * spacingX,
          y: marginY + r * spacingY,
          row: r,
          alive: true,
          w: 50,
          h: 50
        });
      }
    }
    state.dir = 1;
    state.speed = 40 + (state.wave - 1) * 12;
  }

  function startGame() {
    state.score = 0;
    state.wave = 1;
    state.bullets.length = 0;
    state.invaderBullets.length = 0;
    state.particles.length = 0;
    state.bonus = null;
    state.player.x = VW / 2;
    state.player.cooldown = 0;
    state.capitol = newCapitol();
    state.smokeTimer = 0;
    state.over = false;
    state.won = false;
    state.running = true;
    spawnWave();
    document.getElementById('startScreen').classList.add('hidden');
    document.getElementById('endScreen').classList.add('hidden');
  }

  function endGame(won) {
    state.running = false;
    state.over = true;
    state.won = won;
    const title = document.getElementById('endTitle');
    const stats = document.getElementById('endStats');
    if (won) {
      title.textContent = 'Campaign finance defended!';
      title.className = 'accent';
    } else {
      title.textContent = 'The Capitol has been bought.';
      title.className = 'warn';
    }
    stats.textContent = `Score: ${state.score}  ·  Wave: ${state.wave}`;
    document.getElementById('endScreen').classList.remove('hidden');
  }

  // ---------- Input ----------
  let dragActive = false;
  let dragOffsetX = 0;

  function pressAt(vx, vy) {
    state.firing = true;
    // If the touch is near or below the player, treat as a drag handle.
    if (vy > VH * 0.45) {
      dragActive = true;
      dragOffsetX = state.player.x - vx;
    }
  }
  function moveAt(vx) {
    if (!dragActive) return;
    let nx = vx + dragOffsetX;
    nx = Math.max(state.player.w / 2, Math.min(VW - state.player.w / 2, nx));
    state.player.x = nx;
  }
  function release() {
    state.firing = false;
    dragActive = false;
  }

  canvas.addEventListener('touchstart', (e) => {
    e.preventDefault();
    if (!state.running) return;
    const t = e.changedTouches[0];
    const p = toVirtual(t.clientX, t.clientY);
    pressAt(p.x, p.y);
  }, { passive: false });
  canvas.addEventListener('touchmove', (e) => {
    e.preventDefault();
    if (!state.running) return;
    const t = e.changedTouches[0];
    const p = toVirtual(t.clientX, t.clientY);
    moveAt(p.x);
  }, { passive: false });
  canvas.addEventListener('touchend', (e) => {
    e.preventDefault();
    release();
  }, { passive: false });
  canvas.addEventListener('touchcancel', (e) => {
    e.preventDefault();
    release();
  }, { passive: false });

  canvas.addEventListener('mousedown', (e) => {
    if (!state.running) return;
    const p = toVirtual(e.clientX, e.clientY);
    pressAt(p.x, p.y);
  });
  canvas.addEventListener('mousemove', (e) => {
    if (!state.running) return;
    const p = toVirtual(e.clientX, e.clientY);
    moveAt(p.x);
  });
  window.addEventListener('mouseup', release);

  const keys = {};
  window.addEventListener('keydown', (e) => {
    keys[e.key] = true;
    if (e.key === ' ') state.firing = true;
  });
  window.addEventListener('keyup', (e) => {
    keys[e.key] = false;
    if (e.key === ' ') state.firing = false;
  });

  document.getElementById('startBtn').addEventListener('click', startGame);
  document.getElementById('restartBtn').addEventListener('click', startGame);

  // ---------- Update ----------
  function fireBullet() {
    state.bullets.push({
      x: state.player.x,
      y: state.player.y - state.player.h / 2,
      vy: -900,
      w: 5,
      h: 14
    });
    state.player.cooldown = state.fireRate;
  }

  function invaderShoot() {
    // Bottom-most living invader in a random column fires.
    const cols = new Map();
    for (const inv of state.invaders) {
      if (!inv.alive) continue;
      const key = Math.round(inv.x);
      const cur = cols.get(key);
      if (!cur || inv.y > cur.y) cols.set(key, inv);
    }
    const shooters = [...cols.values()];
    if (!shooters.length) return;
    const s = shooters[Math.floor(Math.random() * shooters.length)];
    state.invaderBullets.push({
      x: s.x,
      y: s.y + s.h / 2,
      vy: 360,
      w: 6,
      h: 14
    });
  }

  let invaderShootTimer = 0;
  let bonusTimer = 8;

  function update(dt) {
    if (!state.running) return;

    // Keyboard movement
    const kSpeed = 520;
    if (keys['ArrowLeft'] || keys['a']) state.player.x -= kSpeed * dt;
    if (keys['ArrowRight'] || keys['d']) state.player.x += kSpeed * dt;
    state.player.x = Math.max(state.player.w / 2, Math.min(VW - state.player.w / 2, state.player.x));

    // Player firing
    state.player.cooldown -= dt;
    if (state.firing && state.player.cooldown <= 0) fireBullet();

    // Player bullets
    for (const b of state.bullets) b.y += b.vy * dt;
    state.bullets = state.bullets.filter(b => b.y + b.h > 0);

    // Invader movement
    let minX = Infinity, maxX = -Infinity, maxY = -Infinity;
    let aliveCount = 0;
    for (const inv of state.invaders) {
      if (!inv.alive) continue;
      aliveCount++;
      minX = Math.min(minX, inv.x - inv.w / 2);
      maxX = Math.max(maxX, inv.x + inv.w / 2);
      maxY = Math.max(maxY, inv.y + inv.h / 2);
    }
    // Speed ramps as fewer remain.
    const speedMul = 1 + (1 - aliveCount / (ROWS * COLS)) * 2.2;
    const sp = state.speed * speedMul;
    let bounce = false;
    if (aliveCount > 0) {
      const dx = state.dir * sp * dt;
      if (state.dir > 0 && maxX + dx > VW - 30) bounce = true;
      if (state.dir < 0 && minX + dx < 30) bounce = true;
      for (const inv of state.invaders) {
        if (!inv.alive) continue;
        if (bounce) inv.y += state.descend;
        else inv.x += dx;
      }
      if (bounce) state.dir *= -1;
    } else {
      state.wave++;
      spawnWave();
    }

    // Invader shooting
    invaderShootTimer -= dt;
    const shootInterval = Math.max(0.8, 3.2 - state.wave * 0.3);
    if (invaderShootTimer <= 0) {
      invaderShoot();
      invaderShootTimer = shootInterval * (0.6 + Math.random() * 0.8);
    }

    // Bonus "Super PAC" streaker
    bonusTimer -= dt;
    if (!state.bonus && bonusTimer <= 0) {
      const fromLeft = Math.random() < 0.5;
      state.bonus = {
        x: fromLeft ? -60 : VW + 60,
        y: 80,
        vx: fromLeft ? 240 : -240,
        w: 110,
        h: 40
      };
      bonusTimer = 12 + Math.random() * 8;
    }
    if (state.bonus) {
      state.bonus.x += state.bonus.vx * dt;
      if (state.bonus.x < -120 || state.bonus.x > VW + 120) state.bonus = null;
    }

    // Invader bullets
    const capitolTop = VH - state.capitolHeight;
    for (const b of state.invaderBullets) b.y += b.vy * dt;
    state.invaderBullets = state.invaderBullets.filter(b => {
      if (b.y >= capitolTop) {
        damageCapitol(b.x);
        spawnParticles(b.x, capitolTop, '#eb5757');
        return false;
      }
      return b.y < VH;
    });

    // Collisions: player bullets vs invaders
    for (const b of state.bullets) {
      for (const inv of state.invaders) {
        if (!inv.alive) continue;
        if (Math.abs(b.x - inv.x) < inv.w / 2 && Math.abs(b.y - inv.y) < inv.h / 2) {
          inv.alive = false;
          b.y = -100;
          state.score += 10 * (ROWS - inv.row);
          spawnParticles(inv.x, inv.y, ROW_COLORS[inv.row]);
          break;
        }
      }
      // vs bonus
      if (state.bonus) {
        const bn = state.bonus;
        if (Math.abs(b.x - bn.x) < bn.w / 2 && Math.abs(b.y - bn.y) < bn.h / 2) {
          state.score += 250;
          spawnParticles(bn.x, bn.y, '#f2c94c');
          spawnParticles(bn.x - 20, bn.y, '#f2c94c');
          spawnParticles(bn.x + 20, bn.y, '#f2c94c');
          state.bonus = null;
          b.y = -100;
        }
      }
    }
    state.bullets = state.bullets.filter(b => b.y + b.h > 0);

    // Collisions: invader bullets vs player
    const p = state.player;
    for (const b of state.invaderBullets) {
      if (Math.abs(b.x - p.x) < p.w / 2 && Math.abs(b.y - p.y) < p.h / 2) {
        endGame(false);
        return;
      }
    }

    // Invaders that crash into the Capitol chip away at it.
    for (const inv of state.invaders) {
      if (!inv.alive) continue;
      if (inv.y + inv.h / 2 >= capitolTop - 10) {
        inv.alive = false;
        spawnParticles(inv.x, inv.y, ROW_COLORS[inv.row]);
        damageCapitol(inv.x);
        if (state.over) return;
      }
    }

    // Smoke from damaged areas.
    state.smokeTimer -= dt;
    if (state.smokeTimer <= 0 && state.capitol) {
      state.smokeTimer = 0.18;
      const c = state.capitol;
      for (const p of c.destroyedPillars) {
        if (Math.random() < 0.6) emitSmoke(pillarCenterX(p), VH - 80);
      }
      if (c.domeCracked || c.domeDestroyed) {
        emitSmoke(VW / 2 + (Math.random() - 0.5) * 60, VH - state.capitolHeight - 10);
      }
    }

    // Particles
    for (const pt of state.particles) {
      pt.x += pt.vx * dt;
      pt.y += pt.vy * dt;
      pt.life -= dt;
    }
    state.particles = state.particles.filter(pt => pt.life > 0);
  }

  function spawnParticles(x, y, color) {
    for (let i = 0; i < 10; i++) {
      const a = Math.random() * Math.PI * 2;
      const s = 80 + Math.random() * 160;
      state.particles.push({
        x, y,
        vx: Math.cos(a) * s,
        vy: Math.sin(a) * s,
        life: 0.4 + Math.random() * 0.3,
        color
      });
    }
  }

  function emitSmoke(x, y) {
    state.particles.push({
      x: x + (Math.random() - 0.5) * 8,
      y,
      vx: (Math.random() - 0.5) * 30,
      vy: -40 - Math.random() * 40,
      life: 1.2 + Math.random() * 0.6,
      color: '#5a6478',
      smoke: true
    });
  }

  // ---------- Render ----------
  function drawCapitol() {
    // Hawaii State Capitol stylized: open-air pillars + volcano-cone "dome".
    const c = state.capitol;
    const baseY = VH - 20;
    const top = VH - state.capitolHeight;
    const cx = VW / 2;
    const w = 520;
    const left = cx - w / 2;

    // Reflecting pool / base
    ctx.fillStyle = '#1a3050';
    ctx.fillRect(0, baseY - 10, VW, 30);

    // Platform
    ctx.fillStyle = '#cfd6df';
    ctx.fillRect(left - 20, baseY - 16, w + 40, 16);

    // Pillars (skip destroyed; draw rubble stub in their place)
    const pillarW = 28;
    const pillarGap = (w - pillarW * PILLAR_COUNT) / (PILLAR_COUNT - 1);
    const pillarTop = top + 36;
    const pillarBottom = baseY - 16;
    for (let i = 0; i < PILLAR_COUNT; i++) {
      const px = left + i * (pillarW + pillarGap);
      if (c && c.destroyedPillars.has(i)) {
        // Rubble stub
        ctx.fillStyle = '#6c7588';
        ctx.fillRect(px, pillarBottom - 10, pillarW, 10);
        ctx.fillStyle = '#4a5060';
        ctx.fillRect(px + 4, pillarBottom - 14, pillarW - 8, 4);
        // Scorch
        ctx.fillStyle = 'rgba(0,0,0,0.35)';
        ctx.beginPath();
        ctx.ellipse(px + pillarW / 2, pillarBottom - 2, pillarW * 0.7, 4, 0, 0, Math.PI * 2);
        ctx.fill();
      } else {
        ctx.fillStyle = '#e8eef7';
        ctx.fillRect(px, pillarTop, pillarW, pillarBottom - pillarTop);
      }
    }

    // Entablature — sags between destroyed pillar gaps
    ctx.fillStyle = '#cfd6df';
    ctx.fillRect(left - 10, top + 26, w + 20, 14);
    if (c) {
      ctx.fillStyle = '#0a1428';
      for (const i of c.destroyedPillars) {
        const px = left + i * (pillarW + pillarGap);
        // Bite out of the entablature above the missing pillar
        ctx.beginPath();
        ctx.moveTo(px - 4, top + 32);
        ctx.lineTo(px + pillarW / 2, top + 40);
        ctx.lineTo(px + pillarW + 4, top + 32);
        ctx.lineTo(px + pillarW + 4, top + 26);
        ctx.lineTo(px - 4, top + 26);
        ctx.closePath();
        ctx.fill();
      }
    }

    // Dome
    if (!c || !c.domeDestroyed) {
      ctx.fillStyle = '#9aa7bd';
      ctx.beginPath();
      ctx.moveTo(cx - 110, top + 26);
      ctx.lineTo(cx - 60, top - 30);
      ctx.lineTo(cx + 60, top - 30);
      ctx.lineTo(cx + 110, top + 26);
      ctx.closePath();
      ctx.fill();
      // Open crater
      ctx.fillStyle = '#0a1428';
      ctx.beginPath();
      ctx.ellipse(cx, top - 30, 60, 8, 0, 0, Math.PI * 2);
      ctx.fill();

      if (c && c.domeCracked) {
        ctx.strokeStyle = '#0a1428';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(cx - 40, top - 28);
        ctx.lineTo(cx - 20, top - 5);
        ctx.lineTo(cx - 28, top + 8);
        ctx.lineTo(cx + 6, top + 24);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(cx + 30, top - 28);
        ctx.lineTo(cx + 18, top - 6);
        ctx.lineTo(cx + 36, top + 14);
        ctx.stroke();
        ctx.lineWidth = 1;
      }
    } else {
      // Destroyed dome: jagged rubble silhouette
      ctx.fillStyle = '#6c7588';
      ctx.beginPath();
      ctx.moveTo(cx - 110, top + 26);
      ctx.lineTo(cx - 80, top + 6);
      ctx.lineTo(cx - 50, top + 18);
      ctx.lineTo(cx - 20, top - 2);
      ctx.lineTo(cx + 10, top + 14);
      ctx.lineTo(cx + 40, top + 4);
      ctx.lineTo(cx + 80, top + 20);
      ctx.lineTo(cx + 110, top + 26);
      ctx.closePath();
      ctx.fill();
      // Glowing fire
      ctx.fillStyle = 'rgba(235, 87, 87, 0.55)';
      ctx.beginPath();
      ctx.ellipse(cx, top + 18, 40, 6, 0, 0, Math.PI * 2);
      ctx.fill();
    }

    // Flag pole — falls when dome is destroyed
    if (!c || !c.domeDestroyed) {
      ctx.fillStyle = '#cfd6df';
      ctx.fillRect(cx - 1.5, top - 70, 3, 40);
      ctx.fillStyle = '#6fcf97';
      ctx.fillRect(cx + 1.5, top - 70, 22, 14);
    }
  }

  function drawPlayer() {
    const p = state.player;
    // Base
    ctx.fillStyle = '#6fcf97';
    ctx.fillRect(p.x - p.w / 2, p.y - 6, p.w, 14);
    // Cannon
    ctx.fillStyle = '#aef0c4';
    ctx.fillRect(p.x - 6, p.y - p.h / 2, 12, 24);
    // Label
    ctx.fillStyle = '#0a1428';
    ctx.font = 'bold 14px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('REFORM', p.x, p.y + 1);
  }

  function drawInvaders() {
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = 'bold 48px monospace';
    for (const inv of state.invaders) {
      if (!inv.alive) continue;
      ctx.fillStyle = ROW_COLORS[inv.row];
      ctx.fillText('$', inv.x, inv.y);
    }
  }

  function drawBonus() {
    if (!state.bonus) return;
    const b = state.bonus;
    ctx.fillStyle = 'rgba(242, 201, 76, 0.18)';
    ctx.fillRect(b.x - b.w / 2, b.y - b.h / 2, b.w, b.h);
    ctx.fillStyle = '#f2c94c';
    ctx.font = 'bold 28px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('SUPER PAC $$$', b.x, b.y);
  }

  function drawBullets() {
    ctx.fillStyle = '#aef0c4';
    for (const b of state.bullets) ctx.fillRect(b.x - b.w / 2, b.y - b.h / 2, b.w, b.h);
    ctx.fillStyle = '#eb5757';
    for (const b of state.invaderBullets) ctx.fillRect(b.x - b.w / 2, b.y - b.h / 2, b.w, b.h);
  }

  function drawParticles() {
    for (const pt of state.particles) {
      if (pt.smoke) {
        ctx.globalAlpha = Math.max(0, Math.min(0.55, pt.life * 0.5));
        ctx.fillStyle = pt.color;
        const r = 6 + (1.5 - pt.life) * 6;
        ctx.beginPath();
        ctx.arc(pt.x, pt.y, r, 0, Math.PI * 2);
        ctx.fill();
      } else {
        ctx.globalAlpha = Math.max(0, pt.life);
        ctx.fillStyle = pt.color;
        ctx.fillRect(pt.x - 2, pt.y - 2, 4, 4);
      }
    }
    ctx.globalAlpha = 1;
  }

  function drawHUD() {
    ctx.fillStyle = '#aab8d0';
    ctx.font = '20px sans-serif';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'top';
    ctx.fillText(`Score: ${state.score}`, 24, 24);
    ctx.textAlign = 'right';
    ctx.fillText(`Wave ${state.wave}`, VW - 24, 24);

    // Capitol integrity bar
    if (state.capitol) {
      const c = state.capitol;
      const barW = 220;
      const barH = 14;
      const barX = (VW - barW) / 2;
      const barY = 28;
      ctx.fillStyle = '#1a2a4a';
      ctx.fillRect(barX, barY, barW, barH);
      const pct = Math.max(0, c.hp / c.maxHp);
      const color = pct > 0.66 ? '#6fcf97' : pct > 0.33 ? '#f2c94c' : '#eb5757';
      ctx.fillStyle = color;
      ctx.fillRect(barX, barY, barW * pct, barH);
      ctx.strokeStyle = '#aab8d0';
      ctx.lineWidth = 1;
      ctx.strokeRect(barX, barY, barW, barH);
      ctx.fillStyle = '#aab8d0';
      ctx.font = '14px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('CAPITOL INTEGRITY', VW / 2, barY + barH + 4);
    }
  }

  function drawStars() {
    // Static-ish starfield. Seeded pattern.
    ctx.fillStyle = '#1a2a4a';
    for (let i = 0; i < 60; i++) {
      const x = (i * 137.5) % VW;
      const y = (i * 71.3) % (VH - state.capitolHeight - 20);
      ctx.fillRect(x, y, 2, 2);
    }
  }

  function render() {
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = '#0a1428';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.setTransform(scale, 0, 0, scale, offsetX, offsetY);

    drawStars();
    drawCapitol();
    drawInvaders();
    drawBonus();
    drawBullets();
    drawParticles();
    drawPlayer();
    drawHUD();
  }

  // ---------- Loop ----------
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    update(dt);
    render();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
