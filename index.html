<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b0420">
<title>SEWER QUEST '86</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <header id="hud">
      <div class="hud-cell">
        <div class="hud-label">MOVES</div>
        <div class="hud-value" id="moves">0</div>
      </div>
      <div class="hud-cell">
        <div class="hud-label">LEVEL</div>
        <div class="hud-value" id="level">1</div>
      </div>
      <div class="hud-cell">
        <div class="hud-label">PAR</div>
        <div class="hud-value" id="par">--</div>
      </div>
    </header>

    <main id="stage">
      <canvas id="board"></canvas>
      <div id="overlay">
        <div class="panel">
          <h1 id="overlay-title">SEWER QUEST '86</h1>
          <p id="overlay-text">
            Tap pipes to rotate them. Connect the
            <span class="src">CESSPOOL</span> to the
            <span class="snk">TREATMENT PLANT</span> to keep the
            ocean clean.
          </p>
          <button id="overlay-btn">START</button>
        </div>
      </div>
    </main>

    <section id="dock">
      <button id="mute-btn" class="ctl" aria-label="Toggle music">&#9835;</button>
      <div id="status">TAP A PIPE TO ROTATE</div>
      <button id="shuffle-btn" class="ctl" aria-label="New board">NEW BOARD</button>
    </section>
  </div>

  <script src="game.js"></script>
</body>
</html>
